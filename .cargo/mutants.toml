# cargo-mutants configuration — mutation testing of the protocol decision logic.
#
# Mutation testing answers "do our tests actually catch bugs?": cargo-mutants
# injects small behavioral mutations (flip a comparison, drop a `!`, replace a
# return value) into the source and re-runs the tests. A mutant that survives
# (tests still pass) marks a gap in test strength — a place where a real bug of
# that shape would ship undetected.
#
# Scope: the pure decision logic where mutation has the highest signal and the
# cheapest oracle — the session-plan selection ladder, the signaling glare /
# size / gating logic, input validation, and room-code generation. These are
# all exercised by fast in-crate `#[cfg(test)]` unit tests, so the oracle is
# `--lib` (no slow WebSocket e2e per mutant). Broaden `examine_globs` for a
# wider sweep when running locally with more time.
#
# Run:  cargo mutants            (uses this config)
#       cargo mutants --list     (enumerate mutants without testing)
# CI:   .github/workflows/mutation.yml (scheduled + workflow_dispatch)
#       The baseline runs the exact unmutated oracle with:
#       cargo nextest run --lib --features trace-validation --cargo-profile mutants --profile mutants --locked

# Only the in-crate unit tests are the oracle — fast and deterministic. Nextest
# isolates them into processes, and the dedicated `mutants` nextest profile
# terminates any individual test that a progress-removing mutation hangs after
# 10 seconds. This turns nontermination into a caught mutant instead of a
# 120-second outer timeout. Code reachable ONLY from WebSocket e2e tests remains
# out of scope.
test_tool = "nextest"
additional_cargo_test_args = ["--profile", "mutants"]
# Oracle = the in-crate `--lib` unit tests ONLY, passed via `additional_cargo_args`
# (NOT `additional_cargo_test_args`). The distinction is a major speed lever:
# `additional_cargo_test_args` applies `--lib` to the TEST run only, so the
# preceding `cargo test --no-run` BUILD still compiles ALL ~20 integration-test
# binaries (each relinks the whole lib) on every mutant. `additional_cargo_args`
# applies `--lib` to BOTH the build and nextest run, so each mutant only rebuilds
# the lib + its unit-test binary — integration suites are never built or run.
#
# We deliberately enable only `trace-validation`: `src/coordination/mod.rs`
# contains feature-gated delivery-trace adapters whose mutants are otherwise
# vacuously missed by the default-feature oracle. Do NOT pass `--all-features`:
# enabling `tls` (rustls/axum-server) and `legacy-fullmesh`
# (matchbox_signaling) changes neither the generated mutant set (`cargo mutants
# --list` stays aligned with the guarded inventory) nor the catch outcome; it only drags those heavy deps into
# every per-mutant build/relink.
#
# Standing rules (enforced by tests/ci_config_tests.rs::
# test_mutation_oracle_does_not_use_all_features): keep `--lib` in
# `additional_cargo_args`; never re-add `--all-features`. If production behavior
# in a scoped module gains another feature gate, add only that exact minimal
# feature here and to the test's allowed set. Benchmark/test-only feature gates
# may instead be excluded narrowly below with an explicit rationale.
additional_cargo_args = ["--lib", "--features", "trace-validation"]

# High-signal pure-logic modules, plus the delivery contract core.
#
# `src/coordination/mod.rs` (deliver_or_disconnect, ConnectionCloseSignal — the
# #131 delivery contract) is in scope because its in-crate paused-clock unit
# tests kill its mutants under the `--lib` oracle (measured 2026-07-02: 8
# mutants, all caught/unviable except the provably-equivalent one excluded
# below). `src/server/connection_manager.rs` and
# `src/coordination/room_coordinator.rs` are deliberately NOT here: the same
# sweep measured their mutants surviving the `--lib` oracle in bulk (their
# behavior is pinned by the WebSocket e2e suites, which this oracle never
# runs). They belong to the e2e-oracle mutation lane
# (scripts/run-mutants.sh --profile delivery, monthly), not this config.
examine_globs = [
    "src/server/session_policy.rs",
    "src/server/signaling.rs",
    "src/server/relay_policy.rs",
    "src/protocol/validation.rs",
    "src/protocol/room_codes.rs",
    "src/protocol/error_codes.rs",
    "src/coordination/mod.rs",
]

# Never mutate test code or generated/build files.
exclude_globs = [
    "**/*_tests.rs",
    "build.rs",
    "benches/**",
    "tests/**",
    "fuzz/**",
]

# Out-of-scope or provably-equivalent mutants — excluded with justification
# (not test gaps).
#
# `replan_host_session` re-elects the host via `elect_host(electable_authority,
# &electable)`. The `electable_authority` filter (`session_policy.rs:880`,
# `authority.filter(|id| electable.any(|m| m.player_id == id))`) is DELIBERATELY
# redundant: `elect_host` already drops an authority id that is absent from its
# members slice. Flipping that `==` to `!=` changes `electable_authority` between
# `Some(authority)` and `None`, but in every reachable case `elect_host` produces
# the SAME elected host (it re-filters internally), so the mutant is behaviorally
# equivalent and cannot be killed by any test. The filter is kept for explicitness
# (see its doc comment) and `replan_prefers_electable_authority_over_earliest_joiner`
# pins the authority-preference contract regardless.
exclude_re = [
    # This constructor exists only behind `allocation-tracking` so the external
    # allocation benchmark can build a production-shaped classified handle.
    # The mutation oracle deliberately enables only `trace-validation`, while
    # benchmark targets are excluded above. Its behavior is proved by the
    # benchmark's attempt/enqueue/drain ledgers; mutating it under this oracle
    # is necessarily invisible, just like mutating a file under `benches/**`.
    "replace ClientDeliveryHandle::classified_for_allocation_benchmark -> Self with Default::default\\(\\)",
    # Cache eligibility reads negotiated runtime state and changes only whether
    # immutable wire work is reused, never which projection is selected. The
    # pure policy unit test and nightly mixed-encoding backpressure experiment
    # cover that performance result; the --lib mutant oracle cannot observe it.
    "DeliverySender::relay_projection",
    "replace == with != in EnhancedGameServer::replan_host_session",
    # `MessageCoordinator::handle_membership_update`'s default body IS
    # `let _ = update; Ok(())` — the "replace -> anyhow::Result<()> with
    # Ok(())" mutant reproduces the original function verbatim, so it is
    # provably equivalent and unkillable by any test. (The default is a
    # deliberate no-op hook for single-instance deployments; distributed
    # coordinators override it.)
    "replace MessageCoordinator::handle_membership_update -> anyhow::Result<\\(\\)> with Ok\\(\\(\\)\\)",
]

# The unit-test oracle is quick; give a generous floor so a loaded CI runner
# never spuriously times out a surviving-mutant build.
minimum_test_timeout = 120
timeout_multiplier = 3.0
