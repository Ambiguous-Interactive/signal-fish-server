[package]
name = "signal-fish-encoding-study"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
publish = false
license = "MIT"
authors = ["Ambiguous Interactive <eli@theambiguous.co>"]
autobenches = false

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rmp-serde = "1.3.1"
prost = "0.14.4"
ciborium = "0.2.2"
cbor4ii = { version = "1.2.4", features = ["serde1", "use_std"] }
flatbuffers = "25.12.19"
capnp = "0.27.3"
criterion = { version = "0.8.2", default-features = false }
stats_alloc = "0.1.10"
sha2 = "0.11.1"

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "allocations"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
