[package]
name = "signal-fish-server"
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["Ambiguous Interactive <eli@theambiguous.co>"]
description = "A lightweight, in-memory WebSocket signaling server for peer-to-peer game networking"
repository = "https://github.com/Ambiguous-Interactive/signal-fish-server"
keywords = ["gamedev", "signaling", "websocket", "multiplayer", "matchmaking"]
categories = [
    "game-engines",
    "network-programming",
    "web-programming::websocket",
]
rust-version = "1.91.0"
build = "build.rs"
# Keep the published artifact to the server's runtime/library sources and the
# metadata Cargo needs to install it. An allowlist is deliberate: standalone
# test modules, development benchmarks, extended operator documentation,
# repository tooling, planning records, tests, and CI files must not silently
# become crates.io payload.
# Cargo warns that the deliberately omitted test/benchmark targets are
# unavailable in the packaged source; the package inventory regression
# validates that exact warning class.
include = [
    "/src/**",
    "!/src/server/app_admission_tests.rs",
    "!/src/server/game_data_tests.rs",
    "!/src/server/message_coordinator_tests.rs",
    "!/src/server/message_router_tests.rs",
    "!/src/server/ready_state_tests.rs",
    "!/src/server/room_service_tests.rs",
    "!/src/server/session_policy_tests.rs",
    "!/src/server/signaling_tests.rs",
    "/build.rs",
    "/Cargo.lock",
    "/config.example.json",
    "/README.md",
    "/LICENSE",
]

# Release workflows may be retried against older immutable sources. This
# source-owned marker opts only new artifacts into the built-in TLS feature;
# its absence preserves the feature set of historical releases.
[package.metadata.signal-fish-release]
built-in-tls = true

[features]
default = []
legacy-fullmesh = ["matchbox_signaling"]
tls = [
    "axum-server",
    "rustls",
    "rustls-pki-types",
    "tokio-rustls",
    "tower",
]
# Internal verification seam for delivery-contract trace refinement. The feature
# only exposes inert trace hooks; a caller must explicitly attach a recorder to a
# connection.
trace-validation = []
# Dev-only benchmark seam for measuring relay-path heap traffic. The
# instrumented allocator is installed only by the dedicated benchmark binary;
# production binaries never link or select it.
allocation-tracking = []

# The signaling server carries no `unsafe` block and must not acquire one by
# accident. `forbid` (not `deny`) is deliberate: it cannot be re-enabled by a
# local `#[allow(unsafe_code)]`, so adding unsafe here requires editing this
# manifest and defending the change in review.
[lints.rust]
unsafe_code = "forbid"

# Numeric narrowing is always explicit. These lints cover conversions that can
# silently truncate, wrap, or turn negative values into large unsigned values;
# CI promotes them to errors through its existing `-D warnings` Clippy gate.
[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[dependencies]
# Async runtime. `sync` (mpsc/watch delivery channels) and `time` (backpressure
# timeouts) are load-bearing for the no-silent-drop delivery path — keep them
# explicit rather than relying on feature unification from other dependencies.
tokio = { version = "1.52", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rmp = "0.8"
rmp-serde = "1.3"

# Identifiers & time
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = "1.0"
# Parse configured browser origins with the URL Standard's canonical host,
# port, and IP-address rules before comparing their serialized form exactly.
url = "2.5"
# Canonical Unicode composition (NFC) for player-name identity comparison:
# without it, canonically decomposed (NFD) spellings of a taken name pass the
# uniqueness check and join rooms under a visually identical name.
unicode-normalization = "0.1"

# Error handling & logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "json",
    "time",
    "std",
    "ansi",
    "tracing-log",
] }
tracing-appender = "0.2"

# Async utilities
async-trait = "0.1"
futures-util = { version = "0.3", features = ["std"] }

# Performance primitives
bytes = "1.12"
dashmap = "6.2"

# Crypto & security
base64 = "0.22"
aes-gcm = { version = "0.11", features = ["aes"] }
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13.0"
hkdf = "0.13.0"
getrandom = "0.4"
subtle = "2.6"

# Data structures
lru = "0.18"
hdrhistogram = "7.5"
rand = "0.10"
fastrand = "2.4"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Optional: legacy full-mesh mode
matchbox_signaling = { version = "0.14", optional = true }

# Optional: TLS support
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
], optional = true }
# Pin the ring provider for official cross-platform artifacts. Its pre-generated
# cross-target sources cover linux/arm/v7; the axum-server default selects
# aws-lc-sys, whose bindgen fallback does not cover that published target.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }
rustls-pki-types = { version = "1.14", optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
tower = { version = "0.5", optional = true }

[dev-dependencies]
# Test-only tokio feature additions (feature-unified with the main dependency
# for test builds only): `process` drives the spawned server binary in
# tests/v3_multiprocess_e2e.rs; `test-util` enables the paused-clock runtime
# (`#[tokio::test(start_paused = true)]`) used by the deterministic delivery
# timeout tests in src/coordination/mod.rs, the activity-reaper /
# heartbeat-throttle window tests in src/server/{connection_manager,heartbeat}.rs,
# and the message-batcher flush-timer tests in src/websocket/batching.rs (all
# read `tokio::time::Instant`, so `tokio::time::advance(..)` drives them).
tokio = { version = "1.52", features = ["process", "test-util"] }
tempfile = "3.27"
tokio-tungstenite = "0.29"
futures-util = "0.3"
regex = "1.12"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
serial_test = "3.5"
axum-test = "21.0"
proptest = "1.11"
criterion = "0.8"
stats_alloc = "0.1.10"
syn = { version = "2.0", features = ["full", "visit"] }
trybuild = "1.0"
# YAML 1.2 parser used by tests/ci_config_tests.rs to validate workflow files by
# actually parsing them, rather than approximating a parser with fragile quote/
# indent heuristics. `default-features = false` drops the encoding_rs dependency
# (UTF-8 input only), which is all the test fixtures and on-disk workflows need.
saphyr = { version = "0.0.12", default-features = false }

[[bin]]
name = "signal-fish-server"
path = "src/main.rs"

[lib]
name = "signal_fish_server"
path = "src/lib.rs"

[[bench]]
name = "response_time_tracker"
harness = false

[[bench]]
name = "relay_allocations"
harness = false
required-features = ["allocation-tracking"]

[[bench]]
name = "relay_serialization_allocations"
harness = false
required-features = ["allocation-tracking"]

[[bench]]
name = "relay_serialization_runtime"
harness = false
required-features = ["allocation-tracking"]

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
lto = false

# Build profile for cargo-mutants (see .cargo/mutants.toml + scripts/run-mutants.sh).
# Mutation testing rebuilds the crate once per mutant, so per-mutant build/relink
# cost dominates wall-clock. The exact inventory is enforced by
# `test_mutation_total_mutants_constant_matches_list`. This profile trims that cost:
#   - inherits "dev" (NOT "ci"): cargo-mutants reuses the per-job target dir
#     incrementally across mutants; profile.ci sets `incremental = false`, which
#     would force a near-clean rebuild every mutant. Keep incremental ON.
#   - debug = 0: debuginfo is dead weight to generate and link on every relink.
# Standing rule: never point mutation at profile.ci, and re-measure before changing
# these. Enforced by tests/ci_config_tests.rs::test_mutation_workflow_uses_optimized_build_profile.
[profile.mutants]
inherits = "dev"
debug = 0
incremental = true

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
