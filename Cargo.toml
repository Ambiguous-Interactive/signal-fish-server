[profile.dev]
# Line tables instead of full debug info (issue #512, session 266): backtraces
# keep file:line resolution, but emitting and linking debuginfo shrinks, which
# dominates the warm scoped edit-test loop (measured: ~13 s -> ~8 s for a
# one-crate relink on the aarch64 codespace). Debuggers lose variable
# inspection; opt back out for one session with
# CARGO_PROFILE_DEV_DEBUG=1 without editing this file.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

# Repository policy tests parse every test source. Optimize their parser without
# optimizing the server or changing which inputs the guards check.
[profile.dev.package.syn]
opt-level = 2

[profile.dev.package.proc-macro2]
opt-level = 2

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
lto = false

# Build profile for cargo-mutants (see .cargo/mutants.toml + scripts/run-mutants.sh).
# Mutation testing rebuilds the crate once per mutant, so per-mutant build/relink
# cost dominates wall-clock. The exact inventory is enforced by
# `test_mutation_total_mutants_constant_matches_list`. This profile trims that cost:
#   - inherits "dev" (NOT "ci"): cargo-mutants reuses the per-job target dir
#     incrementally across mutants; profile.ci sets `incremental = false`, which
#     would force a near-clean rebuild every mutant. Keep incremental ON.
#   - debug = 0: debuginfo is dead weight to generate and link on every relink.
# Standing rule: never point mutation at profile.ci, and re-measure before changing
# these. Enforced by tests/ci_config_tests.rs::test_mutation_workflow_uses_optimized_build_profile.
[profile.mutants]
inherits = "dev"
debug = 0
incremental = true

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

