[package]
# Explicit ownership keeps repository checks out of the server build graph.
autotests = false
name = "signal-fish-server"
version = "0.12.0"
edition = "2021"
license = "MIT"
authors = ["Ambiguous Interactive <eli@theambiguous.co>"]
description = "A lightweight, in-memory WebSocket signaling server for peer-to-peer game networking"
repository = "https://github.com/Ambiguous-Interactive/signal-fish-server"
keywords = ["gamedev", "signaling", "websocket", "multiplayer", "matchmaking"]
categories = [
    "game-engines",
    "network-programming",
    "web-programming::websocket",
]
rust-version = "1.94.0"
build = "build.rs"
# Keep the published artifact to the server's runtime/library sources and the
# metadata Cargo needs to install it. An allowlist is deliberate: standalone
# test modules, development benchmarks, extended operator documentation,
# repository tooling, planning records, tests, and CI files must not silently
# become crates.io payload.
# Cargo warns that the deliberately omitted test/benchmark targets are
# unavailable in the packaged source; the package inventory regression
# validates that exact warning class.
include = [
    "/src/**",
    "!/src/database/member_mutation_tests.rs",
    "!/src/server/app_admission_tests.rs",
    "!/src/server/game_data_tests.rs",
    "!/src/server/message_coordinator_tests.rs",
    "!/src/server/message_router_tests.rs",
    "!/src/server/ready_state_tests.rs",
    "!/src/server/room_service_tests.rs",
    "!/src/server/session_policy_tests.rs",
    "!/src/server/signaling_tests.rs",
    "/build.rs",
    "/Cargo.lock",
    "/config.example.json",
    "/README.md",
    "/LICENSE",
]

# Release workflows may be retried against older immutable sources. This
# source-owned marker opts only new artifacts into the built-in TLS feature;
# its absence preserves the feature set of historical releases.
[package.metadata.signal-fish-release]
prepared-from = "e05b39cc826a379651ec18f6953b0f24475a5af3"
built-in-tls = true

[features]
default = []
legacy-fullmesh = ["matchbox_signaling"]
tls = [
    "axum-server",
    "rustls",
    "rustls-pki-types",
    "tokio-rustls",
    "tower",
]
# Internal verification seam for delivery-contract trace refinement. The feature
# only exposes inert trace hooks; a caller must explicitly attach a recorder to a
# connection.
trace-validation = []
# Dev-only benchmark seam for measuring relay-path heap traffic. The
# instrumented allocator is installed only by the dedicated benchmark binary;
# production binaries never link or select it.
allocation-tracking = []

# The signaling server carries no `unsafe` block and must not acquire one by
# accident. `forbid` (not `deny`) is deliberate: it cannot be re-enabled by a
# local `#[allow(unsafe_code)]`, so adding unsafe here requires editing this
# manifest and defending the change in review.
[lints.rust]
unsafe_code = "forbid"

# Numeric narrowing is always explicit. These lints cover conversions that can
# silently truncate, wrap, or turn negative values into large unsigned values;
# CI promotes them to errors through its existing `-D warnings` Clippy gate.
[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"

[dependencies]
# Async runtime. `sync` (mpsc/watch delivery channels) and `time` (backpressure
# timeouts) are load-bearing for the no-silent-drop delivery path — keep them
# explicit rather than relying on feature unification from other dependencies.
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
] }

# Web framework
axum = { version = "0.8.9", features = ["ws", "http2"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
# Explicit HTTP/1 connection builder so the pre-upgrade header-read deadline
# is actually armed (issue #518): axum::serve and axum-server leave hyper's
# `Timer` unset, which silently disables its default header-read timeout and
# leaves direct-to-port deployments open to pre-upgrade slowloris.
hyper-util = { version = "0.1.21", default-features = false, features = [
    "server-auto",
    "tokio",
    "service",
] }
# Trait-only crate (no runtime surface) used to drive axum's make service
# manually on the header-read-deadline serve path.
tower-service = "0.3.3"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
rmp = "0.8.15"
rmp-serde = "1.3.1"

# Identifiers & time
uuid = { version = "1.29.0", features = ["v4", "serde"] }
jiff = { version = "1.0.1", default-features = false, features = ["std", "serde"] }
semver = "1.0.28"
# Parse configured browser origins with the URL Standard's canonical host,
# port, and IP-address rules before comparing their serialized form exactly.
url = "2.5.8"
# Canonical Unicode caseless matching for player-name identity. This combines
# canonical normalization with full, non-Turkic folding without conflating
# compatibility-only equivalents.
unicode-normalization = "0.1.26"
icu_casemap = { version = "2.4.0", default-features = false, features = ["compiled_data"] }

# Error handling & logging
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "env-filter",
    "json",
    "time",
    "std",
    "ansi",
    "tracing-log",
] }
tracing-appender = "0.2.5"

# Async utilities
async-trait = "0.1.92"
futures-util = { version = "0.3.34", features = ["std"] }

# Performance primitives
bytes = "1.12.1"
dashmap = "6.2.1"

# Crypto & security
base64 = "0.23.1"
aes-gcm = { version = "0.11.1", features = ["aes"] }
sha2 = "0.11.1"
sha1 = "0.11.0"
hmac = "0.13.0"
hkdf = "0.13.0"
getrandom = "0.4.3"
subtle = "2.6.1"
# Ed25519 signatures for the optional tenant `connect_token` (issue #517).
# The control plane holds the private key; this server only verifies and
# never signs (no production path constructs a `SigningKey`).
ed25519-dalek = { version = "3.0.0", default-features = false, features = [
    "fast",
    "alloc",
] }
# Import the `Verifier`/`Signer` traits through ed25519-dalek's re-exports:
# they are the exact trait versions ed25519-dalek implements. Keep a direct
# `signature` dependency out so the traits cannot drift across major versions.

# Data structures
hdrhistogram = "7.6.0"
rand = "0.10.3"
fastrand = "2.5.0"

# CLI
clap = { version = "4.6.7", features = ["derive", "env"] }

# Optional: legacy full-mesh mode
matchbox_signaling = { version = "0.15.0", optional = true }

# Optional: TLS support
axum-server = { version = "0.9.0", default-features = false, features = [
    "tls-rustls-no-provider",
], optional = true }
# Pin the ring provider for official cross-platform artifacts. Its pre-generated
# cross-target sources cover linux/arm/v7; the axum-server default selects
# aws-lc-sys, whose bindgen fallback does not cover that published target.
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, optional = true }
tower = { version = "0.5.3", optional = true }

[dev-dependencies]
# Test-only tokio feature additions (feature-unified with the main dependency
# for test builds only): `process` drives the spawned server binary in
# tests/v3_multiprocess_e2e.rs; `test-util` enables the paused-clock runtime
# (`#[tokio::test(start_paused = true)]`) used by the deterministic delivery
# timeout tests in src/coordination/mod.rs, the activity-reaper /
# heartbeat-throttle window tests in src/server/{connection_manager,heartbeat}.rs,
# and the message-batcher flush-timer tests in src/websocket/batching.rs (all
# read `tokio::time::Instant`, so `tokio::time::advance(..)` drives them).
tokio = { version = "1.54.1", features = ["process", "test-util"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
hyper = { version = "1.12.0", features = ["client", "http2"] }
futures-util = "0.3.34"
regex = "1.13.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }
serial_test = "4.0.1"
tower = { version = "0.5.3", features = ["util"] }
proptest = "1.12.0"
criterion = "0.8.2"
stats_alloc = "0.1.10"
libtest-mimic = "0.8.2"
syn = { version = "3.0.9", features = ["full", "visit"] }
trybuild = "1.0.125"
# YAML 1.2 parser used by tests/ci_config_tests.rs to validate workflow files by
# actually parsing them, rather than approximating a parser with fragile quote/
# indent heuristics. `default-features = false` drops the encoding_rs dependency
# (UTF-8 input only), which is all the test fixtures and on-disk workflows need.
saphyr = { version = "0.3.3", default-features = false }

[[bin]]
name = "signal-fish-server"
path = "src/main.rs"

[lib]
name = "signal_fish_server"
path = "src/lib.rs"

# Global allocator fixtures run on their process main thread. A worker-based
