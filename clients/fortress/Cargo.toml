[package]
name = "signal-fish-fortress-interop"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ambiguous Interactive <eli@theambiguous.co>"]
description = "Fortress Rollback interoperability fixture for Signal Fish Server"
repository = "https://github.com/Ambiguous-Interactive/signal-fish-server"
rust-version = "1.89.0"
publish = false

# Matches the server crate: this interop fixture carries no `unsafe` block.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
fortress-rollback = "=0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-fish-client = { version = "=0.8.0", features = ["polling-client"] }
tokio = { version = "1.52", features = ["fs", "macros", "rt", "time"] }
uuid = { version = "1.23", features = ["serde", "v4"] }

[workspace]

[[bin]]
name = "fortress-relay-peer"
path = "src/main.rs"

[[test]]
name = "multiprocess"
path = "tests/multiprocess.rs"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
