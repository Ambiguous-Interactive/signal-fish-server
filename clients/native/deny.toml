# cargo-deny configuration for the native reference client
# (signal-fish-reference-native) — https://embarkstudios.github.io/cargo-deny/
#
# This crate is a standalone package OUTSIDE the root signal-fish-server
# package, with its own Cargo.lock and an independent dependency graph (the
# webrtc stack et al.) that the root deny.toml audit never sees. The policy
# below mirrors the root configuration (same license allowlist, bans, and
# source restrictions) so the supply-chain bar is identical; only this header
# differs. CI enforces it via the client-deny job in
# .github/workflows/webrtc-interop.yml.

[graph]
# Only check workspace crates and their dependencies (not dev-dependencies in release)
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# Fail the check when a yanked dependency is detected
yanked = "deny"
# Note: In cargo-deny v2 (0.19+), all advisories (vulnerabilities and unmaintained
# crates) are checked by default. Use the ignore list below to suppress specific
# advisories; ignored advisories still emit a note when encountered.

# Ignore specific advisories (use sparingly and document why)
ignore = [
    # Example: "RUSTSEC-2020-0159",  # Chrono timezone issues (non-exploitable)
]

[licenses]
version = 2
# Explicit allowlist for permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "ISC",
    # Mirrored verbatim from the root policy for `ring` (see the clarify
    # below). The ring version resolved in THIS graph declares its license
    # directly, so cargo-deny may report this allowance (and the clarify) as
    # unmatched — that warning is expected; the entries are kept so the two
    # policies stay diffable.
    "OpenSSL",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# Allow certain exceptions for dev dependencies
exceptions = [
    # Example: { allow = ["LGPL-3.0"], name = "unicode-normalization" },
]

# Mirrored verbatim from the root policy. Newer ring releases (0.17.14+, as
# resolved in this crate's lockfile) declare `Apache-2.0 AND ISC` directly
# and ship a different LICENSE file, so the hash below does not match and
# this clarify is intentionally inert here — kept verbatim anyway so the
# client policy stays a recognizable mirror of the root one.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcards in dependencies (security best practice)
wildcards = "deny"
# Required addition vs. the root policy: the protocol types come from a PATH
# dependency on the server crate (`signal-fish-server = { path = "../.." }`,
# deliberately version-less so the wire contract can never drift from the
# checkout being tested). cargo-deny counts a version-less path dependency as
# a wildcard; this opt-out permits wildcards ONLY for path dependencies of
# private (publish = false) crates — registry wildcards remain denied.
allow-wildcard-paths = true
# Deny specific crates via [[bans.deny]] entries
# Allow certain crates despite being duplicated
skip = []
# Skip checking specific trees
skip-tree = []
# Highlight specific crates that require attention
highlight = "all"
# Deny crates with known security or safety issues
[[bans.deny]]
name = "atty"
reason = "Unmaintained - use std::io::IsTerminal instead (Rust 1.70+)"

[[bans.deny]]
name = "instant"
reason = "Deprecated - use std::time::Instant directly"

# Proactive bans: prevent introduction of known-problematic crates

# Security/TLS policy — enforce rustls-only TLS stack
[[bans.deny]]
name = "rustls-pemfile"
reason = "Unmaintained (RUSTSEC-2025-0134) — use rustls-pki-types PEM parsing instead"

[[bans.deny]]
name = "openssl"
reason = "Prefer rustls TLS stack — openssl has numerous CVEs and requires system libraries"

[[bans.deny]]
name = "openssl-sys"
reason = "Transitive from openssl — prefer pure-Rust rustls TLS stack"

[[bans.deny]]
name = "native-tls"
reason = "Uses platform TLS (openssl/schannel/security-framework) — prefer rustls for consistency and security"

# Build system policy — prefer pure-Rust build chains
[[bans.deny]]
name = "gcc"
reason = "Renamed to cc — use cc crate instead"

# Unmaintained/deprecated crates — use modern replacements
[[bans.deny]]
name = "failure"
reason = "Unmaintained — use thiserror or anyhow instead"

[[bans.deny]]
name = "failure_derive"
reason = "Unmaintained — use thiserror derive instead"

[[bans.deny]]
name = "tempdir"
reason = "Deprecated — use tempfile crate instead"

[[bans.deny]]
name = "term"
reason = "Unmaintained — use crossterm or std::io::IsTerminal"

[[bans.deny]]
name = "net2"
reason = "Deprecated — functionality absorbed into std::net and socket2"

[[bans.deny]]
name = "rustc-serialize"
reason = "Deprecated — use serde instead"

[sources]
# Deny crates from unknown sources
unknown-registry = "deny"
unknown-git = "deny"

# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
