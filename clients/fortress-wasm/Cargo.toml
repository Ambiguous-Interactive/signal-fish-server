[package]
name = "signal-fish-fortress-wasm-interop"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ambiguous Interactive <eli@theambiguous.co>"]
description = "Godot no-thread WASM Fortress interoperability fixture for Signal Fish Server"
repository = "https://github.com/Ambiguous-Interactive/signal-fish-server"
rust-version = "1.94.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fortress-rollback = "=0.12.0"
godot = { version = "=0.4.5", features = ["api-custom", "experimental-wasm", "experimental-wasm-nothreads", "lazy-function-tables"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-fish-client = { version = "=0.9.0", default-features = false, features = ["polling-client"] }
signal-fish-client-godot = "=0.9.0"
uuid = { version = "1.23", features = ["serde", "v4", "js"] }
web-time = "=1.1.0"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(published_docs)"] }
# `deny` rather than the `forbid` used by the server and the other client
# packages: godot-rust requires exactly one `unsafe impl ExtensionLibrary`
# marker. It lives in the `extension_registration` module in src/lib.rs, which
# carries the only `#[allow(unsafe_code)]` in the crate (the allow must sit on
# the module, not the item — `#[gdextension]` re-emits the impl without
# item-level attributes). Any unsafe site outside that module is a compile
# error.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
