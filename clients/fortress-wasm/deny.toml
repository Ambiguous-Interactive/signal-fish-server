# Supply-chain policy for the standalone Godot/WASM Fortress fixture.

[graph]
targets = ["wasm32-unknown-emscripten"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# MPL-2.0 is required by the exact godot-rust 0.4.5 production graph;
# BSD-3-Clause and ISC cover its bindgen build dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = []
skip-tree = []
highlight = "all"

[[bans.deny]]
name = "openssl"
reason = "Browser fixture must not gain a native TLS dependency"

[[bans.deny]]
name = "native-tls"
reason = "Browser fixture must not gain a native TLS dependency"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
