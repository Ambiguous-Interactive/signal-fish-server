# Coverage-guided fuzzing crate (cargo-fuzz / libFuzzer).
#
# This is the NIGHTLY, out-of-workspace extension of the stable in-suite
# proptest fuzzer (tests/protocol_fuzz_hardening.rs). ADR-0003 records why the
# primary fuzzer is proptest-on-stable (pinned-toolchain parity) and named the
# conditions for adding a coverage-guided fuzzer "later"; this crate is that
# addition. It is intentionally a SEPARATE package with its own `[workspace]`
# table so it never perturbs the pinned-stable build of the main crate, and it
# is exercised only by the dedicated nightly `fuzz` CI job — never by
# `cargo build` / `cargo test` on the stable toolchain.
[package]
name = "signal-fish-server-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"
rust-version = "1.91.0"

[package.metadata]
cargo-fuzz = true

# Matches the server crate. `libfuzzer-sys`'s `fuzz_target!` expands to safe
# `extern "C"` entry points, so the harness needs no unsafe of its own.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
rmp-serde = "1.3"
# Structured op-sequence fuzzing (fuzz_session_machine, fuzz_reconnect_tokens).
arbitrary = { version = "1", features = ["derive"] }
# The state-machine targets drive the async in-process server core; each input
# runs on a fresh current-thread runtime so background tasks cannot accumulate
# across libFuzzer iterations.
tokio = { version = "1.52", features = ["rt", "sync", "time"] }
uuid = { version = "1.23", features = ["v4"] }

[dependencies.signal-fish-server]
path = ".."
version = "0.6.0"

# Detach from the parent crate so the nightly fuzz build is fully independent of
# the pinned-stable workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "decode_protocol"
path = "fuzz_targets/decode_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_inputs"
path = "fuzz_targets/validate_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_session_machine"
path = "fuzz_targets/fuzz_session_machine.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_reconnect_tokens"
path = "fuzz_targets/fuzz_reconnect_tokens.rs"
test = false
doc = false
bench = false
