# Nextest Configuration
#
# Optimized test execution settings for cargo-nextest.
# https://nexte.st/docs/configuration/
#
# Applied automatically when running `cargo nextest run` in this workspace.
# CI workflows (ci.yml nextest job) inherit these settings.

# Concurrency-isolated test groups (zero-flakiness policy: isolate resource-heavy
# tests rather than retry them — see .llm/context-testing.md). The true
# multi-process suite (`tests/v3_multiprocess_e2e.rs`) spawns the real
# `signal-fish-server` binary as child OS processes that bind ports and compete
# for CPU; on an oversubscribed runner that starvation could push a child past
# its readiness deadline. This was the one flake observed during the v2/v3
# production-readiness pass — green in isolation, a single timeout under
# 48-binary saturation. Capping the group to one test at a time and reserving
# several global thread slots per test keeps the child server from being
# CPU-starved, deterministically — together with the generous, saturation-tolerant
# deadlines now in tests/v3_multiprocess_e2e.rs.
[test-groups]
process-spawning = { max-threads = 1 }
powershell-subprocess = { max-threads = 1 }

[profile.default]
# Fail-fast: stop on first test failure for faster feedback in CI.
# Individual OS matrix lanes already provide independent failure reporting
# (strategy.fail-fast: false in ci.yml), so fail-fast within a single lane
# gives the fastest signal without losing cross-OS coverage.
fail-fast = true

# Show test output only on failure — reduces CI log noise while preserving
# full diagnostic output when something goes wrong.
failure-output = "immediate-final"
success-output = "never"

# No automatic retries. Every test failure is treated as a real bug per
# project policy (see .llm/context-testing.md: "Zero-Flakiness Policy").
# Flakes are fixed deterministically (root-caused) or isolated via test-groups
# below — never masked with blanket retries.

# Per-test override: route the true multi-process suites into the bounded
# `process-spawning` group and reserve thread slots so they cannot be
# CPU-starved. `multiprocess_delivery_e2e` spawns the same real server binary
# (plus, in its nightly-only tests, real client processes) and floods it, so
# it shares the group for exactly the same isolation reasons.
[[profile.default.overrides]]
filter = 'binary(v3_multiprocess_e2e) or binary(multiprocess_delivery_e2e) or binary(split_brain_two_instances_e2e)'
test-group = 'process-spawning'
threads-required = 4

# Per-test override: serialize the two heavy CPU/IO tests that otherwise starve
# each other under a loaded runner — the trybuild / compile-fail UI test
# (`tests/public_api_privacy_tests.rs`), whose "runtime" is a full crate
# (re)compile in trybuild's own target dir (cold whenever source changed, several
# minutes under load — legitimate compile time, not a hang), and the docs
# internal-link checker (`ci_config_tests::test_docs_relative_links_*`), which
# shells out to a ~17s repo script. Routing both through the bounded
# `process-spawning` group (max-threads = 1) guarantees they never co-schedule,
# so the link checker is never starved by the trybuild compile; the generous
# slow-timeout absorbs the compile itself.
[[profile.default.overrides]]
filter = 'binary(public_api_privacy_tests) or test(test_docs_relative_links_resolve_to_existing_files)'
test-group = 'process-spawning'
slow-timeout = { period = "300s", terminate-after = 3 }

# PowerShell can corrupt concurrent .NET assembly loads on macOS runners. Keep
# direct `pwsh` integration tests in one cross-process group; `serial_test`
# provides the equivalent guard for plain `cargo test` lanes.
[[profile.default.overrides]]
filter = 'test(/when_pwsh_available/)'
test-group = 'powershell-subprocess'

# CI-specific profile — reserved for future per-job tuning.
# Activate with: cargo nextest run --profile ci
# Inherits all [profile.default] settings and adds CI-tuned overrides.
[profile.ci]
fail-fast = true
failure-output = "immediate-final"
success-output = "never"
# Per-test slow-timeout: warn at 120s, terminate after 3 periods (360s). The
# headroom is a safety net so a subprocess/script test that is merely starved
# under a loaded runner (not hung) is not spuriously killed; the genuinely heavy
# tests get their own larger override above.
slow-timeout = { period = "120s", terminate-after = 3 }

# Mutation-oracle profile. Mutants that remove a progress guard can hang a test
# indefinitely; terminate that isolated process quickly so cargo-mutants records
# the nontermination as a caught mutant rather than exhausting its 120s outer
# scenario timeout. The baseline runs the same profile and Cargo build target via
# `cargo nextest run --lib --cargo-profile mutants --profile mutants --locked`.
[profile.mutants]
fail-fast = true
failure-output = "immediate-final"
success-output = "never"
slow-timeout = { period = "10s", terminate-after = 1 }
