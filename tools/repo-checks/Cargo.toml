[package]
name = "signal-fish-repo-checks"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"
authors = ["Ambiguous Interactive"]
publish = false
license = "MIT"
autotests = false

# Keep repository policy independent of the server and its runtime dependencies.
[workspace]

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.27.0"
regex = "1.13.1"
serde_json = "1.0.154"
serial_test = "4.0.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.9", features = ["full", "visit"] }
saphyr = { version = "0.3.3", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.dev.package.syn]
opt-level = 2

[profile.dev.package.proc-macro2]
opt-level = 2

[profile.ci]
inherits = "dev"
debug = 0
incremental = false

[[test]]
name = "agent_tooling_guards"
path = "../../tests/agent_tooling_guards.rs"

