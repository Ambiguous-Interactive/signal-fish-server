# Dependabot Configuration for Signal Fish Server
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This configuration is designed to strongly favor fewer, larger, area-grouped PRs.
# Key design decisions:
# - Broad grouping bundles most updates within each ecosystem area
# - Low PR limits bias toward large, consolidated update PRs
# - Schedule intervals are tuned per ecosystem based on update frequency needs
# - Labels enable automated routing and filtering
# - Explicit rebase-strategy ensures clean merge history

version: 2
updates:
  # ============================================================================
  # Rust Dependencies (Cargo) - Root Workspace
  # ============================================================================
  # Covers main server dependencies: tokio, axum, serialization, crypto, etc.
  # Daily schedule: Rust security advisories are critical and frequent
  # Consolidated PR limit: Area-grouped updates reduce review overhead
  #
  # Package structure:
  # - Root server package: monitored here
  # - Native reference client: monitored by its standalone entry below
  # - Fuzz package: monitored by its standalone entry below
  # - Fortress native/WASM packages: exact-release interoperability fixtures,
  #   intentionally advanced only when their pinned fixture is requalified
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    # Explicit rebase strategy for clean merge history
    rebase-strategy: "auto"
    # Use a distinct prefix to differentiate root from standalone packages
    commit-message:
      prefix: "chore"
      include: "scope"
    # Prefer a small number of large, grouped dependency PRs
    open-pull-requests-limit: 2
    # Organize PRs with clear labels
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    # Keep version-update PRs aligned with the graph and Rust 1.89 MSRV.
    # Vulnerability alerts and the independent cargo-audit/cargo-deny gates
    # remain active for ignored version lines.
    ignore:
      # Axum 0.8.9 and the broader graph still use base64 0.22. Accepting 0.23
      # only for this crate duplicates a security-sensitive codec.
      - dependency-name: "base64"
        versions: ["0.23.x"]
      # Axum 0.8.9 owns tokio-tungstenite/tungstenite 0.29. A test-only 0.30
      # declaration duplicates the complete WebSocket stack.
      - dependency-name: "tokio-tungstenite"
        versions: ["0.30.x"]
      # serial_test 4.x requires rustc 1.93.1, above the declared 1.89 MSRV.
      - dependency-name: "serial_test"
        versions: ["4.x"]
      # syn 3 removes APIs used by the policy suite while syn 2 remains in the
      # transitive graph. Remove this hold only with a measured migration.
      - dependency-name: "syn"
        versions: ["3.x"]
    # Group all update types to favor large, area-grouped PRs
    groups:
      cargo-root-updates:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ============================================================================
  # Rust Dependencies (Cargo) - Native Reference Client
  # ============================================================================
  # This package is excluded from the root workspace and owns Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/clients/native"
    schedule:
      interval: "daily"
      time: "03:15"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(native)"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    # Match the two direct holds already measured in the root graph.
    ignore:
      - dependency-name: "tokio-tungstenite"
        versions: ["0.30.x"]
      - dependency-name: "serial_test"
        versions: ["4.x"]
    groups:
      cargo-native-updates:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ============================================================================
  # Rust Dependencies (Cargo) - Coverage-Guided Fuzz Package
  # ============================================================================
  # This package is excluded from the root workspace and owns Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "daily"
      time: "03:30"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(fuzz)"
      include: "scope"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    groups:
      cargo-fuzz-updates:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ============================================================================
  # GitHub Actions Dependencies
  # ============================================================================
  # Includes CI, documentation validation, linting workflows
  # Weekly schedule: Actions updates are less frequent and lower risk
  # Consolidated PR limit: Consolidate workflow updates into fewer review PRs
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    # Prefer fewer, larger workflow update PRs
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
      - "automated"
    # Group all update types to reduce fragmentation
    groups:
      github-actions-updates:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ============================================================================
  # Docker Dependencies - Main Dockerfile
  # ============================================================================
  # Multi-stage build with rust base image and debian bookworm runtime
  # Weekly schedule: Base image updates are infrequent and need validation
  # Consolidated PR limit: Group base image updates for coordinated validation
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    # Prefer a small number of grouped Docker PRs
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
      - "automated"
    # ========================================================================
    # Docker Rust Image Policy (DECISION: Align with MSRV - Option A)
    # ========================================================================
    #
    # MSRV Policy:
    # - MSRV is defined in Cargo.toml (rust-version = "1.89.0")
    # - CI enforces MSRV compliance via cargo check --locked
    # - Dockerfile Rust version should track MSRV, not latest stable
    #
    # Rationale:
    # - Production builds must match CI validation environment
    # - Prevents accidental use of features newer than MSRV
    # - Ensures reproducible builds across all environments
    # - MSRV bumps are deliberate, versioned decisions
    #
    # Update Dockerfile Rust version ONLY when:
    # 1. Bumping MSRV in Cargo.toml (primary trigger)
    # 2. Critical security fix in Rust compiler/std (overrides MSRV freeze)
    # 3. Major performance improvement in newer rustc (evaluate carefully)
    #
    # Dependabot is configured to ignore Rust image updates to prevent
    # automatic version drift. MSRV bumps are manual, coordinated changes.
    ignore:
      - dependency-name: "rust"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      docker-main-updates:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ============================================================================
  # Docker Dependencies - Devcontainer
  # ============================================================================
  # Development environment with tooling (cargo-nextest, cargo-tarpaulin, etc.)
  # Weekly schedule: Dev environment updates are less urgent than production
  # Consolidated PR limit: Reduce noise in developer-experience updates
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "03:00"
      timezone: "America/Los_Angeles"
    assignees:
      - "wallstop"
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(devcontainer)"
      include: "scope"
    # Prefer fewer, larger devcontainer update PRs
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "devcontainer"
      - "developer-experience"
      - "automated"
    # Devcontainer Rust version tracking policy:
    #
    # DECISION: Allow devcontainer to track latest stable Rust
    #
    # Rationale:
    # - Developers benefit from latest tooling and diagnostics
    # - MSRV is enforced by CI, not by dev environment
    # - Dockerfile and CI validate production MSRV compliance
    # - Early warning if code won't compile with future Rust versions
    #
    # To lock devcontainer to match production MSRV exactly, add:
    # ignore:
    #   - dependency-name: "rust"
    #     update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    #
    # For now, no ignore rules to allow tracking latest Rust stable
    groups:
      # Group all devcontainer updates for coordinated review
      devcontainer-updates:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

# ============================================================================
# Configuration Rationale Summary
# ============================================================================
#
# Schedule Intervals:
# - Cargo (daily): Security advisories are frequent and critical
# - GitHub Actions (weekly): Lower update frequency, less urgent
# - Docker main (weekly): Base images update infrequently
# - Docker devcontainer (weekly): Dev environment, not production-critical
#
# PR Limits Rationale:
# - Cargo root (2): prioritize broad, consolidated dependency updates
# - Cargo native/fuzz (2 each): keep standalone package updates grouped
# - GitHub Actions (2): consolidate workflow updates into fewer PRs
# - Docker main (2): group base image updates for coordinated validation
# - Docker devcontainer (2): reduce noise in developer-experience updates
#
# Grouping Strategy:
# - Each ecosystem uses broad grouping to produce fewer, larger PRs
# - Root Cargo updates are grouped together across major/minor/patch
# - Standalone native and fuzz package updates are grouped by package
# - GitHub Actions and Docker updates are consolidated by area
#
# Ignore Rules:
# - Root Cargo: Hold four measured-incompatible release lines until the
#   WebSocket/base64 graph, MSRV, or syn policy code can move coherently
# - Rust production image (Dockerfile): Aligned with MSRV policy, manual updates only
# - Devcontainer Rust: No ignores, tracks latest stable for developer experience
# - Native client: Hold the WebSocket-stack and MSRV-incompatible release lines
# - Security scanning: cargo-deny runs in CI for supply chain vulnerabilities
#
# Labels:
# - Enable automated filtering and routing
# - Support project board automation
# - Clear categorization for maintainers
#
# Rebase Strategy:
# - Explicit "auto" for clean merge history
# - Ensures Dependabot rebases when base branch updates
# - Reduces merge conflicts and keeps PR history linear
