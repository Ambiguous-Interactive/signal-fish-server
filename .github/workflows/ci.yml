# Continuous Integration Workflow
#
# Main CI pipeline that runs comprehensive checks on all code changes.
# This workflow ensures code quality, correctness, and security before merging.
#
# Runs on:
#   - Push to main branch
#   - Pull requests to main
#   - Daily schedule (security audit only — the `deny` and `audit` jobs)
#
# Jobs:
#   - lint: Cross-OS code formatting (rustfmt) and linting (clippy) matrix
#   - nextest: Cross-OS test execution via cargo-nextest (doc-tests in doc-validation.yml)
#   - relay-allocations: Deterministic production-seam allocation ceilings
#   - doc-consistency: Version/changelog/doc drift checks (diff-aware changelog gate)
#   - deny: Security audits, license checks, and dependency validation
#   - audit: RustSec and npm vulnerability scans
#   - docker: Docker image build and smoke test with health check
#   - coverage: Linux code coverage gate via cargo-llvm-cov
#   - panic-policy: Zero-panic production code enforcement
#   - sbom: Software Bill of Materials generation (CycloneDX JSON)
#
# Features:
#   - Rust toolchain caching for faster builds
#   - Strict clippy warnings enforced
#   - Docker health check with exponential backoff retry
#   - Locked dependency resolution for reproducibility
#   - Nextest configuration via .config/nextest.toml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily security audit at noon UTC to catch new CVEs
    - cron: "0 12 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast-fail gate. A single cheap "does it format and compile" pass that the
  # expensive compile/test jobs in this workflow depend on via `needs:
  # quick-check`. A file that does not parse or type-check fails here in seconds,
  # so the nine gated lanes (lint x3, nextest x3, relay allocations, msrv,
  # coverage) never start —
  # collapsing what was a redundant per-lane recompile-and-fail into one fast
  # failure. This exists because an unclosed delimiter in a committed test file
  # once failed every one of those lanes independently. (Compile jobs in sibling
  # workflows such as ci-safety.yml and doc-validation.yml are out of scope here;
  # see test_ci_quick_check_gate_guards_expensive_jobs which pins this wiring.)
  quick-check:
    name: Quick Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Formatting first: an unclosed delimiter or otherwise unparseable file
      # fails this in well under a second — the cheapest signal for the
      # syntactic-corruption class that motivated this gate.
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Then a no-codegen type-check across ALL targets (tests/ and benches/
      # included). This is what catches a compile error in the test tree before
      # the expensive matrix spends minutes rediscovering it on every lane.
      - name: Check compilation
        run: cargo check --locked --all-targets --all-features
      # The fuzz crate is a SEPARATE workspace (fuzz/, out-of-tree per ADR-0003),
      # so the check above never sees it — which let an E1 `register_disconnection`
      # signature change break `fuzz_reconnect_tokens` undetected (fuzz.yml only
      # runs on narrow paths). Type-check every fuzz
      # target here against current library code on every PR. This is a no-codegen
      # `check` (no libFuzzer/sanitizer), so the pinned stable toolchain suffices;
      # the nightly build/run stays in fuzz.yml. The standalone lockfile is
      # committed, so dependency drift fails here instead of rewriting it.
      - name: Check fuzz crate compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  relay-allocations:
    name: Relay Allocation Ceilings
    needs: quick-check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Enforce deterministic relay allocation ceilings
        run: >-
          cargo bench --locked --bench relay_serialization_allocations
          --features allocation-tracking

  lint:
    name: Lint (${{ matrix.os }})
    needs: quick-check
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        # Rust version controlled by rust-toolchain.toml in repository root (currently 1.91.0)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Show Rust tool versions
        shell: bash
        run: |
          rustc -Vv
          cargo -V
          cargo clippy -V
          cargo fmt --version
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        shell: bash
        run: |
          set -o pipefail
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee clippy-output.txt
          pipeline_status=("${PIPESTATUS[@]}")
          clippy_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          status="$clippy_status"
          if [ "$status" -eq 0 ] && [ "$tee_status" -ne 0 ]; then
            status="$tee_status"
          fi
          set -e
          if [ "$clippy_status" -ne 0 ]; then
            {
              echo "### Clippy failure diagnostics"
              echo
              echo "Runner OS: $RUNNER_OS"
              echo "Rust toolchain: ${{ steps.toolchain.outputs.channel }}"
              echo
              echo '```text'
              ansi_escape="$(printf '\033')"
              sed -E "s/${ansi_escape}\[[0-9;]*[A-Za-z]//g" clippy-output.txt | sed -n '/error/,$p' | head -n 120 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Check optional feature matrix
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/check-feature-matrix.sh

  nextest:
    name: Nextest (${{ matrix.os }})
    needs: quick-check
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        # Rust version controlled by rust-toolchain.toml in repository root (currently 1.91.0)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # cargo-nextest install is retried because windows-latest runner images
      # intermittently fail install-action with a "bash startup failure" BEFORE
      # the action's own internal retries kick in (upstream runner-image bug:
      # https://github.com/actions/partner-runner-images/issues/169). A single
      # transient failure should not force a manual CI re-run. GitHub Actions has
      # no native step-level retry, so we use the repo's existing
      # id + continue-on-error + outcome-gated retry idiom (mirrors the SBOM
      # step in release.yml) instead of adding a new third-party action.
      # The retry is harmless cross-OS: on non-Windows the first attempt
      # effectively never hits this flake, so the second attempt is skipped.
      - name: Install cargo-nextest (attempt 1)
        id: install_nextest
        continue-on-error: true
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-nextest
      - name: Install cargo-nextest (retry on transient runner failure)
        # Only runs when attempt 1 failed (e.g., the Windows bash-startup flake).
        # No continue-on-error here, so a second failure correctly fails the job.
        if: steps.install_nextest.outcome == 'failure'
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-nextest

      - name: Run nextest
        # nextest does not support doc-tests; those are validated by doc-validation.yml
        run: cargo nextest run --profile ci --locked --all-features

      - name: Drop trybuild artifacts before cache save
        # trybuild builds nested cargo projects under `<target>/tests`. Swatinem/rust-cache's
        # restore-time cleanup probes `<target>/tests/target` (a path trybuild never creates) in a
        # non-awaited call, surfacing a benign but noisy `##[error]ENOENT` whenever a restored
        # cache contains that dir. Dropping it before the post-run cache save keeps it out of
        # future caches; the noise self-clears after one save cycle (a cache saved before this
        # step still shows it once on restore).
        if: always()
        shell: bash
        run: rm -rf "${CARGO_TARGET_DIR:-target}/tests"

  doc-consistency:
    name: Doc Consistency
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate CI/devcontainer tool parity
        shell: bash
        run: bash scripts/check-tooling-parity.sh

      - name: Collect changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # For initial pushes, github.event.before can be all zeros.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi

          HEAD_SHA="${{ github.sha }}"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt

          COUNT=$(wc -l < changed-files.txt | tr -d ' ')
          echo "Changed files count: $COUNT"
          cat changed-files.txt || true

      - name: Detect dependency-only changes
        id: dep-detect
        shell: bash
        run: |
          set -euo pipefail
          SKIP_CHANGELOG="false"
          HAS_CARGO_CHANGE="false"

          # Skip changelog when the change set is dependency-only:
          # at least one Cargo.toml/Cargo.lock change and no non-internal files.
          # This is intentionally actor/message-agnostic so squash merges and
          # manual merges behave consistently.
          if [ -f changed-files.txt ]; then
            NON_INTERNAL="false"
            while IFS= read -r f; do
              # Dependency-only detection: skip paths that are internal to dev/CI (matches
              # is_internal_path() in scripts/check-doc-consistency.sh), plus known
              # dependency-maintenance files that can legitimately co-change with
              # Cargo manifests/lockfiles (MSRV/toolchain/docs parity touchpoints).
              case "$f" in
                Cargo.toml|Cargo.lock|clients/native/Cargo.toml|clients/native/Cargo.lock) HAS_CARGO_CHANGE="true" ;;
                fuzz/Cargo.toml|fuzz/Cargo.lock) HAS_CARGO_CHANGE="true" ;;
                clients/fortress/Cargo.toml|clients/fortress/Cargo.lock) HAS_CARGO_CHANGE="true" ;;
                clients/fortress-wasm/Cargo.toml|clients/fortress-wasm/Cargo.lock) HAS_CARGO_CHANGE="true" ;;
                .github/*|.githooks/*|.devcontainer/*|.config/*|.vscode/*|.claude/*) ;;
                scripts/*|tests/*|test-fixtures/*|.llm/*|target/*|progress/*) ;;
                src/*_tests.rs|src/*_test.rs|src/*/tests.rs) ;;
                docs/ci-cd-*|docs/test-*|docs/git-hooks-*|docs/hooks-*|docs/pre-commit-*|docs/development.md|docs/quickstart.md) ;;
                .markdownlint*|.lychee.toml|.lycheecache|.typos.toml|.yamllint.yml) ;;
                .gitignore|.dockerignore) ;;
                PLAN.md|AGENTS.md|CLAUDE.md|pre-push.txt) ;;
                logs_*.zip) ;;
                Dockerfile|README.md) ;;
                clippy.toml|deny.toml|tarpaulin.toml|rust-toolchain.toml|mkdocs.yml|requirements-docs.txt) ;;
                CHANGELOG.md) ;;
                *) NON_INTERNAL="true"; break ;;
              esac
            done < changed-files.txt

            if [ "$NON_INTERNAL" = "false" ] && [ "$HAS_CARGO_CHANGE" = "true" ]; then
              SKIP_CHANGELOG="true"
            fi
          fi

          echo "skip_changelog=$SKIP_CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "Dependency-only skip: $SKIP_CHANGELOG"

      - name: Run documentation/changelog consistency checks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_FILES < changed-files.txt
          SKIP_FLAG=""
          if [ "${{ steps.dep-detect.outputs.skip_changelog }}" = "true" ]; then
            SKIP_FLAG="--skip-changelog-gate"
          fi
          if [ "${#CHANGED_FILES[@]}" -gt 0 ]; then
            bash scripts/check-doc-consistency.sh $SKIP_FLAG --changed-files "${CHANGED_FILES[@]}"
          else
            bash scripts/check-doc-consistency.sh $SKIP_FLAG
          fi

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job handles Rust licenses, banned dependencies, source verification,
    # and the cargo-deny advisory pass.
    # Runs on push/PR and daily via schedule (see workflow triggers).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Extract MSRV for cargo-deny toolchain
        id: deny-msrv
        run: |
          set -euo pipefail
          MSRV=$(bash scripts/read-toml-string.sh Cargo.toml rust-version package || true)
          if [ -z "$MSRV" ]; then
            echo "ERROR: Could not extract rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --all-features
          # Ensure the Dockerized action installs and uses a concrete toolchain
          # before executing cargo-deny. This avoids relying on preinstalled
          # aliases like `stable` that may be absent in the container image.
          rust-version: ${{ steps.deny-msrv.outputs.version }}
      - name: Run cargo-deny (fuzz package)
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          arguments: --all-features
          rust-version: ${{ steps.deny-msrv.outputs.version }}

  audit:
    name: Audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scan Rust lockfiles directly against RustSec and both locked JavaScript
    # graphs against the npm advisory service. This complements cargo-deny's
    # broader Rust policy checks (licenses, bans, and sources).
    # Runs on push/PR and daily via schedule (see workflow triggers).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Node.js for npm audits
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Run npm audit (repository tooling)
        run: npm audit
      - name: Run npm audit (browser reference client)
        working-directory: clients/browser
        run: npm audit
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        run: cargo audit
      - name: Run cargo-audit (native reference client)
        run: cargo audit --file clients/native/Cargo.lock
      - name: Run cargo-audit (fuzz package)
        run: cargo audit --file fuzz/Cargo.lock

  msrv:
    name: MSRV Verification
    needs: quick-check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Verify Minimum Supported Rust Version (MSRV) compliance
    # This job catches future regressions when dependencies require newer Rust versions
    # MSRV is the single source of truth defined in Cargo.toml and must be consistent
    # across all configuration files (rust-toolchain.toml, clippy.toml, Dockerfile, etc.)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          # Extract rust-version field from Cargo.toml as the canonical MSRV
          MSRV=$(bash scripts/read-toml-string.sh Cargo.toml rust-version package || true)
          if [ -z "$MSRV" ]; then
            echo "ERROR: Could not extract rust-version from Cargo.toml"
            exit 1
          fi
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          echo "Extracted MSRV: $MSRV"

      - name: Verify MSRV consistency across configuration files
        run: bash scripts/check-msrv-consistency.sh

      - name: Install Rust toolchain at MSRV
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          # Separate cache key for MSRV job to avoid conflicts with main CI
          prefix-key: "msrv"
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Verify build and tests with MSRV
        # Plain `cargo test` (NOT nextest) runs every test binary in parallel
        # with no `process-spawning` isolation, so the multiprocess and
        # idle-timeout tests share CPU with ~40 other binaries. The timeout
        # multiplier gives the idle-timeout tests proportional headroom so a
        # starved task still resets the idle timer in time (see
        # idle_timeout_test_multiplier in tests/e2e_tests.rs).
        env:
          SIGNAL_FISH_TEST_TIMEOUT_MULTIPLIER: "3"
        run: |
          cargo test --locked --all-features --no-fail-fast
          echo "✓ Build and tests successful with MSRV ${{ steps.msrv.outputs.msrv }}"

      - name: Drop trybuild artifacts before cache save
        # See the nextest job: prevents the trybuild/rust-cache `##[error]ENOENT` noise.
        if: always()
        shell: bash
        run: rm -rf "${CARGO_TARGET_DIR:-target}/tests"

  docker:
    name: Docker Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        # Buildx unlocks the GitHub Actions layer cache below. Mirrors the proven
        # pattern in docker-publish.yml (same pinned action versions), turning a
        # cold ~3-5 min image build into a warm sub-minute one on cache hits.
        uses: docker/setup-buildx-action@v4.2.0
      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          # load (not push): import the built image into the local Docker daemon
          # so the smoke test below can `docker run` it.
          load: true
          tags: signal-fish-server:ci
          # Reads are always safe; only EXPORT the layer cache from same-repo runs.
          # A fork PR gets a read-only GITHUB_TOKEN that cannot write the Actions
          # cache, and a `cache-to: type=gha` export failure is fatal by default —
          # so gate the export the same way rust-cache's `save-if` does. An empty
          # cache-to is a no-op export, leaving the cold build correct on forks.
          cache-from: type=gha
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=gha,mode=max' || '' }}

      - name: Smoke test
        run: |
          docker run -d --name test-server -p 3536:3536 signal-fish-server:ci
          # Exponential backoff health check: 1s, 2s, 4s, 8s, 8s (max 23s total wait)
          DELAY=1
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:3536/v2/health > /dev/null 2>&1; then
              echo "Health check passed on attempt $i/5"
              exit 0
            fi
            echo "Attempt $i/5: server not ready, retrying in ${DELAY}s..."
            sleep "$DELAY"
            DELAY=$((DELAY * 2))
            [ "$DELAY" -gt 8 ] && DELAY=8
          done
          echo "ERROR: Server failed to become healthy"
          echo "=== Docker logs ==="
          docker logs test-server
          exit 1

      - name: Cleanup smoke test
        if: always()
        run: |
          docker stop test-server || true
          docker rm test-server || true

  coverage:
    name: Coverage (llvm-cov)
    needs: quick-check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        # cargo-llvm-cov runs the suite via plain `cargo test` (NOT nextest), so
        # the `.config/nextest.toml` `process-spawning` isolation never applies
        # here, and coverage instrumentation slows execution ~2-4x. The timeout
        # multiplier widens the idle-timeout tests' windows proportionally so a
        # briefly CPU-starved task on this oversubscribed, instrumented lane
        # cannot slip the window and flake (see idle_timeout_test_multiplier in
        # tests/e2e_tests.rs and the multiprocess backoff in v3_multiprocess_e2e.rs).
        env:
          SIGNAL_FISH_TEST_TIMEOUT_MULTIPLIER: "3"
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Enforce coverage threshold
        run: cargo llvm-cov report --locked --fail-under-lines 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 14

      - name: Drop trybuild artifacts before cache save
        # See the nextest job: prevents the trybuild/rust-cache `##[error]ENOENT` noise.
        if: always()
        shell: bash
        run: rm -rf "${CARGO_TARGET_DIR:-target}/tests"

  panic-policy:
    name: Panic Policy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        # Rust version controlled by rust-toolchain.toml in repository root (currently 1.91.0)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Run panic-policy check
        run: bash scripts/check-no-panics.sh

  sbom:
    name: SBOM (CycloneDX)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-sbom
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-sbom

      - name: Generate SBOM (CycloneDX)
        run: cargo sbom --output-format cyclone_dx_json_1_5 > sbom.cdx.json

      - name: Upload SBOM artifact
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90
