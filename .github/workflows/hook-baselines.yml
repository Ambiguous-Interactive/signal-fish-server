# Hosted Git Hook Baselines
#
# Records the profiled pre-commit hook runtime baselines on hosted runners
# with the exact command/table shape issue #318 requires (issue #318's
# remaining acceptance: representative macOS and Windows measurements).
#
# Zero standing allocation: this workflow has NO schedule trigger. It runs
# manually (workflow_dispatch) and on pull requests that change the replay,
# the policy fixture, or the pre-commit implementation.
# The measured wall-clock numbers are evidence for docs/issue records — never
# a hosted pass/fail threshold (per the no-flaky doctrine, wall-clock totals
# must not gate correctness).
#
# Each job runs the profiled hook five times per path; run 1 pays the one-time
# Git index refresh (cold) and the remaining runs approximate warm-start.
# Every run must still PASS all hook checks: a baseline from a failing hook is
# not a baseline.
#
name: Hook Baselines

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hook-baselines.yml"
      - ".github/test-fixtures/profile-hook-baselines.py"
      - ".github/test-fixtures/test-internal-refactor.ps1"
      - "scripts/hooks/internal-refactor.ps1"
      - "scripts/hooks/native-process.ps1"
      - "scripts/hooks/pre-commit.ps1"
      - "scripts/hooks/pre-commit-rust.ps1"
      - "scripts/hooks/rust-documentation.ps1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  # Superseded refresh runs are pure duplicate allocations; each run is a
  # self-contained five-repetition profile, so cancelling the outdated one
  # loses no evidence.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    name: Pre-commit Baselines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MATRIX_OS: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record runner provenance
        shell: pwsh
        run: |
          $imageVersion = $Env:ImageVersion
          if (-not $imageVersion) { $imageVersion = 'unknown' }
          Write-Host "runner-os=$Env:RUNNER_OS matrix-os=$Env:MATRIX_OS image-version=$imageVersion"
          git --version
          pwsh --version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.10
          enable-cache: false

      - name: Profile standard pre-commit workloads
        shell: pwsh
        run: uv run --script .github/test-fixtures/profile-hook-baselines.py standard --summary (Join-Path $Env:RUNNER_TEMP "hook-baseline-summary.md")

      - name: Verify exact-blob policy
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .github/test-fixtures/test-internal-refactor.ps1 -RepositoryRoot .

      - name: Profile the exact-blob refactor workload
        shell: pwsh
        run: uv run --script .github/test-fixtures/profile-hook-baselines.py refactor --fetch

      - name: Post baseline summary
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment $Env:PR_NUMBER --body-file (Join-Path $Env:RUNNER_TEMP "hook-baseline-summary.md")
