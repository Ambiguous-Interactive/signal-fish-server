name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependabot:
    name: Enable auto-merge for Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.sender.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Log Dependabot auto-merge context
        env:
          ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "action=$ACTION"
          echo "pr_author=$PR_AUTHOR"
          echo "event_sender=$EVENT_SENDER"
          echo "base_ref=$BASE_REF"
          echo "head_ref=$HEAD_REF"
      - name: Enable auto-merge
        run: |
          set -euo pipefail

          workflow_timeout_minutes=60
          deadline=$((SECONDS + ((workflow_timeout_minutes - 5) * 60)))
          ready_streak=0
          last_seen_count=-1

          while (( SECONDS < deadline )); do
            runs_json="$(gh api \
              "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD_SHA&event=pull_request&per_page=100")"

            analysis="$(jq -r --arg current_run_id "$GITHUB_RUN_ID" '
              (
                [
                  .workflow_runs[]
                  | select((.id | tostring) != $current_run_id)
                  | select(.name != "Dependabot auto-merge")
                ]
                | sort_by(.workflow_id)
                | group_by(.workflow_id)
                | map(max_by([.run_number, .run_attempt]))
              ) as $runs
              | ($runs | length) as $count
              | [
                  $runs[]
                  | select(
                      .status == "completed"
                      and (.conclusion != "success" and .conclusion != "skipped")
                    )
                  | "\(.name)#\(.run_number):\(.conclusion)"
                ] as $failures
              | (
                  if ($failures | length) > 0 then "failed"
                  elif $count == 0 then "pending"
                  elif ([ $runs[] | select(.status != "completed") ] | length) > 0 then "pending"
                  else "ready"
                  end
                ) as $state
              | [$state, ($count | tostring), ($failures | join("; "))]
              | .[]
            ' <<<"$runs_json")"

            state="$(printf '%s\n' "$analysis" | sed -n '1p')"
            seen_count="$(printf '%s\n' "$analysis" | sed -n '2p')"
            failure_summary="$(printf '%s\n' "$analysis" | sed -n '3p')"

            echo "state=$state seen_workflows=$seen_count"

            if [[ "$state" == "failed" ]]; then
              echo "Detected failed CI workflows for this PR head: $failure_summary" >&2
              exit 1
            fi

            if [[ "$state" == "ready" ]]; then
              if [[ "$seen_count" == "$last_seen_count" ]]; then
                ready_streak=$((ready_streak + 1))
              else
                ready_streak=1
                last_seen_count="$seen_count"
              fi

              if (( ready_streak >= 2 )); then
                echo "All observed pull_request workflows are complete and success/skipped."
                set +e
                merge_output="$(gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL" 2>&1)"
                merge_status=$?
                set -e

                if (( merge_status == 0 )); then
                  echo "$merge_output"
                  exit 0
                fi

                if grep -Eiq 'unstable status' <<<"$merge_output"; then
                  echo "Auto-merge enable was rejected due to unstable status; retrying."
                  ready_streak=0
                else
                  echo "$merge_output" >&2
                  exit "$merge_status"
                fi
              fi
            else
              ready_streak=0
            fi

            sleep 15
          done

          echo "Timed out waiting for PR CI workflows to complete successfully." >&2
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
