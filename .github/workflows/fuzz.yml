# Coverage-guided Fuzzing Workflow (cargo-fuzz / libFuzzer)
#
# The NIGHTLY counterpart to the stable in-suite proptest fuzzer
# (tests/protocol_fuzz_hardening.rs, run on every `cargo test`). This job builds
# the out-of-workspace fuzz crate (fuzz/) on the nightly toolchain and smoke-runs
# every target concurrently for a bounded time after one shared build, with
# protocol decoding seeded from canonical wire samples. Every target reaches a
# terminal result even if a sibling crashes; any crash or failed state-machine
# assertion fails the job and uploads the reproducing artifacts.
#
# Kept off the stable toolchain and out of the workspace so it never perturbs the
# pinned-stable build (ADR-0003); see fuzz/README.md.
# Hosted cold baseline: PR #353 run 31611351490 completed this shared job in
# 7m29s after an explicit cache miss, versus 24m05s across the former matrix.

name: Fuzzing

on:
  schedule:
    # Daily 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target (1-300)"
        required: false
        default: "120"
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - ".llm/code-samples/protocol/**"
      - ".github/workflows/fuzz.yml"
      - ".github/scripts/run-fuzz-targets.sh"
      - "Cargo.toml"
      - "build.rs"
      - "src/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz smoke (all targets)
    runs-on: ubuntu-latest
    # The supervisor caps each target at 10 minutes including grace. Retain
    # another 20 minutes for cold setup/prebuild and failure-artifact uploads.
    timeout-minutes: 30
    env:
      FUZZ_TARGETS: decode_protocol validate_inputs fuzz_session_machine fuzz_reconnect_tokens
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Nightly Toolchain Strategy:
      #   cargo-fuzz/libFuzzer requires NIGHTLY Rust: the sanitizer instrumentation
      #   is driven by unstable `-Z` compiler flags (e.g. -Zsanitizer=address) that
      #   are not available on the pinned stable MSRV. Production artifacts are never
      #   built with nightly (ADR-0003); this nightly is CI-only, for the fuzz crate.
      #
      #   Nightly Version: nightly-2026-08-01 (kept in sync with unused-deps.yml)
      #   Last Updated: 2026-08-02
      #
      #   Update Criteria (when to bump this pin):
      #     - If the nightly version is >6 months old
      #     - If security advisories affect this version
      #     - If cargo-fuzz/libFuzzer requires newer nightly sanitizer features
      #     - If the nightly version becomes unavailable or broken
      #
      #   See also: .llm/skills/msrv-management/SKILL.md (Nightly-Only CI Tools section)
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-01
          # Explicitly add the gnu std target for this nightly. The runner is a
          # gnu host (so gnu std is already present via the host toolchain), but
          # pin it here so the `--target x86_64-unknown-linux-gnu` build below is
          # robust regardless of how cargo-fuzz was installed. See the Fuzz step.
          targets: x86_64-unknown-linux-gnu

      - name: Verify locked fuzz dependency graph
        run: cargo +nightly-2026-08-01 metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 >/dev/null

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.87.0
        with:
          tool: cargo-fuzz

      - name: Seed corpus from canonical wire samples
        run: |
          mkdir -p fuzz/corpus/decode_protocol
          i=0
          for f in .llm/code-samples/protocol/*.jsonl; do
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              printf '%s' "$line" > "fuzz/corpus/decode_protocol/seed_$i"
              i=$((i + 1))
            done < "$f"
          done
          echo "Seeded $i corpus entries"

      - name: Build all fuzz targets once
        # One all-target build shares the expensive server and libFuzzer compile
        # prefix across all targets. The unconditional live build also means a
        # missing or stale Rust cache can affect speed, never correctness.
        # A target-specific compile failure is re-observed by that target's
        # gating run below without preventing its independent siblings.
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 600s cargo +nightly-2026-08-01 fuzz build --target x86_64-unknown-linux-gnu

      - name: Fuzz all targets concurrently
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '120' }}
        # `--target x86_64-unknown-linux-gnu` is REQUIRED, not cosmetic. cargo-fuzz
        # derives its DEFAULT build target from its OWN binary's host triple, and
        # taiki-e/install-action installs the musl-built cargo-fuzz (cargo-binstall
        # fallback), so the default target becomes x86_64-unknown-linux-musl. On a
        # gnu runner that build fails: ASan is incompatible with musl's static crt
        # and musl std is not installed (cargo-fuzz#398). Pinning the gnu target
        # makes the instrumented build use gnu std + a working sanitizer. Do not
        # remove. cargo-fuzz rejects `--locked`; the locked metadata preflight
        # above therefore guards the committed graph before this build starts.
        run: bash .github/scripts/run-fuzz-targets.sh

      - name: Upload decode_protocol failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-decode_protocol
          path: |
            fuzz/artifacts/decode_protocol/
            ${{ runner.temp }}/fuzz-logs/decode_protocol.log
          if-no-files-found: ignore

      - name: Upload validate_inputs failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-validate_inputs
          path: |
            fuzz/artifacts/validate_inputs/
            ${{ runner.temp }}/fuzz-logs/validate_inputs.log
          if-no-files-found: ignore

      - name: Upload fuzz_session_machine failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-fuzz_session_machine
          path: |
            fuzz/artifacts/fuzz_session_machine/
            ${{ runner.temp }}/fuzz-logs/fuzz_session_machine.log
          if-no-files-found: ignore

      - name: Upload fuzz_reconnect_tokens failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-fuzz_reconnect_tokens
          path: |
            fuzz/artifacts/fuzz_reconnect_tokens/
            ${{ runner.temp }}/fuzz-logs/fuzz_reconnect_tokens.log
          if-no-files-found: ignore
