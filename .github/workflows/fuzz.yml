# Coverage-guided Fuzzing Workflow (cargo-fuzz / libFuzzer)
#
# The NIGHTLY counterpart to the stable in-suite proptest fuzzer
# (tests/protocol_fuzz_hardening.rs, run on every `cargo test`). This job builds
# the out-of-workspace fuzz crate (fuzz/) on the nightly toolchain and smoke-runs
# each target for a bounded time, seeded from the canonical wire samples. A
# crash (panic/abort/overflow on the decode or validation surface) fails the job
# and uploads the reproducing artifact.
#
# Kept off the stable toolchain and out of the workspace so it never perturbs the
# pinned-stable build (ADR-0003); see fuzz/README.md.

name: Fuzzing

on:
  schedule:
    # Daily 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to fuzz each target"
        required: false
        default: "120"
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "src/protocol/**"
      - "src/websocket/token_binding.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [decode_protocol, validate_inputs]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-01

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.81.8
        with:
          tool: cargo-fuzz

      - name: Seed corpus from canonical wire samples
        if: matrix.target == 'decode_protocol'
        run: |
          mkdir -p fuzz/corpus/decode_protocol
          i=0
          for f in .llm/code-samples/protocol/*.jsonl; do
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              printf '%s' "$line" > "fuzz/corpus/decode_protocol/seed_$i"
              i=$((i + 1))
            done < "$f"
          done
          echo "Seeded $i corpus entries"

      - name: Fuzz ${{ matrix.target }}
        env:
          MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time || '120' }}
        run: |
          cargo +nightly-2026-02-01 fuzz run ${{ matrix.target }} -- \
            -max_total_time="${MAX_TOTAL_TIME}" -max_len=65536

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
