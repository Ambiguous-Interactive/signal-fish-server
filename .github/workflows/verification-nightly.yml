# Nightly Delivery Verification Workflow
#
# The NIGHTLY counterpart to the PR-lane relay reliability suites
# (tests/relay_backpressure_e2e.rs, tests/relay_chaos_e2e.rs): long-running,
# minutes-scale verification of the issue #131 delivery contract ("zero loss
# or loud disconnect") that is deliberately kept out of every PR build.
#
# Jobs:
#   - soak: tests/relay_delivery_soak.rs — paced senders vs. oscillating /
#     stalled receivers over real sockets; terminal delivery-ledger and
#     conservation assertions.
#   - concurrency-stress: tests/delivery_concurrency_stress.rs — the
#     loom-substitute lane racing deliver_or_disconnect against receiver
#     drops and explicit closes across thousands of scheduler samples.
#   - load-smoke: the in-process latency-distribution, room-creation-throughput,
#     and sustained-connections smoke tests from tests/load_tests.rs. The latter
#     two were previously excluded as known-broken; issue #207 traced that to
#     invalid room-code lengths across the whole suite — see the load-smoke job
#     comment. NOTE these are throughput/latency smoke checks
#     only — their clients are mpsc channels that cannot observe delivery
#     (see the module docs in tests/load_tests.rs); the delivery contract is
#     verified by the soak/backpressure suites above.
#   - multiprocess-delivery: tests/multiprocess_delivery_e2e.rs — REAL server
#     + REAL client processes with OS faults (SIGSTOP/SIGKILL); the three
#     ignored child-process tests need the pre-built native reference client
#     (SIGNAL_FISH_CLIENT_BIN), which is why they are nightly-only.
#     The same job runs the clean WebRTC {mesh,host} x {2,8,16} matrix, the H8
#     16-client crippled-ICE fallback proof, and the N=3 pairwise ICE partition.
#   - starved-runtime: clients/native/tests/starved_runtime_e2e.rs — the
#     --runtime current / --tick-stall-ms conformance matrix pinning the
#     documented "continuously drive your runtime" requirement.
#   - scenario-profiles: tests/scenario_realworld_e2e.rs with
#     --run-ignored all — the PR-lane traffic profiles plus the nightly-only
#     backgrounded-tab profile (multi-second absorbed pauses + eviction).
#     The same job runs tests/sixteen_player_matrix_e2e.rs, adding the twelve
#     per-client jitter/throttle and burst-pause relay matrix cells plus the
#     H2 16-player throughput/latency knee sweep.
#     It also runs the H14 mixed-encoding amplification experiment: exact
#     unsupported-format reports under a bandwidth-constrained JSON fallback.
#     H10 classifies a 256-kbps recipient under ~90-KiB/s reliable and volatile
#     demand, including loud reconnect flaps and the volatile
#     stable-versus-fail-loud classification.
#   - split-brain-catalog: tests/split_brain_two_instances_e2e.rs — two real
#     server processes pin the unsupported multi-instance failure catalog used
#     by the deployment doctrine.
#   - trace-validation: the reliable-delivery trace contract captures
#     deterministic paused-clock producer traces plus a real-socket
#     writer/finalizer trace. The classified-omission and reconnect-lifecycle
#     trace contract captures the corresponding protocol-v3 observations.
#     Both contracts compile to TLA+, replay with TLC, and exercise seeded
#     negative oracles. Informational initially.
#
# Long-running targeted tests are `#[ignore]`d in-tree (a scheduling decision,
# not a flakiness mask) and activated here with `--run-ignored all`; the focused
# sequenced-relay socket captures are ordinary exact tests. Job timeouts are generous floors
# over measured wall times (build + run), per the zero-flakiness policy: a
# too-tight timeout-minutes cancels a healthy-but-loaded run and is itself a
# flake source.

name: Verification Nightly

on:
  schedule:
    # Daily 03:00 UTC (an hour before fuzz.yml's 04:00 to stagger runner load).
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/coordination/**"
      - "src/websocket/**"
      - "src/server/connection_manager.rs"
      - "tests/relay_delivery_soak.rs"
      - "tests/delivery_concurrency_stress.rs"
      - "tests/load_tests.rs"
      - "tests/multiprocess_delivery_e2e.rs"
      - "tests/webrtc_mesh_budget_e2e.rs"
      - "tests/scenario_realworld_e2e.rs"
      - "tests/v3_game_data_sequencing_e2e.rs"
      - "tests/sixteen_player_matrix_e2e.rs"
      - "tests/asymmetric_bandwidth_flap_e2e.rs"
      - "tests/split_brain_two_instances_e2e.rs"
      - "tests/websocket_test_helpers/**"
      - "formal/tla/SequencedRelayTrace.tla"
      - "scripts/generate-sequenced-relay-trace.py"
      - "scripts/run-sequenced-relay-trace-validation.sh"
      - "clients/native/**"
      - ".github/workflows/verification-nightly.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SIGNAL_FISH_H14_CONTRACT_VERSION: h14-capacity-v1

jobs:
  soak:
    name: Relay Delivery Soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest
      - name: Run relay delivery soak
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test relay_delivery_soak --run-ignored all \
            --success-output final 2>&1 | tee soak-output.txt
      - name: Report soak results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Relay delivery soak"
            echo
            echo '```text'
            tail -n 60 soak-output.txt 2>/dev/null || echo "no soak output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  concurrency-stress:
    name: Delivery Concurrency Stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest
      - name: Run delivery concurrency stress
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test delivery_concurrency_stress --run-ignored all \
            --success-output final 2>&1 | tee stress-output.txt
      - name: Report stress results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Delivery concurrency stress"
            echo
            echo '```text'
            tail -n 40 stress-output.txt 2>/dev/null || echo "no stress output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  load-smoke:
    name: Load Smoke (in-process throughput)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest
      # All three room-based smoke cells are activated by name. The two
      # throughput cells were previously excluded as "known-broken": every cell
      # in load_tests.rs built a room code of the wrong length (the server
      # requires exactly 6 characters), so no player ever entered a room. That
      # zeroed the throughput cells' success rate and silently made the latency
      # cell measure broadcasts into empty rooms. Issue #207 repaired the codes,
      # raised the room ceiling for the 250-500 room cells, and added assertions
      # that players actually joined, so all three now measure real work. The
      # remaining #[ignore]d load tests (stress to failure, memory projection,
      # connection-rate) are exploratory and stay manual. These tests cannot
      # observe delivery — see the load_tests.rs module docs — so this job
      # reports numbers and fails only on genuine test failure.
      - name: Run load smoke tests
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test load_tests --run-ignored all --success-output final -- \
            test_load_message_latency_distribution \
            test_load_room_creation_throughput \
            test_load_sustained_concurrent_connections \
            2>&1 | tee load-output.txt
      - name: Report load numbers to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Load smoke numbers (in-process; cannot observe delivery)"
            echo
            echo '```text'
            tail -n 120 load-output.txt 2>/dev/null || echo "no load output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  multiprocess-delivery:
    name: Multi-Process Delivery Faults
    runs-on: ubuntu-latest
    # Generous floor: after the native reference client build, twelve WebRTC
    # cells run serially in the process-spawning group (eight clean/H8/
    # deterministic-partition plus four privileged 1%-loss cells). Each has a 600s
    # nextest ceiling above its 540s child watchdog, so the job ceiling keeps
    # principled headroom for all cells plus the delivery-fault suite and cold
    # compilation (zero-flakiness policy).
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          workspaces: |
            .
            clients/native
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest
      - name: Build the native reference client
        shell: bash
        run: |
          cargo build --locked --manifest-path clients/native/Cargo.toml \
            --bin signal-fish-reference-native
      # --run-ignored all activates the three nightly-only child-process tests
      # (SIGSTOP resume, SIGSTOP eviction, SIGKILL mid-burst) alongside the PR-lane
      # server-restart test; the pre-built client binary is handed over via
      # SIGNAL_FISH_CLIENT_BIN so the suite's nested-build fallback never
      # runs in CI.
      - name: Run multi-process delivery fault tests
        shell: bash
        env:
          SIGNAL_FISH_CLIENT_BIN: ${{ github.workspace }}/clients/native/target/debug/signal-fish-reference-native
          SIGNAL_FISH_MULTIPROCESS_EVIDENCE_DIR: ${{ runner.temp }}/multiprocess-delivery
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test multiprocess_delivery_e2e --run-ignored all \
            --success-output final 2>&1 | tee multiprocess-output.txt
      - name: Upload multi-process delivery evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: multiprocess-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            multiprocess-output.txt
            ${{ runner.temp }}/multiprocess-delivery/**
          retention-days: 30
          if-no-files-found: error
      - name: Run WebRTC topology, size, and deterministic partition matrix
        shell: bash
        env:
          SIGNAL_FISH_CLIENT_BIN: ${{ github.workspace }}/clients/native/target/debug/signal-fish-reference-native
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test webrtc_mesh_budget_e2e --run-ignored all \
            -E 'not test(one_percent_loss)' \
            --no-tests fail \
            --success-output final 2>&1 | tee webrtc-matrix-output.txt
      - name: Run fail-loud WebRTC netem loss matrix
        shell: bash
        env:
          SIGNAL_FISH_CLIENT_BIN: ${{ github.workspace }}/clients/native/target/debug/signal-fish-reference-native
          SF_NETEM_ACTIVE: "1"
        run: |
          set -o pipefail
          cleanup_netem() {
            sudo -n tc qdisc del dev lo root 2>/dev/null || true
          }
          for test_name in \
            one_percent_loss_mesh_n2_recovers_exact_ledgers_after_fault_lift \
            one_percent_loss_mesh_n8_recovers_exact_ledgers_after_fault_lift \
            one_percent_loss_host_n2_recovers_exact_ledgers_after_fault_lift \
            one_percent_loss_host_n8_recovers_exact_ledgers_after_fault_lift
          do
            cleanup_netem
            trap cleanup_netem EXIT
            cargo nextest run --profile ci --locked --all-features \
              --test webrtc_mesh_budget_e2e --run-ignored all \
              -E "test($test_name)" \
              --no-tests fail \
              --success-output final 2>&1 | tee -a webrtc-matrix-output.txt
            cleanup_netem
            trap - EXIT
          done
      - name: Remove WebRTC network fault state
        if: always()
        shell: bash
        run: |
          sudo -n tc qdisc del dev lo root 2>/dev/null || true
          if tc qdisc show dev lo | grep -q netem; then
            echo "ERROR: netem remained active after the WebRTC matrix"
            tc qdisc show dev lo
            exit 1
          fi
      - name: Report multi-process results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Multi-process delivery faults"
            echo
            echo '```text'
            tail -n 60 multiprocess-output.txt 2>/dev/null || echo "no multiprocess output captured"
            echo '```'
            echo
            echo "### WebRTC clean/loss topology-size matrix and deterministic partitions"
            echo
            echo '```text'
            tail -n 260 webrtc-matrix-output.txt 2>/dev/null || echo "no WebRTC matrix output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  starved-runtime:
    name: Starved-Runtime Conformance Matrix
    runs-on: ubuntu-latest
    # Generous floor: builds the server binary plus the client crate's full
    # webrtc dependency graph before the matrix runs.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          workspaces: |
            .
            clients/native
      - name: Build the server binary
        shell: bash
        run: |
          cargo build --locked --bin signal-fish-server
      # --ignored activates the nightly-only matrix cells; --test-threads=1
      # keeps the flood-heavy cells from CPU-starving each other (they also
      # carry #[serial_test::serial] as an in-binary guard).
      - name: Run the starved-runtime matrix
        shell: bash
        env:
          SIGNAL_FISH_SERVER_BIN: ${{ github.workspace }}/target/debug/signal-fish-server
        run: |
          set -o pipefail
          cargo test --locked --manifest-path clients/native/Cargo.toml \
            --test starved_runtime_e2e -- --ignored --test-threads=1 \
            2>&1 | tee starved-runtime-output.txt
      - name: Report starved-runtime results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Starved-runtime conformance matrix"
            echo
            echo '```text'
            tail -n 60 starved-runtime-output.txt 2>/dev/null || echo "no starved-runtime output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scenario-profiles:
    name: Real-World Scenario Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        id: install-rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-nextest
        id: install-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest
      # --run-ignored all: the PR-lane profiles (already covered by the ci.yml
      # nextest job) PLUS the nightly-only backgrounded-tab profile.
      - name: Run real-world scenario profiles
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test scenario_realworld_e2e --run-ignored all \
            --success-output final 2>&1 | tee scenario-output.txt
      # Keep the dedicated hosted-timing selector isolated in its own workflow;
      # this broad nightly lane supplies no observation metadata and would only
      # duplicate the clean six-cell workload under unrelated contention.
      - name: Run 16-player relay matrix and knee sweep
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test sixteen_player_matrix_e2e --run-ignored all \
            --success-output final -- \
            --skip hosted_relay_timing_observations_preserve_semantic_oracles \
            2>&1 | tee relay-matrix-output.txt
      - name: Run mixed-encoding amplification experiment
        id: h14
        if: >-
          ${{ github.event_name != 'pull_request' && always() && !cancelled() &&
              steps.checkout.outcome == 'success' &&
              steps.toolchain.outcome == 'success' &&
              steps.install-rust.outcome == 'success' &&
              steps.install-nextest.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          : > mixed-encoding-output.txt
          : > h14-started
          set +e
          cargo nextest run --profile ci --locked --all-features \
            --test mixed_encoding_relay_e2e --run-ignored ignored-only \
            -E 'test(=unsupported_message_pack_fallback_does_not_flap_weaker_recipient)' \
            --no-tests fail \
            --success-output final 2>&1 | tee mixed-encoding-output.txt
          h14_status=$?
          set -e
          printf '%s\n' "$h14_status" > h14-exit-code.txt
          exit "$h14_status"
      - name: Write H14 attempt manifest
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          H14_OUTCOME: ${{ steps.h14.outcome }}
          JOB_STATUS: ${{ job.status }}
          SIGNAL_FISH_RUST_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: |
          set -euo pipefail
          h14_started=false
          if [ -f h14-started ]; then
            h14_started=true
          fi
          h14_finished=false
          h14_exit_code=null
          if [ -f h14-exit-code.txt ]; then
            h14_finished=true
            read -r h14_exit_code < h14-exit-code.txt
          fi
          raw_log_present=false
          raw_log_bytes=0
          if [ -f mixed-encoding-output.txt ]; then
            raw_log_present=true
            raw_log_bytes=$(wc -c < mixed-encoding-output.txt | tr -d ' ')
          fi
          terminal_outcome=false
          if [ "$H14_OUTCOME" = "success" ] || [ "$H14_OUTCOME" = "failure" ]; then
            terminal_outcome=true
          fi
          evidence_complete=false
          if [ "$h14_started" = true ] && [ "$h14_finished" = true ] \
            && [ "$raw_log_present" = true ] && [ "$raw_log_bytes" -gt 0 ] \
            && [ "$terminal_outcome" = true ]; then
            evidence_complete=true
          fi
          passed=false
          if [ "$evidence_complete" = true ] && [ "$H14_OUTCOME" = "success" ] \
            && [ "$h14_exit_code" = "0" ]; then
            passed=true
          fi
          eligible=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            eligible=true
          fi
          {
            printf '{"schema_version":1,'
            printf '"contract_version":"%s",' "$SIGNAL_FISH_H14_CONTRACT_VERSION"
            printf '"event_name":"%s","run_id":"%s",' \
              "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID"
            printf '"run_attempt":"%s","commit_sha":"%s",' \
              "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
            printf '"runner_os":"%s","runner_image_os":"%s",' \
              "$RUNNER_OS" "${ImageOS:-unknown}"
            printf '"runner_image_version":"%s","rust_toolchain":"%s",' \
              "${ImageVersion:-unknown}" "${SIGNAL_FISH_RUST_TOOLCHAIN:-unknown}"
            printf '"h14_outcome":"%s","job_status":"%s",' \
              "$H14_OUTCOME" "$JOB_STATUS"
            printf '"h14_started":%s,"h14_finished":%s,' \
              "$h14_started" "$h14_finished"
            printf '"h14_exit_code":%s,"raw_log_present":%s,' \
              "$h14_exit_code" "$raw_log_present"
            printf '"raw_log_bytes":%s,"evidence_complete":%s,' \
              "$raw_log_bytes" "$evidence_complete"
            printf '"passed":%s,"eligible":%s}\n' "$passed" "$eligible"
          } > h14-attempt.json
      - name: Upload H14 attempt evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: h14-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mixed-encoding-output.txt
            h14-attempt.json
          retention-days: 30
          if-no-files-found: error
      - name: Run asymmetric-bandwidth flap experiment
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --profile ci --locked --all-features \
            --test asymmetric_bandwidth_flap_e2e --run-ignored ignored-only \
            --success-output final 2>&1 | tee asymmetric-bandwidth-output.txt
      - name: Report scenario results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Real-world scenario profiles"
            echo
            echo '```text'
            tail -n 60 scenario-output.txt 2>/dev/null || echo "no scenario output captured"
            echo '```'
            echo
            echo "### 16-player relay matrix and knee sweep"
            echo
            echo '```text'
            tail -n 60 relay-matrix-output.txt 2>/dev/null || echo "no relay matrix output captured"
            echo '```'
            echo
            echo "### Mixed-encoding amplification"
            echo
            echo '```text'
            tail -n 60 mixed-encoding-output.txt 2>/dev/null || echo "no mixed-encoding output captured"
            echo '```'
            echo
            echo "### Asymmetric-bandwidth flap classification"
            echo
            echo '```text'
            tail -n 60 asymmetric-bandwidth-output.txt 2>/dev/null || echo "no asymmetric-bandwidth output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  split-brain-catalog:
    name: Single-Instance Doctrine Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-nextest
      - name: Run split-brain failure catalog
        shell: bash
        run: |
          cargo nextest run --profile ci --locked --all-features \
            --test split_brain_two_instances_e2e --run-ignored all

  trace-validation:
    name: Delivery Trace Replays (informational)
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install Java runtime
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache TLA+ tools jar
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/signal-fish/tla
          key: tla2tools-${{ hashFiles('scripts/run-tla-model-check.sh') }}
      - name: Capture deterministic model-based delivery traces
        shell: bash
        env:
          PROPTEST_CASES: "32"
          # proptest 1.11 parses this setting as a decimal u64.
          PROPTEST_RNG_SEED: "131045"
          SIGNAL_FISH_DELIVERY_TRACE_PATH: ${{ runner.temp }}/delivery-contract.jsonl
        run: |
          : > "${SIGNAL_FISH_DELIVERY_TRACE_PATH}"
          cargo test --locked --features trace-validation \
            --test model_based_state_machines \
            delivery_contract_matches_reference_ledger -- --exact
          cargo test --locked --features trace-validation \
            --test e2e_tests test_websocket_connection -- --exact
      - name: Compile and replay traces with TLC
        shell: bash
        run: |
          bash scripts/run-delivery-trace-validation.sh \
            "${{ runner.temp }}/delivery-contract.jsonl" \
            "${{ runner.temp }}/delivery-trace-validation"
      - name: Capture and replay classified sequenced-relay observations
        shell: bash
        env:
          SIGNAL_FISH_SEQUENCED_TRACE_PATH: ${{ runner.temp }}/sequenced-classified.jsonl
        run: |
          cargo test --locked --features trace-validation \
            --test v3_game_data_sequencing_e2e \
            latest_coalescing_reports_exact_gap_before_successor -- --exact
          mkdir -p "${{ runner.temp }}/sequenced-classified-replay"
          python3 scripts/generate-sequenced-relay-trace.py \
            --input "${SIGNAL_FISH_SEQUENCED_TRACE_PATH}" \
            --output-dir "${{ runner.temp }}/sequenced-classified-replay"
          bash scripts/run-tla-model-check.sh \
            --tla-dir "${{ runner.temp }}/sequenced-classified-replay"
      - name: Capture and replay reconnect sequenced-relay observations
        shell: bash
        env:
          SIGNAL_FISH_SEQUENCED_TRACE_PATH: ${{ runner.temp }}/sequenced-reconnect.jsonl
        run: |
          cargo test --locked --features trace-validation \
            --test scenario_realworld_e2e reconnect_under_fire -- --exact
          bash scripts/run-sequenced-relay-trace-validation.sh \
            "${SIGNAL_FISH_SEQUENCED_TRACE_PATH}" \
            "${{ runner.temp }}/sequenced-reconnect-replay"
      - name: Upload trace-validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: delivery-trace-validation
          path: |
            ${{ runner.temp }}/delivery-contract.jsonl
            ${{ runner.temp }}/delivery-trace-validation
            ${{ runner.temp }}/sequenced-classified.jsonl
            ${{ runner.temp }}/sequenced-classified-replay
            ${{ runner.temp }}/sequenced-reconnect.jsonl
            ${{ runner.temp }}/sequenced-reconnect-replay
          if-no-files-found: warn
          retention-days: 14
