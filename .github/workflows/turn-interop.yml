# TURN-only WebRTC Interop
#
# Runs the native reference clients against a digest-pinned local coturn with
# direct candidates forbidden. The positive cell proves an actual relayed ICE
# pair and exact reliable/unreliable data; the mismatched-secret control proves
# deterministic failure and the live WebSocket fallback floor. This is an
# in-repository operability proof, not validation of production TURN infra.

name: TURN-only WebRTC Interop

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clients/native/**"
      - "scripts/run-turn-interop.sh"
      - "scripts/read-toml-string.sh"
      - ".github/workflows/turn-interop.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clients/native/**"
      - "scripts/run-turn-interop.sh"
      - "scripts/read-toml-string.sh"
      - ".github/workflows/turn-interop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COTURN_IMAGE: >-
    coturn/coturn:4.12.0-alpine@sha256:faca4aa57efc436916c31546f3867bd1a3fb1077723291bcfba0bf814bcaf48a

jobs:
  turn-interop:
    name: Local coturn relay-only data path
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: |
            .
            clients/native
          save-if: >-
            ${{ github.event_name != 'pull_request' ||
                github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Provision pinned test dependencies
        timeout-minutes: 4
        run: |
          docker image inspect "$COTURN_IMAGE" >/dev/null 2>&1 ||
            docker pull "$COTURN_IMAGE"
          cargo fetch --locked
          cargo fetch --locked --manifest-path clients/native/Cargo.toml
      - name: Run offline pinned local coturn interoperability
        run: timeout --signal=TERM --kill-after=30s 15m bash scripts/run-turn-interop.sh
      - name: Upload TURN diagnostics on failure
        if: ${{ always() && !success() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: turn-interop-diagnostics-${{ github.run_id }}
          path: target/turn-interop/
          if-no-files-found: error
          retention-days: 14
