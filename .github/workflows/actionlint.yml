# Validates GitHub Actions workflow files for syntax errors, best practices,
# and common mistakes using actionlint. This ensures workflow quality and helps
# catch issues before they cause CI/CD failures.
#
# Runs on:
# - Pull requests to main (when workflow files change)
#
# Features:
# - Path filtering to only run when workflow/action files change
# - Uploads actionlint results as artifacts for review
# - Enforces timeout to prevent hanging jobs
# - Automatic cancellation of stale runs via concurrency groups

name: ActionLint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.devcontainer/Dockerfile'

# Limit permissions to minimum required (security best practice)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install native actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F= '$1 == "ARG ACTIONLINT_VERSION" { print $2 }' .devcontainer/Dockerfile)
          checksum=$(awk -F= '$1 == "ARG ACTIONLINT_AMD64_SHA256" { print $2 }' .devcontainer/Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --output "$tmp_dir/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$checksum" "$tmp_dir/$archive" | sha256sum -c -
          tar -xzf "$tmp_dir/$archive" -C "$tmp_dir" actionlint
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          install -m 0755 "$tmp_dir/actionlint" "$RUNNER_TEMP/actionlint-bin/actionlint"
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint-bin/actionlint" -version
      - name: Install ShellCheck
        uses: taiki-e/install-action@v2.87.22
        with:
          tool: shellcheck@0.11.0
          fallback: none
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Pyflakes
        run: python -m pip install pyflakes==3.4.0
      - name: Run actionlint
        id: actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint -color 2>&1 | tee actionlint-results.log
      - name: Upload actionlint results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: actionlint-results
          path: |
            actionlint-*.log
            actionlint-*.sarif
          retention-days: 30
          if-no-files-found: ignore
