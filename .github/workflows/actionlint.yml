# Validates GitHub Actions workflow files for syntax errors, best practices,
# and common mistakes using actionlint. This ensures workflow quality and helps
# catch issues before they cause CI/CD failures.
#
# Runs on:
# - Push to main branch (when workflow files change)
# - Pull requests to main (when workflow files change)
#
# Features:
# - Path filtering to only run when workflow/action files change
# - Uploads actionlint results as artifacts for review
# - Enforces timeout to prevent hanging jobs
# - Automatic cancellation of stale runs via concurrency groups

name: ActionLint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'

# Limit permissions to minimum required (security best practice)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Run actionlint
        id: actionlint
        uses: devops-actions/actionlint@v0.1.12
      - name: Upload actionlint results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: actionlint-results
          path: |
            actionlint-*.log
            actionlint-*.sarif
          retention-days: 30
          if-no-files-found: ignore
