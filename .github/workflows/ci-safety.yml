# Advanced Safety Workflow
#
# Advanced safety analysis using Miri and AddressSanitizer to detect undefined
# behavior, memory errors, and other safety violations that standard tests and
# lints cannot catch.
#
# Runs on:
#   - Push to main branch
#   - Pull requests to main
#   - Weekly schedule (Sunday at 02:00 UTC) for heavy analysis jobs
#   - Manual workflow_dispatch for diagnostics and debugging
#
# all-jobs-run-on-schedule
#
# Staged / Non-Required Status:
#   Both jobs use continue-on-error: true and are NOT branch-protection required
#   checks. They produce actionable diagnostics (uploaded as artifacts) but do
#   not block merges until promoted. This lets us observe failure patterns and
#   toolchain stability before gating PRs on these heavyweight analyses.
#
# Jobs:
#   - miri: Interprets test code to detect undefined behavior (UB), uninitialized
#     reads, data races, and other safety violations unreachable by native tests
#   - asan: Runs the full test suite under AddressSanitizer to detect memory
#     errors such as use-after-free, buffer overflows, and memory leaks
#
# Nightly Toolchain Strategy:
#   Miri and AddressSanitizer require nightly Rust because they depend on
#   unstable compiler internals and runtime instrumentation that are not
#   available on the stable channel.
#
#   Nightly Version: nightly-2026-02-01
#   Last Updated: 2026-02-22
#
#   Update Criteria (when to update this nightly version):
#     - If the nightly version is >6 months old
#     - If security advisories affect this version
#     - If Miri or sanitizer support requires newer nightly features
#     - If the nightly version becomes unavailable or broken
#
#   Why We Pin Nightly (instead of using rolling "nightly"):
#     - Reproducibility: Same nightly = consistent CI results over time
#     - Stability: Prevents sudden breakage from nightly compiler changes
#     - Predictability: We control when nightly updates happen
#
#   Trade-offs:
#     - Pinned nightly becomes stale over time (requires periodic updates)
#     - Rolling "nightly" always has latest features but may break unexpectedly
#     - For CI-only tools like Miri and sanitizers, pinning is preferred for stability
#
#   Policy:
#     - Production code MUST use stable MSRV (see Cargo.toml rust-version)
#     - CI-only analysis tools MAY use nightly if required by the tool
#     - Nightly is NEVER used for building production artifacts
#
#   See also: .llm/skills/msrv-management.md (Nightly-Only CI Tools section)
#
# Promotion Criteria:
#   These staged checks should be promoted to required branch-protection checks when:
#     - Failure rate < 2% over a 2-4 week observation window
#     - No nightly toolchain incidents (breakage, unavailability) during that window
#     - Median runtime stays within the timeout budget (45 min Miri, 30 min ASan)
#   Until promotion, failures are informational and should be triaged weekly.

name: Advanced Safety

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci-safety.yml'
  schedule:
    # Weekly on Sunday at 02:00 UTC — heavy analysis jobs
    - cron: "0 2 * * 0"
  workflow_dispatch:
    # Manual trigger for diagnostics and debugging

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Miri interprets code rather than compiling it natively, which is
    # significantly slower — 10-50x depending on the test suite size.
    timeout-minutes: 45
    # Staged: non-blocking until promoted to a required check
    continue-on-error: true
    env:
      CARGO_TARGET_DIR: target/miri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
      - name: Install Rust nightly toolchain with Miri
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-01
          components: miri, rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          # Isolate the nightly safety build cache (distinct toolchain/RUSTFLAGS) from the
          # stable CI caches; the "-v2" epoch busted older caches that predate this split.
          # (trybuild/rust-cache ENOENT noise is handled by dropping `<target>/tests`, not here.)
          prefix-key: "ci-safety-nightly-v2"
          workspaces: ". -> target/miri"
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Setup Miri
        run: cargo +nightly-2026-02-01 miri setup

      - name: Run Miri on library tests
        # Isolation is disabled so the interpreter services wall-clock
        # (clock_gettime), entropy (getrandom), and getcwd syscalls instead of
        # aborting on them. The purpose of Miri here is detecting undefined
        # behavior, data races, and memory errors — not logic determinism — so
        # passing those syscalls through to the host is the right trade-off, and
        # it lets ordinary time/UUID-using unit tests run under Miri instead of
        # being annotated out. This structurally eliminates the entire class of
        # "test reached an isolated syscall" failures.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          set -euo pipefail
          echo "Running Miri on library unit tests (isolation disabled)..."
          echo "Note: Integration tests are excluded because they use networking,"
          echo "async runtimes, and OS-level I/O that Miri cannot interpret."
          echo "CARGO_TARGET_DIR: ${CARGO_TARGET_DIR:-<default>}"
          cargo +nightly-2026-02-01 miri test --locked --lib --no-fail-fast 2>&1 | tee miri-output.txt
          echo "Miri analysis complete."

      - name: Diagnose Miri failures
        if: failure()
        run: |
          set -euo pipefail
          echo "=== Miri diagnostic context ==="
          echo "workflow: ${{ github.workflow }}"
          echo "job: Miri"
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo "runner: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          echo "CARGO_TARGET_DIR: ${CARGO_TARGET_DIR:-<default>}"
          if [ ! -f miri-output.txt ]; then
            echo "miri-output.txt is missing"
            exit 0
          fi
          echo "=== miri-output.txt failure markers ==="
          grep -nE "FAILED|failures:|panicked at|error:|undefined behavior|unsupported operation" \
            miri-output.txt || true
          # Isolation is disabled (see the run step), so wall-clock / entropy /
          # getcwd syscalls no longer fail. The failure modes that remain are
          # genuine undefined behavior and operations Miri cannot interpret at
          # all (most commonly platform SIMD/FFI intrinsics). Surface whichever
          # applies with targeted remediation.
          ub_re="undefined behavior|Undefined Behavior|data race|use-after-free|out-of-bounds|uninitialized"
          if grep -qE "$ub_re" miri-output.txt; then
            echo "=== Likely cause: genuine undefined behavior detected by Miri ==="
            echo "This is the signal Miri exists to catch. Treat it as a real bug in the code under test"
            echo "(or its unsafe dependencies), not a test-harness artifact."
            grep -nE "$ub_re" miri-output.txt | tail -n 5 || true
          elif grep -qE "unsupported operation|can't call foreign function" miri-output.txt; then
            echo "=== Likely cause: a test reached an operation Miri cannot interpret ==="
            echo "With isolation disabled, the usual trigger is a platform SIMD/FFI intrinsic"
            echo "(for example a vendor 'llvm.*' intrinsic) Miri has no model for; it aborts on the first one."
            echo "Operation(s) reported:"
            grep -nE "unsupported operation[^\"]*|can't call foreign function[^\"]*" miri-output.txt | tail -n 5 || true
            echo "Remediation: gate the intrinsic-using path behind cfg(not(miri)) with a portable fallback,"
            echo "or add #[cfg_attr(miri, ignore)] to the specific test that reaches it."
          fi
          echo "=== miri-output.txt tail -n 200 ==="
          tail -n 200 miri-output.txt

      - name: Upload Miri output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: miri-output
          path: miri-output.txt
          retention-days: 14

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Staged: non-blocking until promoted to a required check
    continue-on-error: true
    env:
      ASAN_OPTIONS: "detect_odr_violation=0"
      CARGO_TARGET_DIR: target/asan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-02-01

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.1
        with:
          # Isolate the nightly safety build cache (distinct toolchain/RUSTFLAGS) from the
          # stable CI caches; the "-v2" epoch busted older caches that predate this split.
          # (trybuild/rust-cache ENOENT noise is handled by dropping `<target>/tests`, not here.)
          prefix-key: "ci-safety-nightly-v2"
          workspaces: ". -> target/asan"
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Run tests with AddressSanitizer
        run: |
          set -euo pipefail
          echo "Running tests with AddressSanitizer enabled..."
          echo "AddressSanitizer detects memory errors: use-after-free, buffer overflow,"
          echo "stack buffer overflow, and memory leaks."
          echo "CARGO_TARGET_DIR: ${CARGO_TARGET_DIR:-<default>}"
          RUSTFLAGS="-Z sanitizer=address" \
            cargo +nightly-2026-02-01 test --locked --target x86_64-unknown-linux-gnu \
            --all-features --no-fail-fast 2>&1 | tee asan-output.txt
          echo "AddressSanitizer analysis complete."

      - name: Diagnose AddressSanitizer failures
        if: failure()
        run: |
          set -euo pipefail
          echo "=== ASan diagnostic context ==="
          echo "workflow: ${{ github.workflow }}"
          echo "job: AddressSanitizer"
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo "runner: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"
          echo "ASAN_OPTIONS: ${ASAN_OPTIONS:-<unset>}"
          echo "CARGO_TARGET_DIR: ${CARGO_TARGET_DIR:-<default>}"
          if [ ! -f asan-output.txt ]; then
            echo "asan-output.txt is missing"
            exit 0
          fi
          echo "=== asan-output.txt failure markers ==="
          grep -nE "AddressSanitizer|SUMMARY: AddressSanitizer|FAILED|failures:|panicked at|error:" \
            asan-output.txt || true
          echo "=== asan-output.txt tail -n 200 ==="
          tail -n 200 asan-output.txt
      - name: Upload AddressSanitizer output
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: asan-output
          path: asan-output.txt
          retention-days: 14

      - name: Drop trybuild artifacts before cache save
        # The ASan job runs the full test suite, so trybuild builds nested cargo projects
        # under `${CARGO_TARGET_DIR}/tests`. Swatinem/rust-cache's restore-time cleanup probes
        # `<target>/tests/target` (a path trybuild never creates) in a non-awaited call,
        # surfacing a benign but noisy `##[error]ENOENT` on every restore. Dropping the dir
        # before the post-run cache save keeps the trigger out of the cache. Miri runs
        # `--lib` only, so it never creates this directory and needs no cleanup.
        if: always()
        shell: bash
        run: rm -rf "${CARGO_TARGET_DIR:-target}/tests"
