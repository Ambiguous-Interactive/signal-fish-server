# YAML Linting Workflow
#
# Validates all YAML files for syntax errors, formatting issues, and best practices
# using yamllint with project-specific configuration.
#
# Also validates .github/dependabot.yml for semantic consistency:
#   - No stale relative PR-limit terminology (Higher/Moderate/Lower)
#   - Every update entry has open-pull-requests-limit defined
#   - Inline comment PR limit numbers match configured values
#
# Configuration:
#   - .yamllint.yml: YAML linting rules and exclusions
#
# Runs on:
#   - Push to main branch (only for YAML file changes)
#   - Pull requests to main (only for YAML file changes)
#
# Features:
#   - Validates YAML syntax and formatting
#   - Checks GitHub Actions workflow files
#   - Semantic validation of Dependabot configuration
#   - Pinned yamllint version for reproducibility

name: YAML Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.yamllint.yml'
      - 'scripts/check-dependabot-config.sh'
      - '.github/workflows/yaml-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.yamllint.yml'
      - 'scripts/check-dependabot-config.sh'
      - '.github/workflows/yaml-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
          # Pip caching disabled: no requirements.txt in this Rust project.
          # yamllint install is fast (~3-5s). If optimization needed, see
          # manual caching example in other workflows.

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .

      - name: Validate Dependabot config consistency
        run: |
          bash scripts/check-dependabot-config.sh
