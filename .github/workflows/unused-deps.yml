# Unused Dependencies Workflow
#
# Detects unused dependencies and features to keep the project lean and maintainable.
# Runs two complementary tools in one analyzer job so checkout, toolchain, and
# dependency-cache setup are paid once:
#   - cargo-machete: Detects unused dependencies in Cargo.toml
#   - cargo-udeps: Detects unused dependencies and features (requires nightly)
#
# Runs on:
#   - Pull requests that change the root Rust package or this workflow
#     (cargo-machete only: seconds-cheap, gating)
#   - Daily schedule and manual dispatch for on-demand diagnostics
#     (both analyzers, including the nightly cargo-udeps compile)
#
# Issue #512: cargo-udeps is informational (continue-on-error) and its result
# is a pure function of the pinned source graph, nightly toolchain, and
# analyzer versions, so its multi-minute nightly compile joined the daily
# cohort instead of rerunning per pull request. cargo-machete stays on every
# pull request as the fast gating signal. Workflow Hygiene owns the weekly
# staleness check for the shared pinned nightly.
#
# Features:
#   - Shared checkout, nightly toolchain, and Rust dependency cache
#   - Checksum-verified release binaries for cargo-machete and cargo-udeps
#   - Nightly toolchain pinned for reproducibility (see nightly version below)
#   - cargo-udeps uses continue-on-error as it may have false positives
#
# Nightly Toolchain Strategy:
#   cargo-udeps requires nightly Rust because it uses unstable compiler features
#   to analyze dependency usage at a deeper level than stable tools can provide.
#
#   Nightly Version: nightly-2026-08-01
#   Last Updated: 2026-08-02
#
#   Update Criteria (when to update this nightly version):
#     - If the nightly version is >6 months old
#     - If security advisories affect this version
#     - If cargo-udeps requires newer nightly features
#     - If the nightly version becomes unavailable or broken
#
#   Why We Pin Nightly (instead of using rolling "nightly"):
#     - Reproducibility: Same nightly = consistent CI results over time
#     - Stability: Prevents sudden breakage from nightly compiler changes
#     - Predictability: We control when nightly updates happen
#
#   Trade-offs:
#     - Pinned nightly becomes stale over time (requires periodic updates)
#     - Rolling "nightly" always has latest features but may break unexpectedly
#     - For CI-only tools like cargo-udeps, pinning is preferred for stability
#
#   Policy:
#     - Production code MUST use stable MSRV (see Cargo.toml rust-version)
#     - CI-only analysis tools MAY use nightly if required by the tool
#     - Nightly is NEVER used for building production artifacts
#
#   See also: .llm/skills/msrv-management/SKILL.md (Nightly-Only CI Tools section)
#
# Note: cargo-udeps may report false positives for proc-macro dependencies
#       and conditional dependencies. Review its output manually.

name: Unused Dependencies

on:
  workflow_dispatch:
  schedule:
    # Daily cohort for the heavy non-gating udeps compile (issue #512).
    - cron: '0 7 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - '.github/workflows/unused-deps.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  unused-deps:
    name: Check Unused Dependencies
    runs-on: ubuntu-latest
    # Two analyzers share setup but run sequentially. Keep cold-cache install
    # headroom until hosted warm/cold measurements establish a tighter bound.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-01
          components: rustc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install unused-dependency analyzers
        uses: taiki-e/install-action@v2.87.5
        with:
          tool: cargo-machete@0.7.0,cargo-udeps@0.1.61
          fallback: none

      - name: Verify analyzer versions
        run: |
          set -euo pipefail
          cargo machete --version | grep -Fxq '0.7.0'
          cargo +nightly-2026-08-01 udeps --version | grep -Fxq 'cargo-udeps 0.1.61'

      - name: Check for unused dependencies
        run: cargo machete

      - name: Check for unused dependencies (udeps)
        # The nightly compile is the job's heavy leg and the result is
        # informational (see the continue-on-error note below), so it runs on
        # the daily cohort and manual dispatch only (issue #512).
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        # Note: continue-on-error is enabled because cargo-udeps may report
        # false positives for:
        #   - Proc-macro dependencies (used at compile-time)
        #   - Platform-specific dependencies (cfg-gated)
        #   - Build dependencies used only in build.rs
        # Always review udeps output manually before removing dependencies.
        run: cargo +nightly-2026-08-01 udeps --locked --all-targets --all-features
        continue-on-error: true
