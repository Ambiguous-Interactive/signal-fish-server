name: OpenAI Review

# Calls the shared review in Ambiguous-Interactive/review-tools. It posts one COMMENT review per head
# commit and cannot block a merge. Drafts, forks and bots get no review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type != 'Bot' }}
    uses: Ambiguous-Interactive/review-tools/.github/workflows/openai-review.yml@5aabfe60ec294f8160b70d0a712c561db5e3fa29 # v1.1.2
    with:
      model: ${{ vars.OPENAI_REVIEW_MODEL }}
      effort: ${{ vars.OPENAI_REVIEW_EFFORT }}
      timeout-minutes: 15
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
