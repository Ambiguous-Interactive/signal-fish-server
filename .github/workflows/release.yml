# Release Workflow - Publish Crate and Create GitHub Release
#
# Publishes the crate to crates.io and creates a GitHub Release with changelog.
#
# Runs on:
#   - Manual workflow dispatch from the default branch (version derived from Cargo.toml)
#   - Tag pushes matching v* pattern
#
# Release gating:
#   A `preflight` job verifies that required CI workflows ("CI" and
#   "Documentation Validation") have passed on the commit being released
#   before the `publish` job runs. This prevents publishing a broken crate.
#
# Concurrency:
#   cancel-in-progress is set to false because aborting a half-finished
#   publish could leave crates.io in an inconsistent state.
#
# Action reference policy:
#   We intentionally use explicit version tags (for example `@v2.5.0`) instead
#   of commit SHAs. Trade-off: tags are mutable, while SHAs are immutable.
#   Compensating controls in this repository:
#     - No moving channels/branches for `uses:` refs (`stable`, `main`, etc. disallowed)
#     - Uniform refs across workflows (drift tests in tests/ci_config_tests.rs)
#     - Dependabot updates for GitHub Actions plus required CI review
#     - Least-privilege workflow permissions
#
# Steps:
#   1. Resolve one version/source identity and validate Cargo.toml + CHANGELOG
#   2. Preflight: verify CI and doc-validation passed on that exact commit
#   3. Require crates.io credentials and dry-run the exact package
#   4. Create or validate the immutable annotated Git tag
#   5. Call Docker Publish directly and verify version tags/platforms/OCI labels
#   6. Idempotently publish the crate from a clean tagged checkout
#   7. Generate SBOM (CycloneDX JSON) for supply-chain provenance
#   8. Create/verify the GitHub Release and record the GHCR digest in its notes
#   9. build-binaries: cross-compile standalone binaries for every supported
#      OS/arch (Linux/macOS/Windows x86_64+aarch64) in parallel with publish
#  10. attach-binaries: download all binary artifacts and attach them (with
#      SHA-256 checksums) to the GitHub Release in a single upload

name: Release - Publish Crate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-release:
    name: Resolve release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_revision: ${{ steps.release.outputs.source_revision }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate canonical release identity
        id: release
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EVENT_REF: ${{ github.ref }}
        run: bash scripts/resolve-release-source.sh

  preflight:
    name: Preflight
    needs: [resolve-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required CI checks passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          COMMIT_SHA="${{ needs.resolve-release.outputs.source_revision }}"
          REPO="${{ github.repository }}"
          echo "Verifying CI status for commit: $COMMIT_SHA"

          # Required workflow runs that must have completed successfully.
          # These correspond to the REQUIRED_WORKFLOW_NAMES in tests/ci_config_tests.rs.
          REQUIRED_WORKFLOWS=("CI" "Documentation Validation")

          # Path-filtered workflows and their trigger paths.
          # These workflows only run when specific files change. If a commit
          # does not touch any of the listed paths, the workflow is legitimately
          # skipped and should not block the release.
          #
          # NOTE: The path patterns below are simplified equivalents for shell
          # pattern matching, not literal copies of GitHub Actions glob syntax.
          # For example, GitHub's "**/*.md" becomes "*.md" here because the
          # shell case/[[ matching handles it differently.
          #
          # The path patterns here must match the `paths:` filters in the
          # corresponding workflow file. Keep in sync with the `paths:` block
          # in doc-validation.yml and with REQUIRED_DOC_PATHS in
          # tests/ci_config_tests.rs.
          declare -A PATH_FILTERED_WORKFLOWS
          PATH_FILTERED_WORKFLOWS["Documentation Validation"]="*.md *.rs Cargo.toml Cargo.lock scripts/check-internal-links.sh .github/workflows/doc-validation.yml .github/scripts/ .github/test-fixtures/"

          FAILED=0
          for WORKFLOW_NAME in "${REQUIRED_WORKFLOWS[@]}"; do
            echo ""
            echo "Checking workflow: $WORKFLOW_NAME"

            WORKFLOW_ID=$(gh api \
              "repos/${REPO}/actions/workflows" \
              --jq ".workflows[] | select(.name == \"${WORKFLOW_NAME}\") | .id" \
            )

            if [ -z "$WORKFLOW_ID" ]; then
              echo "ERROR: Workflow '${WORKFLOW_NAME}' not found in repository"
              FAILED=1
              continue
            fi

            # Ensure exactly one workflow matched the name
            WORKFLOW_ID_COUNT=$(echo "$WORKFLOW_ID" | grep -c .)
            if [ "$WORKFLOW_ID_COUNT" -gt 1 ]; then
              echo "ERROR: Multiple workflows found with name '${WORKFLOW_NAME}'"
              echo "  IDs: $WORKFLOW_ID"
              FAILED=1
              continue
            fi

            # Get the most recent completed run for this workflow on the commit's branch
            CONCLUSION=$(gh api \
              "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs?head_sha=${COMMIT_SHA}&status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // empty' \
            )

            if [ -z "$CONCLUSION" ]; then
              # No completed run found. For path-filtered workflows this may be
              # legitimate — the commit may not have touched any of the paths
              # that trigger the workflow.
              if [[ -v "PATH_FILTERED_WORKFLOWS[$WORKFLOW_NAME]" ]]; then
                echo "  No completed run found. Checking if commit touched relevant paths..."

                # Get list of files changed in this commit
                CHANGED_FILES=$(gh api "repos/${REPO}/commits/${COMMIT_SHA}" \
                  --jq '.files[].filename' 2>/dev/null || echo "")

                if [ -z "$CHANGED_FILES" ]; then
                  echo "  ERROR: Could not retrieve changed files for commit ${COMMIT_SHA}"
                  echo "  Release preflight requires file change data to verify path-filtered workflows."
                  echo "  This may be caused by GitHub API rate limiting or a transient outage."
                  echo "  Failing closed to prevent releasing without CI verification."
                  FAILED=1
                  continue
                fi

                # Check if any changed file matches the workflow's path filters
                PATHS_MATCH=0
                for pattern in ${PATH_FILTERED_WORKFLOWS[$WORKFLOW_NAME]}; do
                  while IFS= read -r changed_file; do
                    [ -z "$changed_file" ] && continue
                    case "$pattern" in
                      # Glob patterns with leading ** (e.g., "*.md" matches any .md file)
                      *\*.md)
                        if [[ "$changed_file" == *.md ]]; then
                          PATHS_MATCH=1
                          echo "  Matched: $changed_file (pattern: $pattern)"
                        fi
                        ;;
                      *\*.rs)
                        if [[ "$changed_file" == *.rs ]]; then
                          PATHS_MATCH=1
                          echo "  Matched: $changed_file (pattern: $pattern)"
                        fi
                        ;;
                      # Exact file match for known filenames — listed explicitly
                      # for clarity, even though the *) catch-all also does exact
                      # matching. Separating them documents that these patterns
                      # use a different matching strategy (literal equality) than
                      # the extension/directory cases above.
                      Cargo.toml|Cargo.lock)
                        if [ "$changed_file" = "$pattern" ]; then
                          PATHS_MATCH=1
                          echo "  Matched: $changed_file (pattern: $pattern)"
                        fi
                        ;;
                      # Directory prefix match (e.g., ".github/scripts/")
                      */)
                        if [[ "$changed_file" == ${pattern}* ]]; then
                          PATHS_MATCH=1
                          echo "  Matched: $changed_file (pattern: $pattern)"
                        fi
                        ;;
                      # Exact file match for anything else
                      *)
                        if [ "$changed_file" = "$pattern" ]; then
                          PATHS_MATCH=1
                          echo "  Matched: $changed_file (pattern: $pattern)"
                        fi
                        ;;
                    esac
                    # Break early once we find a match
                    [ "$PATHS_MATCH" -eq 1 ] && break
                  done <<< "$CHANGED_FILES"
                  [ "$PATHS_MATCH" -eq 1 ] && break
                done

                if [ "$PATHS_MATCH" -eq 0 ]; then
                  echo "OK: '${WORKFLOW_NAME}' was not triggered (commit did not touch relevant paths)"
                else
                  echo "ERROR: No completed run found for '${WORKFLOW_NAME}' on commit ${COMMIT_SHA}"
                  echo "  The commit touched files that should have triggered this workflow."
                  echo "  Ensure CI has run and completed on this commit before releasing."
                  FAILED=1
                fi
              else
                echo "ERROR: No completed run found for '${WORKFLOW_NAME}' on commit ${COMMIT_SHA}"
                echo "  Ensure CI has run and completed on this commit before releasing."
                FAILED=1
              fi
            elif [ "$CONCLUSION" != "success" ]; then
              echo "ERROR: '${WORKFLOW_NAME}' conclusion is '${CONCLUSION}' (expected 'success')"
              echo "  Fix the failing checks before releasing."
              FAILED=1
            else
              echo "OK: '${WORKFLOW_NAME}' passed on commit ${COMMIT_SHA}"
            fi
          done

          echo ""
          if [ $FAILED -ne 0 ]; then
            echo "=========================================="
            echo "RELEASE BLOCKED: Required CI checks have not passed."
            echo ""
            echo "To fix:"
            echo "  1. Push the release commit to main and wait for CI to complete"
            echo "  2. Verify all required checks are green"
            echo "  3. Then trigger the release workflow again"
            echo "=========================================="
            exit 1
          fi

          echo "All required CI checks passed. Proceeding with release."

  publication-readiness:
    name: Publication readiness
    needs: [resolve-release, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      crate_exists: ${{ steps.crate.outputs.exists }}
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: publication-tools
          sparse-checkout: |
            scripts/check-clean-release-worktree.sh
            scripts/check-crates-io-release.sh
            scripts/read-toml-string.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout exact release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_revision }}
          path: source

      - name: Check for an idempotent crates.io retry
        id: crate
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
          RELEASE_SOURCE_REVISION: ${{ needs.resolve-release.outputs.source_revision }}
        run: bash publication-tools/scripts/check-crates-io-release.sh

      - name: Require crates.io token
        if: steps.crate.outputs.exists != 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "ERROR: CRATES_IO_TOKEN is required before release artifacts are published." >&2
            exit 1
          fi

      - name: Read Rust toolchain
        id: readiness-toolchain
        shell: bash
        run: |
          channel=$(bash publication-tools/scripts/read-toml-string.sh source/rust-toolchain.toml channel toolchain || true)
          if [ -z "$channel" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml." >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.readiness-toolchain.outputs.channel }}

      - name: Validate publish package
        run: cargo publish --locked --dry-run
        working-directory: source

      - name: Verify dry-run preserved a clean checkout
        shell: bash
        working-directory: source
        run: bash ../publication-tools/scripts/check-clean-release-worktree.sh

  ensure-tag:
    name: Ensure immutable annotated tag
    needs: [resolve-release, publication-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_revision }}

      - name: Create or validate annotated tag
        shell: bash
        env:
          TAG: ${{ needs.resolve-release.outputs.tag }}
          SOURCE_REVISION: ${{ needs.resolve-release.outputs.source_revision }}
        run: |
          set -euo pipefail

          validate_tag() {
            if [ "$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)" != "tag" ]; then
              echo "ERROR: ${TAG} exists but is not an annotated Git tag." >&2
              exit 1
            fi
            actual_revision=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [ "$actual_revision" != "$SOURCE_REVISION" ]; then
              echo "ERROR: ${TAG} resolves to ${actual_revision}, not ${SOURCE_REVISION}; refusing to move it." >&2
              exit 1
            fi
          }

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            validate_tag
            echo "Reusing immutable annotated tag ${TAG} at ${SOURCE_REVISION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SOURCE_REVISION" -m "Release $TAG"
          if git push origin "refs/tags/${TAG}"; then
            echo "Created annotated tag ${TAG} at ${SOURCE_REVISION}."
            exit 0
          fi

          # A concurrent retry may have won the create race. Accept only the
          # exact immutable tag we intended; every other outcome fails closed.
          git tag -d "$TAG"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          validate_tag

  publish-container:
    name: Publish versioned container
    needs: [resolve-release, ensure-tag]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_version: ${{ needs.resolve-release.outputs.version }}
      release_tag: ${{ needs.resolve-release.outputs.tag }}
      source_ref: ${{ needs.resolve-release.outputs.source_revision }}
      source_revision: ${{ needs.resolve-release.outputs.source_revision }}

  publish:
    needs: [resolve-release, publication-readiness, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_notes_sha256: ${{ steps.changelog.outputs.notes_sha256 }}

    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: publication-tools
          sparse-checkout: |
            scripts/check-clean-release-worktree.sh
            scripts/check-github-release.sh
            scripts/read-toml-string.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_revision }}
          path: source
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash publication-tools/scripts/read-toml-string.sh source/rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true

      - name: Verify sccache is working
        id: sccache-check
        if: steps.sccache.outcome == 'success'
        run: |
          if sccache --show-stats > /dev/null 2>&1; then
            echo "working=true" >> "$GITHUB_OUTPUT"
            echo "sccache is operational"
          else
            echo "working=false" >> "$GITHUB_OUTPUT"
            echo "sccache binary not responding"
          fi
        continue-on-error: true

      - name: Clear sccache env on failure
        if: steps.sccache.outcome != 'success' || steps.sccache-check.outcome != 'success'
        run: |
          echo "::warning::sccache unavailable (setup=${{ steps.sccache.outcome }}, check=${{ steps.sccache-check.outcome }}), falling back to standard rustc"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
          key: publish-${{ runner.os }}-cargo-${{ hashFiles('source/**/Cargo.lock') }}
          restore-keys: |
            publish-${{ runner.os }}-cargo-

      - name: Verify clean checkout before publication
        shell: bash
        working-directory: source
        run: bash ../publication-tools/scripts/check-clean-release-worktree.sh

      - name: Publish to crates.io
        if: needs.publication-readiness.outputs.crate_exists != 'true'
        working-directory: source
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

      - name: Install cargo-sbom
        uses: taiki-e/install-action@v2.85.10
        with:
          tool: cargo-sbom

      - name: Generate SBOM (CycloneDX)
        id: sbom
        run: cargo sbom --output-format cyclone_dx_json_1_5 > sbom.cdx.json
        working-directory: source
        continue-on-error: true

      - name: Extract changelog for release
        id: changelog
        working-directory: source
        run: |
          VERSION="${{ needs.resolve-release.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" until the next "## [" or end of file
          CHANGELOG_CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { found=0; printing=0 }
            /^## \[/ {
              if (printing) { exit }
              if ($0 ~ "\\[" ver "\\]") { found=1; printing=1; next }
            }
            printing { print }
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="Release $VERSION"
          fi

          {
            echo "$CHANGELOG_CONTENT"
            echo ""
            echo "### Container image"
            echo ""
            echo "\`ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\`"
            echo ""
            echo "Multi-architecture manifest digest: \`${{ needs.publish-container.outputs.digest }}\`"
            echo ""
            echo "Source revision: \`${{ needs.resolve-release.outputs.source_revision }}\`"
          } > release_notes.md
          notes_sha256=$(sha256sum release_notes.md | awk '{print $1}')
          echo "notes_sha256=$notes_sha256" >> "$GITHUB_OUTPUT"

      - name: Validate an existing GitHub Release
        id: existing-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_NAME: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SOURCE_REVISION: ${{ needs.resolve-release.outputs.source_revision }}
          RELEASE_IMAGE_DIGEST: ${{ needs.publish-container.outputs.digest }}
          RELEASE_NOTES_FILE: source/release_notes.md
        run: bash publication-tools/scripts/check-github-release.sh

      - name: Create GitHub Release
        if: steps.existing-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3.0.2
        with:
          # ensure-tag already created or verified this immutable annotated tag.
          # Do not pass target_commitish here: GitHub only needs it when the tag
          # does not exist, and a historical retry whose source changed workflow
          # files relative to today's default branch would otherwise require a
          # workflows:write token that GITHUB_TOKEN cannot receive.
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          name: ${{ needs.resolve-release.outputs.tag }}
          body_path: source/release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release metadata before asset uploads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_NAME: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SOURCE_REVISION: ${{ needs.resolve-release.outputs.source_revision }}
          RELEASE_IMAGE_DIGEST: ${{ needs.publish-container.outputs.digest }}
          RELEASE_NOTES_FILE: source/release_notes.md
          RELEASE_OUTPUT_FILE: /dev/null
          RELEASE_REQUIRE_EXISTING: true
        run: bash publication-tools/scripts/check-github-release.sh

      - name: Attach SBOM to release
        if: steps.sbom.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: >-
          gh release upload "$TAG" source/sbom.cdx.json --clobber
          --repo "$GITHUB_REPOSITORY"

  # ---------------------------------------------------------------------------
  # Cross-platform standalone binaries
  #
  # Builds a standalone `signal-fish-server` executable for every supported
  # OS/architecture so Windows / macOS / ARM users can run the server without a
  # Rust toolchain or Docker.
  #
  # Build and upload are deliberately SPLIT into two jobs:
  #   - `build-binaries` (this job): a `fail-fast: false` matrix that compiles
  #     each target and uploads its archive + checksum as a workflow artifact.
  #     It starts after the immutable tag exists, in PARALLEL with container and
  #     crate publication.
  #   - `attach-binaries` (below): a single job that downloads every artifact
  #     and performs ONE asset-only `gh release upload`. Funnelling all assets
  #     through one upload avoids the race where N parallel matrix jobs upload
  #     to the same Release concurrently (intermittent 422s / clobbering).
  #
  # Binaries are built with DEFAULT features (no `tls`) to match the published
  # container image and to keep cross-compilation free of C-crypto toolchain
  # requirements (aws-lc-sys / ring are only pulled in by the optional `tls`
  # feature). Keep the matrix target list in lockstep with
  # REQUIRED_RELEASE_TARGETS in tests/ci_config_tests.rs.
  #
  # `fail-fast: false` so one platform's toolchain hiccup does not strip
  # binaries for every other platform off the release.
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Binary (${{ matrix.target }})
    needs: [resolve-release, ensure-tag]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            # libc6-dev-arm64-cross supplies the C runtime startup objects
            # (Scrt1.o/crti.o); it is only a recommends of the cross GCC, so it
            # must be named explicitly under --no-install-recommends.
            linker_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            linker: aarch64-linux-gnu-gcc
          # Both macOS targets build on Apple Silicon (macos-14): the native
          # Apple toolchain cross-compiles x86_64 from arm64 without extra
          # setup, and avoids the deprecating Intel macOS runner images.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      # Keep workflow policy/tools separate from the immutable release source.
      # A retry may intentionally build an older tag that predates these
      # helpers, while the workflow itself must retain the reviewed tooling
      # from the dispatch revision.
      - name: Checkout publication tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: publication-tools
          sparse-checkout: |
            scripts/read-toml-string.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout exact source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.source_revision }}
          path: source
          persist-credentials: false

      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          CHANNEL=$(bash ../publication-tools/scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install cross linker (Linux cross targets)
        if: matrix.linker_pkg != ''
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          # matrix.linker_pkg may name multiple packages (cross GCC + cross
          # libc dev); GitHub interpolates it to a literal list before the shell
          # runs, so word-splitting here is intentional and safe.
          sudo apt-get install -y --no-install-recommends ${{ matrix.linker_pkg }}
          # cargo reads CARGO_TARGET_<TRIPLE>_LINKER (triple upcased, '-' -> '_').
          ENV_KEY="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          echo "${ENV_KEY}=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build release binary
        shell: bash
        working-directory: source
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary and checksum
        id: package
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          VERSION="${{ needs.resolve-release.outputs.version }}"

          BIN=signal-fish-server
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi

          NAME="signal-fish-server-v${VERSION}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/${BIN}${EXE}" "$NAME/"
          # LICENSE is required in every redistributable archive — fail loudly if
          # it is missing rather than silently shipping an unlicensed binary.
          cp LICENSE "$NAME/"
          cp README.md "$NAME/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="${NAME}.zip"
            7z a "$ARCHIVE" "$NAME" > /dev/null
          else
            ARCHIVE="${NAME}.tar.gz"
            tar czf "$ARCHIVE" "$NAME"
          fi

          # SHA-256 checksum (sha256sum on Linux / Git-Bash, shasum on macOS).
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi

          echo "archive=source/$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-binary-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Attach all built binaries to the GitHub Release in a single upload.
  # Depends on `publish` (so the Release/tag exists) and on every matrix build.
  #
  # The `if:` runs this job as long as the release was actually published and the
  # run was not cancelled, EVEN IF some `build-binaries` legs failed. Combined
  # with `fail-fast: false`, that delivers the stated intent: one platform's
  # toolchain hiccup attaches the binaries that DID build rather than stripping
  # every platform's binary off the release. The artifact discovery step below
  # also handles the zero-success case explicitly so `download-artifact` is never
  # asked to resolve an unmatched `release-binary-*` pattern.
  # ---------------------------------------------------------------------------
  attach-binaries:
    name: Attach binaries to release
    needs: [resolve-release, publish-container, publish, build-binaries]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find binary artifacts
        id: binary-artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_names=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.expired | not) and (.name | startswith("release-binary-"))) | .name')
          artifact_count=$(printf '%s\n' "$artifact_names" | awk 'NF { count++ } END { print count + 0 }')
          echo "count=$artifact_count" >> "$GITHUB_OUTPUT"

          if [ "$artifact_count" -eq 0 ]; then
            echo "No release-binary-* artifacts were uploaded by build-binaries; skipping binary attachment."
          else
            echo "Found $artifact_count release-binary-* artifact(s):"
            printf '%s\n' "$artifact_names" | awk 'NF { print "  - " $0 }'
          fi

      - name: Checkout repository
        if: steps.binary-artifacts.outputs.count != '0'
        uses: actions/checkout@v7.0.1

      - name: Validate GitHub Release before binary asset uploads
        if: steps.binary-artifacts.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_NAME: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_SOURCE_REVISION: ${{ needs.resolve-release.outputs.source_revision }}
          RELEASE_IMAGE_DIGEST: ${{ needs.publish-container.outputs.digest }}
          RELEASE_NOTES_SHA256: ${{ needs.publish.outputs.release_notes_sha256 }}
          RELEASE_OUTPUT_FILE: /dev/null
          RELEASE_REQUIRE_EXISTING: true
        run: bash scripts/check-github-release.sh

      - name: Download all binary artifacts
        if: steps.binary-artifacts.outputs.count != '0'
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: release-binary-*
          merge-multiple: true

      - name: Attach binaries to release
        if: steps.binary-artifacts.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find dist -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \
          \) -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "ERROR: Binary artifacts were reported but no archives or checksums were downloaded." >&2
            exit 1
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber \
            --repo "$GITHUB_REPOSITORY"
