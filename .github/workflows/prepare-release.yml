# Prepares a reviewed release commit; publication remains release.yml's job.
#
# The workflow uses an installation token from the organization's auto-commit
# GitHub App. Unlike GITHUB_TOKEN, that token lets the generated pull request
# trigger the repository's normal pull_request CI workflows.

name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic-version component to increment"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Validate and print the release diff without opening a pull request"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prepare-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    if: github.repository == 'Ambiguous-Interactive/signal-fish-server'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require default branch dispatch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "ERROR: Prepare Release must run from ${DEFAULT_BRANCH}; got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout default branch
        id: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check auto-commit GitHub App credentials
        id: app-credentials
        env:
          AUTO_COMMIT_APP_CLIENT_ID: ${{ vars.AUTO_COMMIT_APP_CLIENT_ID }}
          AUTO_COMMIT_APP_ID: ${{ secrets.AUTO_COMMIT_APP_ID }}
          AUTO_COMMIT_APP_PRIVATE_KEY: ${{ secrets.AUTO_COMMIT_APP_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${AUTO_COMMIT_APP_PRIVATE_KEY:-}" ]; then
            echo "ERROR: AUTO_COMMIT_APP_PRIVATE_KEY is required for a live release preparation." >&2
            echo "The App must have repository Contents and Pull requests read/write permissions." >&2
            exit 1
          fi

          if [ -n "${AUTO_COMMIT_APP_CLIENT_ID:-}" ]; then
            echo "mode=client-id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${AUTO_COMMIT_APP_ID:-}" ]; then
            echo "mode=app-id" >> "$GITHUB_OUTPUT"
            echo "Using the compatible AUTO_COMMIT_APP_ID credential; configure AUTO_COMMIT_APP_CLIENT_ID to migrate." >&2
            exit 0
          fi

          echo "ERROR: AUTO_COMMIT_APP_CLIENT_ID or AUTO_COMMIT_APP_ID is required for a live release preparation." >&2
          echo "The App must have repository Contents and Pull requests read/write permissions." >&2
          exit 1

      - name: Generate auto-commit GitHub App token from client ID
        id: app-token-client
        if: steps.app-credentials.outputs.mode == 'client-id'
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AUTO_COMMIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Generate auto-commit GitHub App token from App ID
        id: app-token-id
        if: steps.app-credentials.outputs.mode == 'app-id'
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$channel" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml." >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Prepare release files
        env:
          BUMP: ${{ inputs.bump }}
        run: bash scripts/prepare-release.sh --bump "$BUMP"

      - name: Validate prepared diff scope
        run: bash scripts/validate-release-file-scope.sh

      - name: Validate prepared release state
        run: cargo test --locked --test release_prepare_tests --test workspace_lockfile_consistency

      - name: Resolve prepared release identity
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token-client.outputs.token || steps.app-token-id.outputs.token || github.token }}
        run: bash scripts/resolve-prepared-release.sh

      - name: Create recovery patch
        id: recovery
        if: ${{ !cancelled() && !inputs.dry_run && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.release.outputs.version || 'unknown' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-prepare
          git diff --binary > "artifacts/release-prepare/release-${VERSION}.patch"
          git diff --stat > "artifacts/release-prepare/release-${VERSION}.stat.txt"

      - name: Print dry-run diff
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          echo "Dry run: would push ${BRANCH} and open a release PR for ${VERSION}."
          git --no-pager diff --

      - name: Push release branch and open pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token-client.outputs.token || steps.app-token-id.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ steps.release.outputs.branch }}
          BRANCH_EXISTS: ${{ steps.release.outputs.branch_exists }}
          VERIFIED_BRANCH_SHA: ${{ steps.release.outputs.branch_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$BRANCH_EXISTS" = "true" ]; then
            echo "Reusing exact existing release branch ${BRANCH}."
            expected_head_sha=$VERIFIED_BRANCH_SHA
          else
            git checkout -b "$BRANCH"
            release_inventory=$(mktemp)
            trap 'rm -f "$release_inventory"' EXIT
            bash scripts/list-release-files.sh > "$release_inventory"
            release_files=()
            while IFS= read -r -d '' release_file; do
              release_files+=("$release_file")
            done < "$release_inventory"
            rm -f "$release_inventory"
            trap - EXIT
            git add -- "${release_files[@]}"
            git commit -m "release: ${VERSION}"
            expected_head_sha=$(git rev-parse HEAD)
            bash scripts/push-release-branch.sh "$BRANCH" "$expected_head_sha"
          fi

          body_file=$(mktemp)
          {
            echo "Automated release preparation for Signal Fish Server ${VERSION}."
            echo
            echo "## Checklist"
            echo
            echo "- [ ] \`Cargo.toml\` and path-package lockfiles identify \`${VERSION}\`."
            echo "- [ ] \`CHANGELOG.md\` release notes and date are reviewed."
            echo "- [ ] All required checks pass on this exact release commit."
            echo
            echo "## After merge"
            echo
            echo "Run **Release - Publish Crate** from \`${DEFAULT_BRANCH}\`."
            echo "The workflow derives version \`${VERSION}\` from the reviewed Cargo.toml; do not re-enter it."
            echo "That workflow creates or verifies annotated tag \`${TAG}\`, then publishes crates.io and GHCR."
            echo "It creates the GitHub Release and attaches the SBOM and platform archives."
          } > "$body_file"

          bash scripts/ensure-release-pr.sh \
            "$DEFAULT_BRANCH" "$BRANCH" "$VERSION" "$TAG" "$body_file" "$expected_head_sha"

      - name: Upload release preparation recovery patch
        if: ${{ failure() && !cancelled() && !inputs.dry_run && steps.recovery.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-prepare-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-prepare/
          if-no-files-found: error
