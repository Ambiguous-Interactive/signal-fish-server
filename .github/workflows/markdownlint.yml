# Check tracked Markdown on pull requests.

name: Markdownlint

on:
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".rumdl.toml"
      - ".rumdl-version"
      - "scripts/check-markdown.sh"
      - "scripts/check-markdown-link-text.sh"
      - ".github/workflows/markdownlint.yml"

# Restrict permissions to minimum required for the job
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2.90.10
        with:
          tool: cargo-binstall
      - name: Install pinned rumdl
        run: cargo binstall --locked --no-confirm --disable-strategies quick-install,compile "rumdl@$(cat .rumdl-version)"
      - name: Run markdown checks
        run: bash scripts/check-markdown.sh
