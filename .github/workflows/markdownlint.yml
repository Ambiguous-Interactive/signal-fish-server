# Markdown Linting Workflow
#
# Validates all Markdown files for consistency, formatting, and best practices
# using markdownlint with project-specific rules.
#
# Configuration:
#   - .markdownlint.json: Rule configuration
#   - .markdownlintignore: Files/directories to exclude
#   - package.json and package-lock.json: pinned markdownlint version
#
# Runs on:
#   - Pull requests to main (only for changed Markdown files)

name: Markdownlint

on:
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-markdown.sh"
      - "scripts/check-markdown-files.mjs"
      - "scripts/check-markdown-files.test.mjs"
      - "scripts/check-markdown-link-text.sh"
      - ".github/workflows/markdownlint.yml"

# Restrict permissions to minimum required for the job
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install pinned markdownlint
        run: npm ci --no-audit --no-fund
      - name: Test the Markdown runner
        run: node --test scripts/check-markdown-files.test.mjs
      - name: Run markdown checks
        run: bash scripts/check-markdown.sh
