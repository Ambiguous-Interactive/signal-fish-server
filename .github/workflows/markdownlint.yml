# Markdown Linting Workflow
#
# Validates all Markdown files for consistency, formatting, and best practices
# using markdownlint-cli2 with project-specific rules.
#
# Configuration:
#   - .markdownlint.json: Rule configuration
#   - .markdownlintignore: Files/directories to exclude
#   - .markdownlint-version: pinned markdownlint-cli2 version
#
# Runs on:
#   - Push to main branch (only for changed Markdown files)
#   - Pull requests to main (only for changed Markdown files)

name: Markdownlint

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - ".markdownlint-version"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-markdown.sh"
      - "scripts/check-markdown-link-text.sh"
      - ".github/workflows/markdownlint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - ".markdownlint-version"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-markdown.sh"
      - "scripts/check-markdown-link-text.sh"
      - ".github/workflows/markdownlint.yml"

# Restrict permissions to minimum required for the job
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
      - name: Install pinned markdownlint-cli2
        run: npm ci --no-audit --no-fund
      - name: Run markdown checks
        run: bash scripts/check-markdown.sh
