name: Encoding Study

on:
  pull_request:
    branches: [main]
    paths:
      - "benches/encoding/**"
      - "!benches/encoding/*.md"
      - "!benches/encoding/**/*.md"
      - "test-fixtures/encoding/**"
      - "rust-toolchain.toml"
      - "scripts/read-toml-string.sh"
      - ".github/workflows/encoding-study.yml"
  push:
    branches: [main]
    paths:
      - "benches/encoding/**"
      - "!benches/encoding/*.md"
      - "!benches/encoding/**/*.md"
      - "test-fixtures/encoding/**"
      - "rust-toolchain.toml"
      - "scripts/read-toml-string.sh"
      - ".github/workflows/encoding-study.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' &&
    github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  encoding:
    name: Encoding Corpus Controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain)
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: benches/encoding
          save-if: >-
            ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Check format
        run: cargo fmt --manifest-path benches/encoding/Cargo.toml -- --check
      - name: Lint benchmark targets
        run: >-
          cargo clippy --locked --manifest-path benches/encoding/Cargo.toml
          --all-targets -- -D warnings
      - name: Check corpus roundtrips and negative controls
        run: cargo test --locked --manifest-path benches/encoding/Cargo.toml --test roundtrip
      - name: Check runtime benchmark paths
        run: cargo bench --locked --manifest-path benches/encoding/Cargo.toml --bench runtime -- --test
      - name: Check allocation measurements
        run: cargo bench --locked --manifest-path benches/encoding/Cargo.toml --bench allocations

  clients:
    name: Cross-language Encoding Controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: benches/encoding/typescript/package-lock.json
      - name: Install .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.402"
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain)
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: benches/encoding
          save-if: >-
            ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install pinned Godot
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Install locked TypeScript packages
        working-directory: benches/encoding/typescript
        run: npm ci --ignore-scripts
      - name: Check language roundtrips and Rust wire agreement
        run: >-
          python3 benches/encoding/cross_language.py --check
          --godot Godot_v4.7.2-stable_linux.x86_64
      - name: Reconcile recorded measurements and source manifest
        run: >-
          python3 benches/encoding/cross_language.py --verify-recorded
          benches/encoding/results/2026-10-28-cross-language-aarch64
