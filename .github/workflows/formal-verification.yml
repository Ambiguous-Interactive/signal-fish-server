# Formal Verification Workflow
#
# Complementary formal checks of the Protocol v3 session lifecycle and the
# per-connection delivery contract:
#
#   * TLC model-checks the TLA+ specifications: the session lifecycle
#     (formal/tla/SignalFishSession.tla, across desired=mesh, desired=host,
#     desired=host with WebRTC disabled, the relay-floor model, and an ordinary
#     sticky-host disconnect/reconnect with a fresh downgraded profile) and the
#     #131 delivery contract (formal/tla/DeliveryContract.tla — bounded queue,
#     unfair consumer, slow-consumer eviction; message conservation and
#     no-silent-loss), plus classified queue capacity-deadline arbitration
#     (continuous availability, refill invalidation, and atomic admission) and
#     the reserved control-permit lifecycle (exact release, producer liveness,
#     parked-receiver notification, and commit-time scope validation), plus the
#     room-event mutation-gate handoff (caller-cancellation immunity, isolated
#     panic recovery, and weak-registry generation safety), and the atomic
#     reconnection-claim lifecycle (identity validation, stale-handle rejection,
#     expiry cleanup exclusion, and failed-restore release), plus application-
#     owner rollback composition (multi-entry provenance uniqueness, post-lane
#     re-reads, reconnect requeue atomicity, and deleted-room terminality), plus the
#     production-shaped protocol-v3 sequenced-relay observation replay
#     (ordinary delivery, exact classified gaps, sender lifecycle, and receiver
#     reconnect re-baselining, with four seeded negative oracles) —
#     exploring reachable states.
#   * Z3 discharges universally quantified SMT proofs of the pure decision
#     functions (formal/z3/protocol_invariants.py): the ladder selector, the
#     all_support relay-floor invariant, the glare/offerer rule, and host
#     election — over unbounded inputs an explicit-state checker only samples.
#   * Lean checks source-extracted negotiation contracts. Kani checks the same
#     Rust core plus bounded capability aggregation and source fault controls.
#
# TLC and Z3 mirror the modeled source files action-for-action (the full
# correspondence table in formal/README.md spans session_policy.rs,
# signaling.rs, room_service.rs, database/mod.rs, protocol/room_state.rs,
# reconnection.rs, reconnection_service.rs, connection_manager.rs, the top-level server capacity waits,
# coordination, and WebSocket delivery), so this workflow triggers on those files
# as well: a behavioral change there must keep the spec and the proofs green or
# update them deliberately.
#
# The TLA+ tools jar is version-pinned and SHA256-verified by
# scripts/run-tla-model-check.sh; the verified jar is cached between runs.
# See formal/README.md for the spec <-> code correspondence table.

name: Formal Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "formal/**"
      - "scripts/run-tla-model-check.sh"
      - "scripts/generate-sequenced-relay-trace.py"
      - "scripts/run-sequenced-relay-trace-validation.sh"
      - "scripts/run-z3-proofs.sh"
      - "src/config/**"
      - "src/lib.rs"
      - "src/protocol_core.rs"
      - "src/rate_limit.rs"
      - "src/auth/**"
      - "src/server/session_policy.rs"
      - "src/server/signaling.rs"
      - "src/server/room_service.rs"
      - "src/reconnection.rs"
      - "src/server/reconnection_service.rs"
      - "src/server/maintenance.rs"
      - "src/server/connection_manager.rs"
      - "src/server/game_data.rs"
      - "src/database/mod.rs"
      - "src/protocol/**"
      - "src/server.rs"
      - "src/coordination/**"
      - "src/websocket/**"
      - "tests/delivery_trace_generator_tests.rs"
      - "tests/scenario_realworld_e2e.rs"
      - "tests/v3_game_data_sequencing_e2e.rs"
      - "tests/websocket_test_helpers/**"
      - ".github/workflows/formal-verification.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    name: Source-linked Lean Proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read production Rust toolchain
        id: toolchain
        run: echo "channel=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Install pinned hax
        uses: taiki-e/install-action@v2.90.1
        with:
          tool: cargo-hax@0.4.2

      - name: Install pinned elan
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache extraction tools and Lean dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/hax/tools
            ~/.elan/toolchains
            ~/.cache/mathlib
            ~/.rustup/toolchains/nightly-2026-08-18-*
            formal/source-linked/lean/proofs/negotiation/lean/.lake/packages
          key: ${{ runner.os }}-${{ runner.arch }}-lean-${{ hashFiles('formal/source-linked/lean/hax.toml', 'formal/source-linked/lean/proofs/**/lean-toolchain', 'formal/source-linked/lean/proofs/**/lake-manifest.json') }}

      - name: Check axiom report handling
        run: python3 -m unittest discover -s formal/source-linked/lean -p 'test_*.py'

      - name: Extract production source and check proofs and negative controls
        run: python3 formal/source-linked/lean/verify.py --prepare --mutations

      - name: Check generated proof files are current
        shell: bash
        run: |
          git diff --exit-code -- formal/source-linked/lean/proofs
          git ls-files --others --exclude-standard -- formal/source-linked/lean/proofs > "$RUNNER_TEMP/untracked-lean"
          if [ -s "$RUNNER_TEMP/untracked-lean" ]; then
            cat "$RUNNER_TEMP/untracked-lean"
            exit 1
          fi

      - name: Upload Lean evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source-linked-lean
          path: formal/source-linked/lean/target/verification-logs/
          if-no-files-found: warn

  kani:
    name: Source-linked Rust Proofs (Kani)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Read production Rust toolchain
        id: toolchain
        run: echo "channel=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Kani backend
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.kani
            ~/.rustup/toolchains/nightly-2026-08-21-*
          key: ${{ runner.os }}-${{ runner.arch }}-kani-${{ hashFiles('formal/source-linked/kani/verify.py') }}

      - name: Install pinned Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: Check verifier result handling
        run: python3 -m unittest discover -s formal/source-linked/kani -p 'test_*.py'

      - name: Verify production source and negative controls
        run: python3 formal/source-linked/kani/verify.py --mutations

      - name: Upload Kani evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: source-linked-kani
          path: target/source-linked/kani/
          if-no-files-found: warn

  # Both the TLC model check and the Z3 SMT proofs run in this one job
  # (issue #558): the Z3 leg only needs a Python interpreter and a pip wheel,
  # so a second runner setup duplicated the checkout purely to run a script
  # that installs its own dependency if missing. Sequential steps keep both
  # formal lanes' failures separately named.
  tlc:
    name: TLA+ Model Check (TLC)
    runs-on: ubuntu-latest
    # 20 minutes: the sum of the former standalone ceilings (10 TLC + 5 Z3)
    # plus headroom, since the legs now run sequentially in one job and a
    # timeout-minutes ceiling is free until a job actually hangs.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Java runtime
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache TLA+ tools jar
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/signal-fish/tla
          # The script pins the tla2tools version + SHA256, so keying the
          # cache on the script content invalidates the cache exactly when
          # the pin changes (the checksum is re-verified on every run).
          key: tla2tools-${{ hashFiles('scripts/run-tla-model-check.sh') }}

      - name: Run TLC model check (all configurations)
        run: bash scripts/run-tla-model-check.sh

      - name: Replay sequenced-relay refinement and seeded divergences
        run: >-
          bash scripts/run-sequenced-relay-trace-validation.sh
          formal/traces/sequenced-relay-replay.jsonl

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install z3
        run: pip install z3-solver

      - name: Run Z3 protocol-invariant proofs
        run: bash scripts/run-z3-proofs.sh
