# Documentation Validation Workflow
#
# Comprehensive validation of all documentation including Rustdoc, doc tests,
# and code samples in Markdown files. Ensures documentation stays accurate,
# compilable, and up-to-date with the codebase.
#
# Runs on:
#   - Push to main branch (only for relevant file changes)
#   - Pull requests to main (only for relevant file changes)
#
# Jobs:
#   - rustdoc: Build and validate Rust API documentation
#   - doc-tests: Run tests embedded in documentation comments
#   - markdown-code-samples: Extract and validate code blocks from Markdown
#   - link-check: Validate all internal and external links
#
# Features:
#   - Strict rustdoc validation (broken links, invalid code blocks)
#   - Strict MkDocs build for rendered pages, themes, and assets
#   - Multi-language code block validation (Rust, JSON, YAML, TOML, Bash)
#   - Smart skipping of placeholder/incomplete code
#   - Comprehensive link checking with anchor validation
#   - File-based counter propagation to avoid bash subshell issues

name: Documentation Validation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "rust-toolchain.toml"
      - ".lychee.toml"
      - "scripts/read-toml-string.sh"
      - "scripts/check-internal-links.sh"
      - "scripts/install-lychee.sh"
      - "scripts/download-verified.sh"
      - "scripts/run-lychee.sh"
      - ".github/workflows/doc-validation.yml"
      - ".github/scripts/**"
      - ".github/test-fixtures/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "rust-toolchain.toml"
      - ".lychee.toml"
      - "scripts/read-toml-string.sh"
      - "scripts/check-internal-links.sh"
      - "scripts/install-lychee.sh"
      - "scripts/download-verified.sh"
      - "scripts/run-lychee.sh"
      - ".github/workflows/doc-validation.yml"
      - ".github/scripts/**"
      - ".github/test-fixtures/**"

# Minimal required permissions (security best practice)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep these pinned versions in sync with .devcontainer/Dockerfile ARGs.
  # Enforced by scripts/check-tooling-parity.sh.
  TAPLO_CLI_VERSION: 0.10.0
  YQ_VERSION: v4.53.2
  # Enforce strict rustdoc validation
  RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::invalid_codeblock_attributes"

jobs:
  rustdoc:
    name: Rustdoc Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Generous timeout for building documentation with all features
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Build rustdoc with strict warnings (no broken links, valid code blocks)
      - name: Build rustdoc
        run: cargo doc --locked --no-deps --all-features

      # Also check without features to catch feature-gated doc issues
      - name: Build rustdoc (no features)
        run: cargo doc --locked --no-deps --no-default-features

  doc-tests:
    name: Documentation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Generous timeout for running all doc tests with features
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      # Run all doc tests (tests embedded in /// comments)
      - name: Run doc tests
        run: cargo test --locked --doc

      # Run doc tests with all features enabled
      - name: Run doc tests (all features)
        run: cargo test --locked --doc --all-features

  markdown-code-samples:
    name: Markdown Code Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Longer timeout - validates multiple languages (Rust, JSON, YAML, TOML, Bash)
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read Rust toolchain
        id: toolchain
        shell: bash
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install shellcheck
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck workflow scripts
        run: |
          set -euo pipefail

          echo "Validating inline shell scripts in workflow..."
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          workflow_file=".github/workflows/doc-validation.yml"

          # Preserve the exact inline wrapper and helper coverage formerly run
          # in a separate hosted job.
          awk '
            # Use flag-based extraction instead of range pattern to avoid
            # the start line matching the end pattern (both begin with "      - name:")
            found==0 && /^      - name: Extract and validate Rust code blocks/ { found=1; next }
            found && /run: \|/ { in_script=1; next }
            in_script && /^      - name:/ { exit }
            # Extract script content: skip the 10-space indentation.
            in_script && /^          / { print substr($0, 11) }
          ' "$workflow_file" > "$TEMP_DIR/rust_validation.sh"

          for script in "$TEMP_DIR"/*.sh; do
            [ -f "$script" ] || continue
            echo "Checking: $(basename "$script")"
            if ! shellcheck -s bash "$script"; then
              echo "✗ Shellcheck found issues in inline script: $(basename "$script")"
              exit 1
            fi
          done

          echo "Validating workflow helper shell scripts..."
          echo "Checking Rust markdown validator helper"
          if ! shellcheck -s bash .github/scripts/validate-rust-markdown-blocks.sh; then
            echo "✗ Shellcheck found issues in Rust markdown validator helper"
            exit 1
          fi
          echo "Checking concurrent fuzz supervisor helper"
          if ! shellcheck -s bash .github/scripts/run-fuzz-targets.sh; then
            echo "✗ Shellcheck found issues in concurrent fuzz supervisor helper"
            exit 1
          fi
          echo "✓ All workflow inline scripts pass shellcheck validation"

      # Build the library first so we have it available for compilation validation
      - name: Build library
        run: cargo build --lib --locked --all-features

      - name: Extract and validate Rust code blocks
        run: |
          set -euo pipefail
          bash .github/scripts/validate-rust-markdown-blocks.sh

      - name: Validate Rust markdown extractor fixtures
        run: |
          set -euo pipefail
          bash .github/test-fixtures/validate-test-cases.sh

      # Validate non-Rust code blocks (JSON, YAML, TOML, Bash)
      - name: Validate JSON code blocks
        run: |
          set -euo pipefail

          echo "Validating JSON code blocks..."
          # Constants - use UPPERCASE for cross-script values
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Use files to accumulate counters (avoids bash subshell scope issues)
          COUNTER_FILE="$TEMP_DIR/counters"
          # Counter file format: 2 space-separated integers (total failed)
          echo "0 0" > "$COUNTER_FILE"

          find . \
            \( -type d \( -name "target" \
            -o -name "third_party" \
            -o -name ".git" \
            -o -name "node_modules" \
            -o -name "test-fixtures" \) \) -prune \
            -o -type f -name "*.md" -print | sort | while read -r md_file; do

            awk '
              # Skip content inside outer fences (4+ backticks) which may contain
              # nested 3-backtick examples (e.g., documentation about code blocks).
              # CommonMark: closing fences may have trailing spaces/tabs.
              /^````/ {
                if (!outer_fence) {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  outer_fence = n
                } else {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  if (n >= outer_fence && s ~ /^[ \t]*$/) outer_fence = 0
                }
                next
              }
              outer_fence { next }
              # Match opening fence for JSON code blocks
              /^```json$/ {
                in_block = 1
                block_start = NR
                content = ""
                next
              }
              # Match closing fence only if in a block
              /^```$/ && in_block {
                # Output format: line_number<TAB>content<NUL>
                # Tab is used as field separator, NUL as record separator
                # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                printf "%s\t%s%c", block_start, content, 0
                in_block = 0
                next
              }
              # Accumulate content while in block
              in_block {
                content = content $0 "\n"
              }
              # Handle unclosed blocks at end of file
              END {
                if (in_block) {
                  # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                  printf "%s\t%s%c", block_start, content, 0
                }
              }
            ' "$md_file" | while IFS=$'\t' read -r -d '' line_num content; do
              [ -z "$content" ] && continue

              # Read current counters from file (local variables - lowercase)
              read -r total failed < "$COUNTER_FILE"
              total=$((total + 1))

              test_file="$TEMP_DIR/test_$total.json"
              echo "$content" > "$test_file"

              if ! jq empty "$test_file" 2>/dev/null; then
                echo "✗ Invalid JSON in $md_file at line $line_num"
                cat "$test_file"
                failed=$((failed + 1))
              fi

              # Write updated counters back to file
              echo "$total $failed" > "$COUNTER_FILE"
            done
          done

          # Read final counters
          read -r total failed < "$COUNTER_FILE"

          # Exit with error code 1 if any blocks failed validation
          if [ "$failed" -gt 0 ]; then
            echo "JSON validation failed: $failed/$total blocks invalid"
            exit 1  # Non-zero exit code indicates failure
          fi
          echo "✓ All JSON blocks valid ($total checked)"

      - name: Validate YAML code blocks
        run: |
          set -euo pipefail

          echo "Validating YAML code blocks..."
          # Constants - use UPPERCASE for cross-script values
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Install yq for YAML validation
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

          # Use files to accumulate counters (avoids bash subshell scope issues)
          COUNTER_FILE="$TEMP_DIR/counters"
          # Counter file format: 2 space-separated integers (total failed)
          echo "0 0" > "$COUNTER_FILE"

          find . \
            \( -type d \( -name "target" \
            -o -name "third_party" \
            -o -name ".git" \
            -o -name "node_modules" \
            -o -name "test-fixtures" \) \) -prune \
            -o -type f -name "*.md" -print | sort | while read -r md_file; do

            awk '
              # Skip content inside outer fences (4+ backticks)
              /^````/ {
                if (!outer_fence) {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  outer_fence = n
                } else {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  if (n >= outer_fence && s ~ /^[ \t]*$/) outer_fence = 0
                }
                next
              }
              outer_fence { next }
              # Match opening fence for YAML code blocks
              /^```yaml$/ || /^```yml$/ {
                in_block = 1
                block_start = NR
                content = ""
                next
              }
              # Match closing fence only if in a block
              /^```$/ && in_block {
                # Output format: line_number<TAB>content<NUL>
                # Tab is used as field separator, NUL as record separator
                # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                printf "%s\t%s%c", block_start, content, 0
                in_block = 0
                next
              }
              # Accumulate content while in block
              in_block {
                content = content $0 "\n"
              }
              # Handle unclosed blocks at end of file
              END {
                if (in_block) {
                  # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                  printf "%s\t%s%c", block_start, content, 0
                }
              }
            ' "$md_file" | while IFS=$'\t' read -r -d '' line_num content; do
              [ -z "$content" ] && continue

              # Read current counters from file (local variables - lowercase)
              read -r total failed < "$COUNTER_FILE"
              total=$((total + 1))

              test_file="$TEMP_DIR/test_$total.yaml"
              echo "$content" > "$test_file"

              if ! yq eval . "$test_file" >/dev/null 2>&1; then
                echo "✗ Invalid YAML in $md_file at line $line_num"
                cat "$test_file"
                failed=$((failed + 1))
              fi

              # Write updated counters back to file
              echo "$total $failed" > "$COUNTER_FILE"
            done
          done

          # Read final counters
          read -r total failed < "$COUNTER_FILE"

          # Exit with error code 1 if any blocks failed validation
          if [ "$failed" -gt 0 ]; then
            echo "YAML validation failed: $failed/$total blocks invalid"
            exit 1  # Non-zero exit code indicates failure
          fi
          echo "✓ All YAML blocks valid ($total checked)"

      - name: Install TOML validator
        uses: taiki-e/install-action@v2.85.10
        with:
          tool: taplo-cli@${{ env.TAPLO_CLI_VERSION }}
          fallback: none

      - name: Validate TOML code blocks
        run: |
          set -euo pipefail

          echo "Validating TOML code blocks..."
          taplo --version

          # Constants - use UPPERCASE for cross-script values
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Use files to accumulate counters (avoids bash subshell scope issues)
          COUNTER_FILE="$TEMP_DIR/counters"
          # Counter file format: 2 space-separated integers (total failed)
          echo "0 0" > "$COUNTER_FILE"

          find . \
            \( -type d \( -name "target" \
            -o -name "third_party" \
            -o -name ".git" \
            -o -name "node_modules" \
            -o -name "test-fixtures" \) \) -prune \
            -o -type f -name "*.md" -print | sort | while read -r md_file; do

            awk '
              # Skip content inside outer fences (4+ backticks)
              /^````/ {
                if (!outer_fence) {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  outer_fence = n
                } else {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  if (n >= outer_fence && s ~ /^[ \t]*$/) outer_fence = 0
                }
                next
              }
              outer_fence { next }
              # Match opening fence for TOML code blocks
              /^```toml$/ {
                in_block = 1
                block_start = NR
                content = ""
                next
              }
              # Match closing fence only if in a block
              /^```$/ && in_block {
                # Output format: line_number<TAB>content<NUL>
                # Tab is used as field separator, NUL as record separator
                # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                printf "%s\t%s%c", block_start, content, 0
                in_block = 0
                next
              }
              # Accumulate content while in block
              in_block {
                content = content $0 "\n"
              }
              # Handle unclosed blocks at end of file
              END {
                if (in_block) {
                  # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                  printf "%s\t%s%c", block_start, content, 0
                }
              }
            ' "$md_file" | while IFS=$'\t' read -r -d '' line_num content; do
              [ -z "$content" ] && continue

              # Read current counters from file (local variables - lowercase)
              read -r total failed < "$COUNTER_FILE"
              total=$((total + 1))

              test_file="$TEMP_DIR/test_$total.toml"
              echo "$content" > "$test_file"

              if ! taplo check "$test_file" 2>/dev/null; then
                echo "✗ Invalid TOML in $md_file at line $line_num"
                cat "$test_file"
                failed=$((failed + 1))
              fi

              # Write updated counters back to file
              echo "$total $failed" > "$COUNTER_FILE"
            done
          done

          # Read final counters
          read -r total failed < "$COUNTER_FILE"

          # Exit with error code 1 if any blocks failed validation
          if [ "$failed" -gt 0 ]; then
            echo "TOML validation failed: $failed/$total blocks invalid"
            exit 1  # Non-zero exit code indicates failure
          fi
          echo "✓ All TOML blocks valid ($total checked)"

      - name: Validate Bash code blocks
        run: |
          set -euo pipefail

          echo "Validating Bash code blocks..."
          # Constants - use UPPERCASE for cross-script values
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT

          # Use files to accumulate counters (avoids bash subshell scope issues)
          COUNTER_FILE="$TEMP_DIR/counters"
          # Counter file format: 2 space-separated integers (total failed)
          echo "0 0" > "$COUNTER_FILE"

          find . \
            \( -type d \( -name "target" \
            -o -name "third_party" \
            -o -name ".git" \
            -o -name "node_modules" \
            -o -name "test-fixtures" \) \) -prune \
            -o -type f -name "*.md" -print | sort | while read -r md_file; do

            awk '
              # Skip content inside outer fences (4+ backticks)
              /^````/ {
                if (!outer_fence) {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  outer_fence = n
                } else {
                  n = 0; s = $0; while (substr(s,1,1)=="`") { n++; s = substr(s,2) }
                  if (n >= outer_fence && s ~ /^[ \t]*$/) outer_fence = 0
                }
                next
              }
              outer_fence { next }
              # Match opening fence for Bash/shell code blocks
              /^```bash$/ || /^```sh$/ || /^```shell$/ {
                in_block = 1
                block_start = NR
                content = ""
                next
              }
              # Match closing fence only if in a block
              /^```$/ && in_block {
                # Output format: line_number<TAB>content<NUL>
                # Tab is used as field separator, NUL as record separator
                # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                printf "%s\t%s%c", block_start, content, 0
                in_block = 0
                next
              }
              # Accumulate content while in block
              in_block {
                content = content $0 "\n"
              }
              # Handle unclosed blocks at end of file
              END {
                if (in_block) {
                  # POSIX-compatible: Use printf "%c", 0 instead of "\0" for mawk compatibility
                  printf "%s\t%s%c", block_start, content, 0
                }
              }
            ' "$md_file" | while IFS=$'\t' read -r -d '' line_num content; do
              [ -z "$content" ] && continue
              # Skip placeholder/example-only blocks
              if grep -qE '^#.*example|^# Note:|^\.\.\.$' <<< "$content"; then
                continue
              fi

              # Read current counters from file (local variables - lowercase)
              read -r total failed < "$COUNTER_FILE"
              total=$((total + 1))

              test_file="$TEMP_DIR/test_$total.sh"
              echo "$content" > "$test_file"

              # First check syntax with bash -n
              if ! bash -n "$test_file" 2>/dev/null; then
                echo "✗ Invalid Bash syntax in $md_file at line $line_num"
                cat "$test_file"
                failed=$((failed + 1))
              # Then validate with shellcheck for comprehensive checking
              # Note: Warnings are non-fatal because markdown examples often use simplified bash
              # for illustration purposes (e.g., missing quotes, unused variables for clarity).
              # Only syntax errors (caught by bash -n above) are considered fatal.
              elif ! shellcheck -s bash "$test_file" 2>"$TEMP_DIR/shellcheck_$total.txt"; then
                echo "⚠ Shellcheck warnings in $md_file at line $line_num (non-fatal):"
                cat "$TEMP_DIR/shellcheck_$total.txt"
                # Common acceptable warnings in documentation:
                # SC2034: unused variables (kept for documentation clarity)
                # SC2086: unquoted variables (simplified examples)
                # SC2046: unquoted command substitution (simplified examples)
              fi

              # Write updated counters back to file
              echo "$total $failed" > "$COUNTER_FILE"
            done
          done

          # Read final counters
          read -r total failed < "$COUNTER_FILE"

          # Exit with error code 1 if any blocks failed validation
          if [ "$failed" -gt 0 ]; then
            echo "Bash validation failed: $failed/$total blocks invalid"
            exit 1  # Non-zero exit code indicates failure
          fi
          echo "✓ All Bash blocks valid ($total checked)"

  link-check:
    name: Documentation Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build rendered documentation
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
      - name: Install lychee
        run: bash scripts/install-lychee.sh
      # Required validation checks repository-owned links only. External hosts are
      # audited by the scheduled, non-gating pass in link-check.yml so their
      # availability cannot make pull-request validation flaky.
      - name: Check repository links with lychee (offline)
        shell: bash
        run: >-
            bash scripts/run-lychee.sh --verbose --no-progress --offline
            --accept 200,204,301,302,307,308,429
            --config .lychee.toml
            --remap 'https://github.com/Ambiguous-Interactive/signal-fish-server/blob/main/([^#?]*)([#?].*)? file://${{ github.workspace }}/$1'
            --remap 'https://crates\.io/crates/signal-fish-server https://index.crates.io/si/gn/signal-fish-server'
            --remap 'https://img\.shields\.io/crates/v/signal-fish-server\?style=for-the-badge https://index.crates.io/si/gn/signal-fish-server'
            --timeout 30
            --max-retries 3
            --exclude-path './target/*'
            --exclude-path './third_party/*'
            --exclude-path './node_modules/*'
            --exclude-path './.git/*'
            --exclude-path './.github/test-fixtures/*'
            --exclude-path './test-fixtures/*'
            --exclude-path '\.lychee\.toml'
            --exclude-path site/
            --
            '**/*.md'
        env:
          # Optional: Add GitHub token to avoid rate limiting on GitHub links
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Fallback: Custom internal link validator (more detailed errors)
      - name: Check internal markdown links
        run: bash scripts/check-internal-links.sh --all
