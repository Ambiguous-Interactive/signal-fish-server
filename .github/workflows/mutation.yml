# Mutation Testing Workflow
#
# Runs cargo-mutants over the protocol DECISION logic (the session-plan
# selection ladder, signaling glare/size/gating, input validation, room-code
# generation — see .cargo/mutants.toml) to measure TEST STRENGTH: a surviving
# mutant marks a behavioral change the test suite does not catch, i.e. a place a
# real bug of that shape could ship undetected.
#
# This is a periodic health check (weekly + manual), not a per-PR gate: a fresh
# survivor is a signal to add a test, not necessarily a blocking regression. The
# full mutant report is always uploaded; the job fails when any mutant survives
# so the survivors are triaged deliberately.
#
# Scope and the fast `--lib` oracle are configured in .cargo/mutants.toml.

name: Mutation Testing

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/mutation.yml"
      - "src/server/session_policy.rs"
      - "src/server/signaling.rs"
      - "src/server/relay_policy.rs"
      - "src/protocol/validation.rs"
      - "src/protocol/room_codes.rs"
      - "src/protocol/error_codes.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutants:
    name: cargo-mutants (protocol logic) shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # Per-shard timeout. The full single-job run was ~20 min under
    # timeout-minutes 45. Each shard tests ~1/6 of the mutants (~33) plus one
    # baseline build (rust-cache accelerated), so ~5-8 min is realistic; 20 min
    # leaves generous headroom for a cold cache or a loaded runner.
    timeout-minutes: 20
    strategy:
      # Run every shard even if one finds a survivor (or fails), so a single
      # surviving mutant never masks survivors in other shards and all gaps
      # surface in one workflow run.
      fail-fast: false
      matrix:
        # cargo-mutants shard indices are 0-BASED: --shard k/N spans k = 0..N-1
        # (verified locally on cargo-mutants 27.1.0 — `--shard 0/6` is accepted
        # and `--shard 6/6` yields 0 mutants). Shards 0/6..5/6 are an exact,
        # non-overlapping partition of `cargo mutants --list` (199 mutants:
        # 34+34+34+34+34+29 = 199; sorted union == full list, no overlap), so no
        # mutant is skipped or double-counted.
        #
        # N=6 chosen for the 4-vCPU/16 GB ubuntu-latest runner: it cuts
        # wall-clock ~6x (each shard ~33 mutants vs ~199) while keeping the
        # redundant per-shard baseline rebuild cost modest (6 baseline builds
        # total, each rust-cache-warmed). Going much higher (e.g. >8) makes the
        # one-time baseline build dominate each shard's runtime for diminishing
        # returns.
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Read Rust toolchain
        id: toolchain
        run: |
          CHANNEL=$(bash scripts/read-toml-string.sh rust-toolchain.toml channel toolchain || true)
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: Could not extract channel from rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          # Skip cache writes on untrusted fork PRs (restore still works), so a
          # fork cannot poison the shared cache. Same gate as webrtc-interop.yml.
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2.81.8
        with:
          tool: cargo-mutants

      - name: Run mutation testing (config-scoped)
        # -j 4 uses the runner's 4 vCPUs. --cargo-arg=--locked forwards --locked
        # to the inner cargo build/test (cargo-mutants itself rejects a bare
        # --locked), pinning the resolve to Cargo.lock for reproducibility.
        run: cargo mutants --no-shuffle --shard ${{ matrix.shard }}/6 -j 4 --cargo-arg=--locked

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore
