\* TLC model: desired topology ceiling = mesh with BOTH upgrade transports
\* DISABLED (session.enable_webrtc = false, session.enable_direct = false),
\* so every ladder rung is config-gated off regardless of member capability
\* and every room floors to relay.
\*
\* Players (MeshScenarioCaps — deliberately the most capable mix, see
\* SignalFishSession.tla): the members COULD run mesh+webrtc, host+webrtc,
\* and host+direct; the ONLY thing denying the upgrade is transport_enabled.
\* This pins the enabled-gate denial path end-to-end via RelayFloorOnly:
\* nothing is ever stored, every v3 member receives an explicit relay plan,
\* and v2 members receive none, in every reachable state. The plan/emission
\* invariants are deliberately non-vacuous here; all stay listed uniformly.
\* The DESIRED = relay ceiling (denial by topology rank instead of the
\* config gate) is covered by the randomized-config proptests
\* (session_policy_tests.rs::properties).
SPECIFICATION Spec
CONSTANTS
    PLAYERS = {1, 2, 3, 4, 5}
    MAX_PLAYERS = 3
    CHURN_BUDGET = 10
    DESIRED = "mesh"
    WEBRTC_ENABLED = FALSE
    DIRECT_ENABLED = FALSE
    NoPlayer = NoPlayer
    NoPlan = NoPlan
    NoDelivery = NoDelivery
    NoEmission = NoEmission
    Caps <- MeshScenarioCaps
INVARIANTS
    TypeOK
    AuthorityIsCurrentMember
    PlanLegality
    V2Gating
    HostValid
    CeilingRespected
    PeerCapability
    MeshPlanExactness
    GlareAntisymmetry
    StarProperty
    EmissionMatchesSessionState
    NoEmissionWithoutQualifier
    PublicationCoverage
    RelayFloorOnly
PROPERTIES
    StickyPairProperty
    HostDepartureHealedSameStep
