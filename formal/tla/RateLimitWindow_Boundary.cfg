\* Boundary-tight rate limiter: every budget capped at exactly 1 with
\* WINDOW = 1, so every tick after the first is a window boundary and the
\* lazy reset fires between nearly every pair of admissions. The honest
\* fixed-window guarantees must hold at the tightest corner. Tiny (<5s TLC).
SPECIFICATION Spec
CONSTANTS
    MAX_CREATIONS = 1
    MAX_JOINS = 1
    MAX_SIGNALS = 1
    MAX_ERRORS = 1
    WINDOW = 1
    HORIZON = 4
INVARIANTS
    TypeOK
    BudgetsNeverExceedCaps
    WindowAnchored
    CurrentWindowWithinCap
