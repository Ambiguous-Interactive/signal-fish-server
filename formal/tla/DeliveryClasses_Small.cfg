\* Delivery-class + wire-accountability model. Capacity 2 and the two concrete
\* keys A/B are the minimum that reaches the A1,B2,A3 keyed-coalescing
\* counterexample. LatBudget=3 reaches that trace; one reliable and two volatile
\* offers retain every class and both volatile full-queue policies without
\* inflating the exhaustive state space. All seeded bugs are pinned FALSE.
\* Flipping
\* ScalarInPlaceBug alone reproduces the exact scalar-range overclaim and
\* in-place wire reordering documented in the module header and README.
SPECIFICATION Spec
CONSTANTS
    Keys = {"A", "B"}
    RelBudget = 1
    LatBudget = 3
    BeBudget = 2
    QCAP = 2
    ReportCap = 1
    ScalarInPlaceBug = FALSE
    SilentSupersedeBug = FALSE
    CoalesceReliableBug = FALSE
    MisdropLatestBug = FALSE
    ReportOverstateBug = FALSE
INVARIANTS
    TypeOK
    UniqueSeqs
    WrittenMatchesWire
    ReliableConservation
    CoalesceNeverTouchesReliable
    LatestConservation
    VolatileConservation
    LatestValueLastWrite
    ExactGapAccounting
    ReportsRemainCausal
    ReportsAreCausallyPrioritized
    QueueSeqMonotone
    WireSeqMonotone
    ReportHonest
    DropsWithCloseAreLoud
    LossyClassesNeverPark
    ShutdownWins
PROPERTIES
    ShutdownPriorityStable
