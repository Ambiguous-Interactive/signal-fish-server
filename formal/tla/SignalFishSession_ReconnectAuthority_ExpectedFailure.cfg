\* EXPECTED_TLC_FAILURE: Invariant CapabilityReconnectPreservesSuccessorAuthority is violated.
\* A disconnect-time authority snapshot is stale once a successor has claimed
\* the vacant role; reconnect must not overwrite that live room state.
SPECIFICATION Spec
CONSTANTS
    PLAYERS = {1, 2, 3}
    MAX_PLAYERS = 3
    CHURN_BUDGET = 7
    DESIRED = "host"
    WEBRTC_ENABLED = TRUE
    DIRECT_ENABLED = TRUE
    CAPABILITY_RECONNECT_ENABLED = TRUE
    SkipCapabilityPublicationBug = FALSE
    UseStaleReconnectCapabilitiesBug = FALSE
    ReorderReconnectBug = FALSE
    OverwriteSuccessorAuthorityBug = TRUE
    NoPlayer = NoPlayer
    NoPlan = NoPlan
    NoDelivery = NoDelivery
    NoEmission = NoEmission
    InitialCaps <- ReconnectScenarioCaps
INVARIANTS
    TypeOK
    CapabilityReconnectPublishesCompleteSnapshot
    CapabilityReconnectUsesFreshProfile
    CapabilityReconnectPreservesJoinPriority
    CapabilityReconnectPreservesSuccessorAuthority
    AuthorityIsCurrentMember
    PlanLegality
    V2Gating
    HostValid
    CeilingRespected
    PeerCapability
    MeshPlanExactness
    GlareAntisymmetry
    StarProperty
    EmissionMatchesSessionState
    NoEmissionWithoutQualifier
    PublicationCoverage
