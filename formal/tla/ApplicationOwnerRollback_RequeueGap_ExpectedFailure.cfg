\* EXPECTED_TLC_FAILURE: Invariant RejectedReconnectRequeuesBeforeLaneRelease is violated.
\* A rejected reconnect must return its bare detach before releasing the room
\* lane; cleanup can overtake a seeded delayed handoff.
SPECIFICATION Spec
CONSTANTS
    Players = {pendingA, pendingB, adopter}
    PendingPlayers = {pendingA, pendingB}
    Adopter = adopter
    Apps = {appA, appB}
    OriginalApp = appA
    OtherApp = appB
    DuplicateOwnerRollbackBug = FALSE
    UseStaleCleanupSnapshotBug = FALSE
    SkipLiveRouteRereadBug = FALSE
    RequeueAfterLaneBug = TRUE
    ResurrectDeletedRoomBug = FALSE
INVARIANTS
    TypeOK
    OwnerRollbackUnique
    RollbackPlacementExact
    CleanupUsesFreshRollbackProvenance
    CleanupCannotRemoveLiveReconnect
    RejectedReconnectRequeuesBeforeLaneRelease
    DeletedRoomCannotBeResurrected
    LiveMembershipExact
    CommittedOwnerStable
    UncommittedOwnerHasRollback
    DeletedRoomIsTerminal
