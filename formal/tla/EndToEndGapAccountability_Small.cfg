\* Flagship end-to-end gap-accountability model at the smallest configuration
\* that exercises every composed interaction: TWO senders (MANDATORY — the
\* single-sender justified-flag abstraction is unsound at >= 2 senders), ONE
\* observing recipient (D4's novelty is on the per-sender and socket-buffer /
\* snapshot-heal axes, not the two-recipient observe-vs-evict contrast, which
\* is SequencedRelay's job), 1-slot queue + 1-slot socket buffer (a full queue
\* is reachable so eviction fires, and queue-vs-sockBuf are distinct stages both
\* wiped at eviction), a 1-slot replay ring (control-event truncation is
\* reachable), a 3-message send budget spanning a full leave+rejoin epoch reset,
\* and one leave+rejoin cycle + one eviction+reconnect cycle. All three seeded
\* bugs pinned FALSE (safe). See the module header for the SingleFlagBug and
\* NoBaselineResetBug (each violates ClientCanClassify) and NoSnapshotReconcileBug
\* (violates MembershipEventuallyHonest) non-vacuity checks.
SPECIFICATION Spec
CONSTANTS
    Senders = {"s1", "s2"}
    Recipients = {"c1"}
    SendBudget = 3
    QCAP = 1
    SOCKCAP = 1
    RINGCAP = 1
    CycleBudget = 1
    ReconnectBudget = 1
    SingleFlagBug = FALSE
    NoBaselineResetBug = FALSE
    NoSnapshotReconcileBug = FALSE
INVARIANTS
    TypeOK
    ClientCanClassify
    DroppedNeverObserved
    RingSnapshotSound
    MembershipEventuallyHonest
