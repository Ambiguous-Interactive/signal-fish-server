\* Exhaustive positive configuration. Capacity two is the smallest lane that
\* distinguishes the first full-to-non-full transition from later drains.
\* DEADLINE=2 and MAX_TIME=3 cover release before, exactly at, and after the
\* exclusive deadline, including a producer not polled until time 3.
SPECIFICATION Spec
CONSTANTS
    QUEUE_CAPACITY = 2
    DEADLINE = 2
    MAX_TIME = 3
    TimerFirstBug = FALSE
INVARIANTS
    TypeOK
    QueueBounded
    AvailabilityExact
    AdmissionConservation
    ResolutionConsistent
    NoFalseSlowConsumer
    NoLateRevival
