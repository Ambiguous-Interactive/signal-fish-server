\* EXPECTED_TLC_FAILURE: Invariant NoFalseSlowConsumer is violated.
\* Seed the pre-#291 timer-first behavior. TLC finds a retained release strictly
\* before the deadline followed by a deadline-or-later producer poll: capacity
\* remains available, yet the waiter is evicted. The invariant diagnostic, not
\* one scheduler-equivalent trace's exact ticks, is the expected-failure oracle.
SPECIFICATION Spec
CONSTANTS
    QUEUE_CAPACITY = 2
    DEADLINE = 2
    MAX_TIME = 3
    TimerFirstBug = TRUE
INVARIANTS
    TypeOK
    QueueBounded
    AvailabilityExact
    AdmissionConservation
    ResolutionConsistent
    NoFalseSlowConsumer
    NoLateRevival
