\* Fair, deterministic stale-generation scenario: reserve every sibling,
\* replace the generation, observe Canceled, release/refresh, then commit.
SPECIFICATION RetryScenarioSpec
CONSTANTS
    Recipients = {r1, r2}
    Phases = {0, 1}
    Actor = r1
    PartialReservationBug = FALSE
    SkipRoutingValidationBug = FALSE
    SkipEmptyRoutingValidationBug = FALSE
    PhaseBoundaryBug = FALSE
    DuplicateCallbackBug = FALSE
    MisreportCallbackBug = FALSE
    MiscountFailedFramesBug = FALSE
    OmitPermitReleaseBug = FALSE
    OmitRetryReleaseBug = FALSE
    ConsumeHookOnRetryBug = FALSE
    ConsumePhaseCallbackOnRetryBug = FALSE
    SkipRetryRefreshBug = FALSE
INVARIANTS
    TypeOK
    HookAfterExactReservation
    HookAfterExactRoutingValidation
    HookConsumptionExact
    CallbackRetentionExact
    RetrySnapshotFresh
    RetryCancellationExact
    PhaseBoundaryExact
    CallbackExactlyOnce
    CallbackPhaseZeroFailuresExact
    FailedFrameAccountingExact
    PermitAccountingExact
    NoEnqueueBeforeHookAccepts
    OutcomeExact
PROPERTY RetryScenarioCompletes
