\* Exhaustive reconnect refinement: a finalized host+webrtc room disconnects
\* its sticky host, performs departure failover, and later restores that member
\* from a fresh v3 relay-only socket. Publication must use the fresh profile,
\* retain its saved join priority, and preserve any successor authority.
SPECIFICATION Spec
CONSTANTS
    PLAYERS = {1, 2, 3}
    MAX_PLAYERS = 3
    CHURN_BUDGET = 7
    DESIRED = "host"
    WEBRTC_ENABLED = TRUE
    DIRECT_ENABLED = TRUE
    CAPABILITY_RECONNECT_ENABLED = TRUE
    SkipCapabilityPublicationBug = FALSE
    UseStaleReconnectCapabilitiesBug = FALSE
    ReorderReconnectBug = FALSE
    OverwriteSuccessorAuthorityBug = FALSE
    NoPlayer = NoPlayer
    NoPlan = NoPlan
    NoDelivery = NoDelivery
    NoEmission = NoEmission
    InitialCaps <- ReconnectScenarioCaps
INVARIANTS
    TypeOK
    CapabilityReconnectPublishesCompleteSnapshot
    CapabilityReconnectUsesFreshProfile
    CapabilityReconnectPreservesJoinPriority
    CapabilityReconnectPreservesSuccessorAuthority
    AuthorityIsCurrentMember
    PlanLegality
    V2Gating
    HostValid
    CeilingRespected
    PeerCapability
    MeshPlanExactness
    GlareAntisymmetry
    StarProperty
    EmissionMatchesSessionState
    NoEmissionWithoutQualifier
    PublicationCoverage
PROPERTIES
    StickyPairProperty
    HostDepartureHealedSameStep
