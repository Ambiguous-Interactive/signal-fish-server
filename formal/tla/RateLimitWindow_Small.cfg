\* Fixed-window rate limiter at the smallest configuration that exercises
\* every entry point and at least one lazy reset: caps of 1-2, WINDOW = 2,
\* HORIZON = 5 (>= 2*WINDOW, so the documented boundary burst is reachable
\* for the sliding-window oracle in the _NaiveSlidingBound cfg). Tiny (<5s
\* TLC). See the module header for the mapping to src/rate_limit.rs and the
\* NaiveSlidingWindowBound non-vacuity check.
SPECIFICATION Spec
CONSTANTS
    MAX_CREATIONS = 1
    MAX_JOINS = 2
    MAX_SIGNALS = 2
    MAX_ERRORS = 1
    WINDOW = 2
    HORIZON = 5
INVARIANTS
    TypeOK
    BudgetsNeverExceedCaps
    WindowAnchored
    CurrentWindowWithinCap
