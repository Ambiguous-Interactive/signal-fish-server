\* Delivery-contract model at the smallest configuration that still exercises
\* every interaction: two competing senders, a 2-slot queue (both senders can
\* park simultaneously), budgets that outnumber the queue, and both close
\* reasons racing. State space is tiny (<1s TLC); see the module header for
\* the SilentDropBug non-vacuity check.
SPECIFICATION Spec
CONSTANTS
    Senders = {"s1", "s2"}
    MessagesPerSender = 2
    QueueCapacity = 2
    SilentDropBug = FALSE
INVARIANTS
    TypeOK
    Conservation
    NoSilentLoss
    ClosedQueueEmpty
PROPERTIES
    ReasonStable
    CloseCompletes
    SenderUnblocks
