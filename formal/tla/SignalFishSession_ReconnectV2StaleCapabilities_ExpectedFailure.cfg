\* EXPECTED_TLC_FAILURE: Invariant ReconnectV2ExcludesActorFromPeers is violated.
\* Resolving the reconnect publication against the old v3 profile causes fresh
\* incumbent mesh plans to re-admit the actor that returned as v2.
SPECIFICATION Spec
