\* TLC model: desired topology ceiling = host, both upgrade transports enabled.
\*
\* Players (see HostScenarioCaps in SignalFishSession.tla):
\*   1, 2 -> ProfileV3Full            (host+webrtc capable; also direct)
\*   3    -> ProfileV3HostWebRtcOnly  (host+webrtc capable)
\*   4    -> ProfileV2                (legacy v2 client)
\* MAX_PLAYERS = 3 over 4 players: {1,2,3} finalizes to host+webrtc (a real
\* 3-member star), any membership containing 4 finalizes to the relay floor,
\* and the v2 player seat-filling a live host session pins Appendix-K gating
\* (no SessionPlan reaches it, while every v3 incumbent gets a full refresh).
\* Host departures exercise the
\* capability-filtered re-election, the authority preference (including a v2
\* authority that must NOT outrank the capability gate), and the
\* no-qualifier entry drop.
SPECIFICATION Spec
CONSTANTS
    PLAYERS = {1, 2, 3, 4}
    MAX_PLAYERS = 3
    CHURN_BUDGET = 10
    DESIRED = "host"
    WEBRTC_ENABLED = TRUE
    DIRECT_ENABLED = TRUE
    NoPlayer = NoPlayer
    NoPlan = NoPlan
    NoDelivery = NoDelivery
    NoEmission = NoEmission
    InitialCaps <- HostScenarioCaps
    CAPABILITY_RECONNECT_ENABLED = FALSE
    SkipCapabilityPublicationBug = FALSE
    UseStaleReconnectCapabilitiesBug = FALSE
    ReorderReconnectBug = FALSE
    OverwriteSuccessorAuthorityBug = FALSE
INVARIANTS
    TypeOK
    AuthorityIsCurrentMember
    PlanLegality
    V2Gating
    HostValid
    CeilingRespected
    PeerCapability
    MeshPlanExactness
    GlareAntisymmetry
    StarProperty
    EmissionMatchesSessionState
    NoEmissionWithoutQualifier
    PublicationCoverage
PROPERTIES
    StickyPairProperty
    HostDepartureHealedSameStep
