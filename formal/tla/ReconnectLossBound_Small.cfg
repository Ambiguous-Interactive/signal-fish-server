\* Exhaustive positive shape: fills the outbound queue and the complete
\* post-queue/client-unobserved pipeline, spends an immediate burst, consumes
\* two elapsed rate quanta, and reconnects.
SPECIFICATION Spec
CONSTANTS
    ONLINE_BUDGET = 2
    QCAP = 1
    PCAP = 1
    BURST = 1
    RATE = 2
    WINDOW = 2
    IgnorePostQueuePipelineBug = FALSE
INVARIANTS
    TypeOK
    OldPipelineConservation
    AbsentAccounting
    AbsentArrivalCurve
    ReconnectExposureExact
    ReconnectExposureBounded
