\* Reconnect-replay model at the smallest configuration that still exercises
\* every interaction: a 2-slot ring, a 5-event budget shared by both rooms
\* (enough for interleaved cross-room gaps AND ring evictions on either side
\* of the last_sequence snapshot), and every disconnect/reconnect timing.
\* State space is tiny (<1s TLC); see the module header for the
\* NaiveGapPredicateBug and SplitBrainCounterBug non-vacuity checks — the
\* former proves the eviction watermark NECESSARY (a gap-based truncation
\* predicate lies under the global counter), the latter that replay honesty is
\* a single-instance theorem (a room-spanning split brain breaks it).
SPECIFICATION Spec
CONSTANTS
    EVENT_BUDGET = 5
    RING_CAPACITY = 2
    NaiveGapPredicateBug = FALSE
    SplitBrainCounterBug = FALSE
INVARIANTS
    TypeOK
    StatusHonest
    ReplayFaithful
    WatermarkIsMaxEvicted
