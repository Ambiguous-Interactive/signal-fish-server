\* TLC model: desired topology ceiling = mesh, both upgrade transports enabled.
\*
\* Players (see MeshScenarioCaps in SignalFishSession.tla):
\*   1, 2 -> ProfileV3Full            (mesh+host+direct+webrtc capable)
\*   3    -> ProfileV3MeshWebRtc      (mesh-capable but NOT host-capable)
\*   4    -> ProfileV3HostWebRtcOnly  (host-capable but NOT mesh-capable)
\*   5    -> ProfileV3RelayOnly       (v3 but relay-only)
\* MAX_PLAYERS = 3 over 5 players, so finalize-time membership is any
\* 3-permutation: rooms reach the mesh+webrtc rung ({1,2,3}), the
\* host-under-mesh-ceiling fallback rung ({1,2,4}), and the relay floor
\* (any membership containing 5, or {1,3,4} whose intersection is empty),
\* and post-finalize seat-fills exercise every "v3 but not session-capable"
\* late-join shape (3 into a host room, 4 into a mesh room, 5 into either).
SPECIFICATION Spec
CONSTANTS
    PLAYERS = {1, 2, 3, 4, 5}
    MAX_PLAYERS = 3
    CHURN_BUDGET = 10
    DESIRED = "mesh"
    WEBRTC_ENABLED = TRUE
    DIRECT_ENABLED = TRUE
    NoPlayer = NoPlayer
    NoPlan = NoPlan
    NoDelivery = NoDelivery
    NoEmission = NoEmission
    Caps <- MeshScenarioCaps
INVARIANTS
    TypeOK
    AuthorityIsCurrentMember
    PlanLegality
    V2Gating
    HostValid
    CeilingRespected
    PeerCapability
    MeshPlanExactness
    GlareAntisymmetry
    StarProperty
    EmissionRequiresStoredPlan
    NoEmissionWithoutQualifier
    NewPeerSoundness
PROPERTIES
    StickyPairProperty
    HostDepartureHealedSameStep
