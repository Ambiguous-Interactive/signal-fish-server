\* EXPECTED_TLC_FAILURE: Invariant PermitAccountingExact is violated.
\* A receiver-close or accountability-failure send must consume its held
\* reservation and producer capability even though no control is queued.
SPECIFICATION Spec
CONSTANTS
    PermitIds = {p1, p2}
    QueueCapacity = 2
    OmitPermitProducerBug = FALSE
    OmitDropReleaseBug = FALSE
    OmitFailedReleaseBug = TRUE
    OmitStaleReleaseBug = FALSE
    SkipScopeValidationBug = FALSE
    OmitPermitWakeBug = FALSE
INVARIANTS
    TypeOK
    QueueBounded
    PermitAccountingExact
    PermitLifecycleConservation
    NoPrematureEof
    NoStaleScopeCommit
    WaitingReceiverNotified
