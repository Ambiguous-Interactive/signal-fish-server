\* Exhaustive cross-version reconnect refinement: any member of a finalized
\* mesh+webrtc room may disconnect and return on a fresh v2 socket generation.
\* The historical v3 plan remains tagged to the old generation; the new socket
\* receives no SessionPlan and every v3 incumbent excludes it from fresh peers.
SPECIFICATION Spec
CONSTANTS
    PLAYERS = {1, 2, 3}
    MAX_PLAYERS = 3
    CHURN_BUDGET = 7
    DESIRED = "mesh"
    WEBRTC_ENABLED = TRUE
    DIRECT_ENABLED = TRUE
    CAPABILITY_RECONNECT_ENABLED = TRUE
    SkipCapabilityPublicationBug = FALSE
    UseStaleReconnectCapabilitiesBug = FALSE
    ReorderReconnectBug = FALSE
    OverwriteSuccessorAuthorityBug = FALSE
    BypassReconnectV2GateBug = FALSE
    NoPlayer = NoPlayer
    NoPlan = NoPlan
    NoDelivery = NoDelivery
    NoEmission = NoEmission
    InitialCaps <- ReconnectScenarioCaps
INVARIANTS
    TypeOK
    ReconnectV2PublishesIncumbents
    ReconnectV2WireGating
    ReconnectV2ExcludesActorFromPeers
    ReconnectV2PreservesHistoricalV3Delivery
    CapabilityReconnectPreservesJoinPriority
    CapabilityReconnectPreservesSuccessorAuthority
    AuthorityIsCurrentMember
    PlanLegality
    V2Gating
    HostValid
    CeilingRespected
    PeerCapability
    MeshPlanExactness
    GlareAntisymmetry
    StarProperty
    EmissionMatchesSessionState
    NoEmissionWithoutQualifier
    PublicationCoverage
PROPERTIES
    StickyPairProperty
    HostDepartureHealedSameStep
