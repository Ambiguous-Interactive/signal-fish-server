\* Flagship end-to-end gap-accountability model under SIMULATION (the runner
\* maps a *_Sim basename to `tlc -simulate num=20000 -depth 80`). The state
\* space here is far too large to enumerate exhaustively — deeper budgets, wider
\* queues, and a 2-slot replay ring — so it is sampled by random walk to reach
\* interleavings the exhaustive _Small model cannot afford: multiple
\* leave+rejoin epochs per sender, multiple eviction+reconnect cycles, and
\* ring-truncation of control events across the eviction cursor. Same two
\* senders / one recipient shape and the same invariants; all three seeded bugs
\* pinned FALSE (safe). A violation here would surface as a sampled trace.
SPECIFICATION Spec
CONSTANTS
    Senders = {"s1", "s2"}
    Recipients = {"c1"}
    SendBudget = 6
    QCAP = 2
    SOCKCAP = 2
    RINGCAP = 2
    CycleBudget = 2
    ReconnectBudget = 2
    SingleFlagBug = FALSE
    NoBaselineResetBug = FALSE
    NoSnapshotReconcileBug = FALSE
INVARIANTS
    TypeOK
    ClientCanClassify
    DroppedNeverObserved
    RingSnapshotSound
    MembershipEventuallyHonest
