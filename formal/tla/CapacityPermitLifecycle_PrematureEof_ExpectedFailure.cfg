\* EXPECTED_TLC_FAILURE: Invariant NoPrematureEof is violated.
\* If producers_open ignores permit_count, the last sender can drop and an
\* empty receiver can report EOF while a held permit can still commit.
SPECIFICATION Spec
CONSTANTS
    PermitIds = {p1, p2}
    QueueCapacity = 2
    OmitPermitProducerBug = TRUE
    OmitDropReleaseBug = FALSE
    OmitFailedReleaseBug = FALSE
    OmitStaleReleaseBug = FALSE
    SkipScopeValidationBug = FALSE
    OmitPermitWakeBug = FALSE
INVARIANTS
    TypeOK
    QueueBounded
    PermitAccountingExact
    PermitLifecycleConservation
    NoPrematureEof
    NoStaleScopeCommit
    WaitingReceiverNotified
