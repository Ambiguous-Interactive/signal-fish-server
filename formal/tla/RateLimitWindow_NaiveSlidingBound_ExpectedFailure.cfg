\* EXPECTED_TLC_FAILURE: Invariant NaiveSlidingWindowBound is violated.
\* CI non-vacuity oracle for the documented fixed-window trade-off
\* (src/rate_limit.rs:9-15 and the maybe_reset_window doc comment): with
\* MAX_CREATIONS = 1 and WINDOW = 2, one creation at t=0 and one at t=2 put
\* TWO admissions inside the sliding window [0, 2] — the boundary burst —
\* violating the naive sliding bound. A green run here would mean the
\* implementation silently became a sliding-window limiter and its
\* documented trade-off moved without a spec update.
SPECIFICATION Spec
CONSTANTS
    MAX_CREATIONS = 1
    MAX_JOINS = 2
    MAX_SIGNALS = 2
    MAX_ERRORS = 1
    WINDOW = 2
    HORIZON = 5
INVARIANTS
    TypeOK
    BudgetsNeverExceedCaps
    WindowAnchored
    CurrentWindowWithinCap
    NaiveSlidingWindowBound
