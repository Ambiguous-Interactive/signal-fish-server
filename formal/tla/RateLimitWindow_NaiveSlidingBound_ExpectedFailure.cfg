\* EXPECTED_TLC_FAILURE: Invariant NaiveSlidingWindowBound is violated.
\* CI non-vacuity oracle for the documented fixed-window trade-off
\* (src/rate_limit.rs:9-15 and the maybe_reset_window doc comment): with
\* MAX_CREATIONS = 1 and WINDOW = 2, one creation at t=1 (the last tick of
\* the first window) and one at t=2 (the first tick of the next) put TWO
\* admissions inside the half-open two-tick sliding window [1, 3) — the
\* boundary burst — violating the naive sliding bound. A true
\* sliding-window conversion (auth-limiter trim rule) satisfies this bound,
\* so this cfg going quiet in CI is the deliberate-spec-update signal.
SPECIFICATION Spec
