\* Exhaustive two-permit control lifecycle. Capacity two admits two held
\* permits or one held permit plus a committed transition.
SPECIFICATION Spec
CONSTANTS
    PermitIds = {p1, p2}
    QueueCapacity = 2
    OmitPermitProducerBug = FALSE
    OmitDropReleaseBug = FALSE
    OmitFailedReleaseBug = FALSE
    OmitStaleReleaseBug = FALSE
    SkipScopeValidationBug = FALSE
    OmitPermitWakeBug = FALSE
INVARIANTS
    TypeOK
    QueueBounded
    PermitAccountingExact
    PermitLifecycleConservation
    NoPrematureEof
    NoStaleScopeCommit
    WaitingReceiverNotified
