\* Sequenced-relay model at the smallest configuration that still exercises
\* every interaction: two recipients (one can be evicted while the other
\* observes the same stream), 2-slot queues (full-queue eviction is
\* reachable), a 3-message budget spanning a full leave+rejoin epoch reset,
\* and one eviction+reconnect cycle per recipient. State space is small
\* (<10s TLC); see the module header for the NoResetNotificationBug and
\* SplitBrainStampBug non-vacuity checks — the former proves the reset
\* notification necessary, the latter that the sequencing contract is a
\* single-instance theorem (a room-spanning split brain breaks it).
SPECIFICATION Spec
CONSTANTS
    Recipients = {"r1", "r2"}
    SendBudget = 3
    QueueCapacity = 2
    CycleBudget = 1
    ReconnectBudget = 1
    NoResetNotificationBug = FALSE
    SplitBrainStampBug = FALSE
INVARIANTS
    TypeOK
    GapAccountable
    DroppedQueueEmpty
    QueuedStampsWereIssued
