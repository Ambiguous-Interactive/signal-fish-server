\* Connection-teardown model at the smallest configuration that still
\* exercises every interaction: a 2-slot queue (the farewell can find it
\* full), a budget that outnumbers the queue (drain-on-close and abandoned
\* remainders both reachable), both close reasons racing, and the wedged
\* in-flight write held across the close. State space is tiny (<1s TLC);
\* see the module header for the NoPreemptionBug non-vacuity check that
\* proves the select!-against-close write wrapping necessary (a wedged
\* write otherwise pins the send task as a zombie forever).
SPECIFICATION Spec
CONSTANTS
    MessageBudget = 3
    QueueCapacity = 2
    NoPreemptionBug = FALSE
INVARIANTS
    TypeOK
    DropAccounting
    ExitedHoldsNothing
    DropsAreLoud
    FarewellNeverBlocks
    ReleaseRequiresBothExited
PROPERTIES
    ReasonStable
    NoZombie
    ResourceReclaimed
