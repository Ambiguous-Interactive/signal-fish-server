\* TLC model: desired topology ceiling = host with the WebRTC transport
\* DISABLED (session.enable_webrtc = false), so the ladder's host+webrtc rung
\* is config-gated off and rooms settle on host+direct (the LAN rung).
\*
\* Players (see HostDirectScenarioCaps in SignalFishSession.tla):
\*   1    -> ProfileV3HostDirect      (host+direct capable, NO webrtc)
\*   2, 3 -> ProfileV3Full
\*   4    -> ProfileV3RelayOnly
\* {1,2,3} finalizes to host+direct; any membership containing 4 falls to the
\* relay floor. This configuration pins the transport-enable gate
\* (transport_enabled) and that late joins publish complete host+direct plans
\* without any WebRTC-specific state; relay-floor plans are explicit resets.
SPECIFICATION Spec
CONSTANTS
    PLAYERS = {1, 2, 3, 4}
    MAX_PLAYERS = 3
    CHURN_BUDGET = 10
    DESIRED = "host"
    WEBRTC_ENABLED = FALSE
    DIRECT_ENABLED = TRUE
    NoPlayer = NoPlayer
    NoPlan = NoPlan
    NoDelivery = NoDelivery
    NoEmission = NoEmission
    InitialCaps <- HostDirectScenarioCaps
    CAPABILITY_RECONNECT_ENABLED = FALSE
    SkipCapabilityPublicationBug = FALSE
    UseStaleReconnectCapabilitiesBug = FALSE
    ReorderReconnectBug = FALSE
    OverwriteSuccessorAuthorityBug = FALSE
INVARIANTS
    TypeOK
    AuthorityIsCurrentMember
    PlanLegality
    V2Gating
    HostValid
    CeilingRespected
    PeerCapability
    MeshPlanExactness
    GlareAntisymmetry
    StarProperty
    EmissionMatchesSessionState
    NoEmissionWithoutQualifier
    PublicationCoverage
PROPERTIES
    StickyPairProperty
    HostDepartureHealedSameStep
