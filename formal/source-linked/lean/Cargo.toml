[package]
name = "signal-fish-proof-core"
version = "0.0.0"
license = "MIT"
edition = "2021"
rust-version = "1.94.0"
publish = false
authors = ["Ambiguous Interactive"]

[workspace]

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.cargo-machete]
# Dependencies are used by #[path] imported production modules, outside this crate.
ignored = ["serde", "uuid"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.0", default-features = false }
