[tools]
aeneas = "build-183e4f0"
charon = "nightly-2026.09.02"

[versions]
lean = "leanprover/lean4:v4.31.0"
hax-lean-lib = "v0.3.30"

[scenario.negotiation]
backend = "lean"
include = ["signal_fish_proof_core::protocol_core::negotiate_protocol_version"]

[scenario.capability]
backend = "lean"
include = ["signal_fish_proof_core::protocol_core::nonempty_all_support", "signal_fish_proof_core::session_capability::all_support", "signal_fish_proof_core::session_member::all_support", "signal_fish_proof_core::session_member_can_host"]

[scenario.projection]
backend = "lean"
charon-args = ["--include=uuid::Uuid"]
include = [ "signal_fish_proof_core::session_admission::joiner_supports_sticky_plan", "signal_fish_proof_core::session_capability::supports_session", "signal_fish_proof_core::session_capability::project_capabilities", "signal_fish_proof_core::session_capability::resolve_capabilities", "signal_fish_proof_core::negotiated_profile_capabilities", "{impl core::default::Default for signal_fish_proof_core::session_capability::*}::default"]
