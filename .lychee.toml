# Lychee link checker configuration
# See: https://github.com/lycheeverse/lychee

# Maximum number of concurrent network requests
max_concurrency = 16

# Accept status codes
accept = [
    "100..=103",
    "200..=299",
    "429",  # Too Many Requests (rate limiting)
]

# Exclude specific domains that return 403 for automated checks
# NOTE: Values are treated as regular expressions (not globs).
# Escape regex metacharacters: use \. for literal dots, \{ \} for braces, .* for wildcards.
exclude = [
    # Localhost and examples
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    "^https?://0\\.0\\.0\\.0",
    "^wss?://localhost",

    # Email addresses
    "^mailto:",

    # NOTE: local file:// links are intentionally NOT excluded so lychee
    # validates relative/in-repo file references against the checkout. CI also
    # remaps in-repo /blob/main/ self-URLs to file:// so new-on-branch targets
    # are checked against the working tree, not the lagging main branch
    # (see --remap in .github/workflows/link-check.yml).

    # Anchors within the same file
    "^#",

    # lib.rs returns 403 for automated checks but works in browsers
    "^https://lib\\.rs",

    # Test fixture and example URLs (from tests/ci_config_tests.rs)
    # These are placeholder/example URLs in error messages and documentation
    # (tests/ is also in exclude_path as defense-in-depth)
    "^https://github\\.com/owner/repo",
    "^https://github\\.com/%7B",           # URL-encoded brace placeholders: %7B=%7D = {}, %7B%7B%7D = {{}
    "^https://github\\.com/\\{\\}",        # Template placeholder (braces escaped for regex)

    # Placeholder server URLs used in test strings
    "^https?://your-server",

    # CHANGELOG compare links can temporarily 404 before a release tag is pushed.
    # We validate their format/consistency in scripts/check-doc-consistency.sh.
    "^https://github\\.com/Ambiguous-Interactive/signal-fish-server/compare/v[0-9]+\\.[0-9]+\\.[0-9]+\\.\\.\\.(HEAD|v[0-9]+\\.[0-9]+\\.[0-9]+)$",

    # Truncated URLs extracted by lychee from regex patterns in .lychee.toml itself.
    # These are a safety net in case the exclude_path for .lychee.toml doesn't take effect
    # (see known lychee bug: TOML exclude_path may not apply to glob-expanded paths).
    # Match with or without trailing slash since extraction behavior varies.
    "^https?://github(/|$)",
    "^https?://lib(/|$)",
]

# Retry settings
max_retries = 3
retry_wait_time = 2

# Timeout settings (in seconds)
timeout = 20

# Identify the automated client honestly for services with data-access policies.
user_agent = "signal-fish-server-link-check/1.0 (+https://github.com/Ambiguous-Interactive/signal-fish-server; mailto:eli@theambiguous.co)"


# Exclude specific file paths
# Note: TOML exclude_path may not apply to glob-expanded paths (known lychee bug).
# Critical entries are duplicated as CLI --exclude-path in .github/workflows/link-check.yml.
exclude_path = [
    "target/",
    ".git/",
    "third_party/",  # Vendored dependencies, check once during updates
    ".github/test-fixtures/",  # Intentional test fixtures with example/placeholder content
    "test-fixtures/",           # Root test fixtures directory
    "tests/",                   # Test files contain intentional placeholder/example URLs
    "node_modules/",            # Node tooling dependencies
    "\\.lychee\\.toml$",        # Defense-in-depth: CLI --exclude-path in link-check.yml is the primary mechanism
                                # (TOML exclude_path may not apply to glob-expanded paths; see link-check.yml comments)
    "site/",                    # MkDocs build output
]

# Exclude specific link patterns
exclude_link_local = true

# Include verbatim sections
include_verbatim = false

# Remap URLs.
# In-repo /blob/main/ self-links are remapped to the working tree in CI so that
# files added/moved on a branch (not yet on main) are validated against the
# checkout instead of 404ing against github.com/main. lychee's remap target must
# be an absolute URL with a scheme (a bare/relative path is rejected), and TOML
# cannot interpolate env, so the rule lives on the CLI in
# .github/workflows/link-check.yml using ${{ github.workspace }}. To reproduce
# locally (substitute $PWD for the workspace; add --offline to skip external URLs):
#   lychee --config .lychee.toml \
#     --remap "https://github.com/Ambiguous-Interactive/signal-fish-server/blob/main/([^#?]*)([#?].*)? file://$PWD/\$1" \
#     <files...>
# crates.io rejects automated requests to its rendered crate page. Validate the
# published package through the canonical sparse-index record instead. CI repeats
# this command-line remap because its working-tree remap takes CLI precedence.
remap = [
    "https://crates\\.io/crates/signal-fish-server https://index.crates.io/si/gn/signal-fish-server",
]

# Custom headers for specific domains (if needed)
# [[custom]]
# pattern = "https://example.com/"
# headers = ["Authorization: Bearer token"]
